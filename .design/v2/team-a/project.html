<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كف - مساحة المشروع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* KAAF project workspace. Composed only from the approved kit (components.html, money.html) inside the approved shell (layout.html).
   New to the kit here: the group section (intention heading + body), the key-value fact row, the progress bar, the design stage strip,
   and the reviewer chrome (notes, data-source flags). All are listed in README.md. Everything else is reused unchanged. */
:root{
  --g900:#09221e; --g800:#0f2e29; --g300:#9fb3ad; --c100:#f4eee9; --c200:#e6d9d1; --radius:6px;
  --bg:var(--c100); --surface:#fbf8f5; --head:#ebe0d8; --ink:var(--g900); --dim:#4b5f59; --line:rgba(9,34,30,.16); --hover:rgba(9,34,30,.055);
  --btn:var(--g900); --btn-h:#25544b; --btn-ink:var(--c200); --field:#fbf8f5; --fieldline:var(--g900); --focus:var(--g900);
  --err-bg:#f9e4dd; --err-ink:#7a1a0e; --err-bar:#c2321c;
  --st-run-bg:#d3e3db; --st-run-ink:#0b3b32; --st-done-bg:var(--g900); --st-done-ink:var(--c200);
  --st-stuck-bg:#f9e4dd; --st-stuck-ink:#7a1a0e; --st-post-bg:#e6d9d1; --st-post-ink:#43392f; --st-none-ink:#4b5f59;
  --note-bg:#ebe0d8; --ok-bg:#d3e3db; --ok-ink:#0b3b32; --asm-bg:#f3e4c9; --asm-ink:#4a3410;
  --scrim:rgba(3,13,11,.55); --strip:var(--c200); --shadow:0 12px 36px rgba(9,34,30,.22);
  --display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --side:256px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#061815; --surface:#0a1f1b; --head:#0f2e29; --ink:var(--c200); --dim:var(--g300); --line:rgba(230,217,209,.18); --hover:rgba(230,217,209,.06);
  --btn:var(--c200); --btn-h:#fbf6f2; --btn-ink:var(--g900); --field:#0f2e29; --fieldline:#7f9a92; --focus:var(--c200);
  --err-bg:#3b1612; --err-ink:#ffd0c6; --err-bar:#ff7b63;
  --st-run-bg:#17403a; --st-run-ink:#e6d9d1; --st-done-bg:var(--c200); --st-done-ink:var(--g900);
  --st-stuck-bg:#3b1612; --st-stuck-ink:#ffd0c6; --st-post-bg:#1d2b27; --st-post-ink:#c9bfb7; --st-none-ink:#9fb3ad;
  --note-bg:#0f2e29; --ok-bg:#17403a; --ok-ink:#e6d9d1; --asm-bg:#3d3017; --asm-ink:#f1dcae; --strip:#030d0b; --shadow:0 12px 36px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --bg:#061815; --surface:#0a1f1b; --head:#0f2e29; --ink:var(--c200); --dim:var(--g300); --line:rgba(230,217,209,.18); --hover:rgba(230,217,209,.06);
  --btn:var(--c200); --btn-h:#fbf6f2; --btn-ink:var(--g900); --field:#0f2e29; --fieldline:#7f9a92; --focus:var(--c200);
  --err-bg:#3b1612; --err-ink:#ffd0c6; --err-bar:#ff7b63;
  --st-run-bg:#17403a; --st-run-ink:#e6d9d1; --st-done-bg:var(--c200); --st-done-ink:var(--g900);
  --st-stuck-bg:#3b1612; --st-stuck-ink:#ffd0c6; --st-post-bg:#1d2b27; --st-post-ink:#c9bfb7; --st-none-ink:#9fb3ad;
  --note-bg:#0f2e29; --ok-bg:#17403a; --ok-ink:#e6d9d1; --asm-bg:#3d3017; --asm-ink:#f1dcae; --strip:#030d0b; --shadow:0 12px 36px rgba(0,0,0,.6);}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{inline-size:22px;block-size:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{inline-size:18px;block-size:18px}
.vh{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible,.is-focus{outline:3px solid var(--focus);outline-offset:3px}
bdi{unicode-bidi:isolate}

/* ---------- preview strip (NOT part of the design) ---------- */
.strip{background:var(--strip);font-size:.8125rem;position:relative;z-index:80}
.strip summary{list-style:none;display:flex;align-items:center;gap:.5rem;min-block-size:36px;padding:0 1rem;cursor:pointer}
.strip summary::-webkit-details-marker{display:none}
.strip .panelx{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;padding:.25rem 1rem .75rem}
.strip .grp{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center}
.strip .grp>b{font-weight:600;margin-inline-end:6px}
.strip button{min-block-size:36px;padding:0 .7rem;border:1px solid currentColor;background:transparent;border-radius:var(--radius);color:inherit}
.strip button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
body.embed .strip{display:none}
body.embed .app{block-size:100dvh}
#phone{position:fixed;inset:0;z-index:200;background:var(--scrim);display:none;place-items:center}
#phone[data-open="1"]{display:grid}
#phone .dev{display:grid;gap:8px;justify-items:center}
#phone iframe{inline-size:390px;block-size:min(800px,calc(100dvh - 90px));border:8px solid #000;border-radius:26px;background:var(--bg)}
#phone button{min-block-size:44px;padding:0 18px;border:1.5px solid var(--c200);background:transparent;color:var(--c200);border-radius:var(--radius)}

/* ---------- app + shell (layout.html, unchanged) ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);block-size:calc(100dvh - 36px);overflow:hidden}
.app[data-rail="1"]{--side:76px}
.side{background:var(--g900);color:var(--c200);display:flex;flex-direction:column;min-inline-size:0;min-block-size:0}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding-inline:20px 12px;block-size:72px;flex:none}
.side-top img{display:block;inline-size:104px;block-size:auto;aspect-ratio:519/155}
.coll{inline-size:44px;block-size:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--c200);border-radius:var(--radius)}
.coll:hover{background:rgba(230,217,209,.1)}
[dir="rtl"] .coll .chev,[dir="ltr"] .app[data-rail="1"] .coll .chev{transform:scaleX(-1)}
[dir="rtl"] .app[data-rail="1"] .coll .chev{transform:none}
.nav{flex:1;overflow-y:auto;padding:8px 12px 16px;min-block-size:0}
.grp-h{margin:18px 0 6px;padding-inline:12px;font:600 .8125rem/1.4 var(--display);color:var(--g300)}
.nav .grp:first-child .grp-h{margin-block-start:6px}
.nav .grp+.grp{margin-block-start:10px;border-block-start:1px solid rgba(230,217,209,.14)}
.row{position:relative;display:flex;align-items:center;gap:14px;min-block-size:44px;padding:0 12px;border-radius:var(--radius);color:var(--c200);text-decoration:none;font:500 .96875rem/1.3 var(--body)}
.row:hover{background:rgba(230,217,209,.09)}
.row:focus-visible{outline:3px solid var(--c200);outline-offset:-3px}
.row[aria-current="page"]{background:rgba(230,217,209,.15);font-weight:600}
.row[aria-current="page"]::before{content:"";position:absolute;inset-block:8px;inset-inline-start:-12px;inline-size:5px;border-start-end-radius:3px;border-end-end-radius:3px;background:var(--c200)}
.side-foot{flex:none;padding:12px;border-block-start:1px solid rgba(230,217,209,.14)}
.who{display:flex;align-items:center;gap:12px;padding:6px 6px 12px}
.av{inline-size:40px;block-size:40px;border-radius:50%;background:var(--c200);color:var(--g900);display:grid;place-items:center;font:700 1rem/1 var(--display);flex:none}
.who b{display:block;font:600 .96875rem/1.3 var(--body)}
.who span{display:block;font-size:.8125rem;color:var(--g300)}
.ctl2{display:flex;gap:8px}
.ctl2 button{flex:1;min-block-size:44px;border:1.5px solid rgba(230,217,209,.55);background:transparent;color:var(--c200);border-radius:var(--radius);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.ctl2 button:hover{background:rgba(230,217,209,.1)}
.i-short{display:none}
.app[data-rail="1"] .i-short{display:inline;font-weight:700}
.app[data-rail="1"] .lbl,.app[data-rail="1"] .grp-h,.app[data-rail="1"] .who>div,.app[data-rail="1"] .side-top img,.app[data-rail="1"] .ctl2 .t{display:none}
.app[data-rail="1"] .side-top{justify-content:center;padding:0}
.app[data-rail="1"] .row{justify-content:center;padding:0}
.app[data-rail="1"] .who{justify-content:center;padding-inline:0}
.app[data-rail="1"] .ctl2{flex-direction:column}
.main{min-inline-size:0;min-block-size:0;display:flex;flex-direction:column;overflow-y:auto;position:relative}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:12px 32px 12px;flex-wrap:wrap}
.ph h1{font:700 2rem/1.3 var(--display);margin:0}
.acts{display:flex;align-items:center;gap:12px}
.frame{padding:0 32px 56px;flex:1;min-inline-size:0}

/* ---------- kit parts, unchanged ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-block-size:48px;padding:0 22px;border:2px solid transparent;border-radius:var(--radius);background:var(--btn);color:var(--btn-ink);font:700 1rem/1 var(--display);white-space:nowrap;text-decoration:none}
.btn.sm{min-block-size:44px;padding:0 16px;font-size:.9375rem}
.btn:hover{background:var(--btn-h)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sec2{background:transparent;color:var(--ink);border-color:var(--fieldline)}
.btn.sec2:hover{background:var(--hover)}
.btn.quiet{background:transparent;color:var(--ink)}
.btn.quiet:hover{background:var(--hover)}
.ib{inline-size:44px;block-size:44px;display:inline-grid;place-items:center;border:2px solid transparent;background:transparent;color:var(--ink);border-radius:var(--radius);padding:0}
.ib:hover{background:var(--hover)}
.lnk{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;font-weight:500;background:none;border:0;padding:0}
.lnk:hover{text-decoration-thickness:3px}
a.lnk{display:inline-flex;align-items:center;min-block-size:44px}
.back{display:inline-flex;align-items:center;gap:6px;min-block-size:44px;color:var(--ink);text-decoration:none;font-weight:600}
[dir="rtl"] .back svg{transform:scaleX(-1)}
.back:hover{text-decoration:underline;text-underline-offset:4px}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-inline-size:24px;block-size:24px;padding:0 8px;border-radius:var(--radius);border:1.5px solid var(--fieldline);font:600 .8125rem/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge svg{inline-size:14px;block-size:14px}
.badge.q{border-color:var(--line);color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:7px;block-size:28px;padding-inline:10px 12px;border-radius:var(--radius);font:600 .8125rem/1 var(--body);white-space:nowrap;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 30%,transparent)}
.pill svg{inline-size:13px;block-size:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s-run{background:var(--st-run-bg);color:var(--st-run-ink)}
.s-done{background:var(--st-done-bg);color:var(--st-done-ink)}
.s-none{background:transparent;color:var(--st-none-ink);box-shadow:inset 0 0 0 1.5px currentColor}
.spin{display:none;inline-size:18px;block-size:18px;border:3px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.ban{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius);border-inline-start:6px solid var(--err-bar);background:var(--err-bg);color:var(--err-ink);font-weight:500;line-height:1.55}
.ban svg{margin-block-start:2px}
.ban.note{background:var(--note-bg);color:var(--ink);border-inline-start-color:var(--fieldline);font-weight:400}
.ban.ok{background:var(--ok-bg);color:var(--ok-ink);border-inline-start-color:var(--ok-ink)}
.ban .act{margin-inline-start:auto;flex:none}
.ban>svg,.locked>svg,.cfm svg,.rec>svg{inline-size:20px;block-size:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cfm>span{display:flex;gap:10px;align-items:flex-start}
.ban b{font-weight:700}
.ban.rowc{flex-wrap:wrap;align-items:center}
.state{border:1.5px solid var(--line);border-radius:var(--radius);background:transparent;padding:44px 24px;text-align:center;display:grid;justify-items:center;gap:10px}
.state.refused{border-style:dashed;border-color:var(--fieldline)}
.state.solid{background:var(--surface)}
.state .ico{inline-size:56px;block-size:56px;border-radius:var(--radius);display:grid;place-items:center;background:var(--head)}
.state.refused .ico{border-radius:50%;border:2px solid var(--fieldline);background:transparent}
.state .ico svg{inline-size:28px;block-size:28px}
.state h4{font:700 1.125rem/1.4 var(--display);margin:4px 0 0}
.state p{margin:0;color:var(--dim);max-inline-size:46ch;font-size:.9375rem}
.sk{display:inline-block;block-size:14px;border-radius:4px;background:linear-gradient(90deg,var(--line),var(--hover),var(--line));background-size:200% 100%;animation:sh 1.4s linear infinite;vertical-align:middle}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}}
.sk.b{display:block}

/* ---------- money half of the kit, unchanged ---------- */
.fig{font-variant-numeric:tabular-nums;font-weight:500;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.fig.neg{font-weight:600}
.fig .u{color:var(--dim);font-weight:400;font-size:.8125em;margin-inline-start:6px}
.fx{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.pv{display:inline-flex;align-items:center;gap:5px;block-size:22px;padding:0 8px;border-radius:var(--radius);font:600 .75rem/1 var(--body);white-space:nowrap;border:1px solid var(--line);color:var(--dim);background:transparent;justify-self:start;align-self:start}
.pv svg{inline-size:13px;block-size:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pv.calc{color:var(--ink)}
.pv.ent{border-color:var(--fieldline);color:var(--ink);background:var(--head)}
.pv.car{border-style:dotted;border-width:1.5px;border-color:var(--fieldline);color:var(--ink)}
.pv.asm{background:var(--asm-bg);color:var(--asm-ink);border:1.5px dashed currentColor}
.pv.asm b{font-weight:700;font-variant-numeric:tabular-nums}
button.pv{cursor:pointer}
button.pv:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wf{border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.wf-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--head);border-block-end:1px solid var(--line)}
.wf-h b{font:700 1.0625rem/1.3 var(--display)}
.wf-h .sub{color:var(--dim);font-size:.875rem}
.wf-r{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(150px,auto);gap:4px 14px;align-items:center;padding:10px 16px;border-block-end:1px solid var(--line);min-block-size:56px}
.wf-r .l b{font-weight:600;display:block}
.wf-r .l small{display:block;color:var(--dim);font-size:.8125rem;line-height:1.45}
.wf-r .p{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.wf-r .v{text-align:end;font-size:1.0625rem}
.wf-r.sub-t{background:color-mix(in srgb,var(--ink) 3%,var(--surface))}
.wf-r.res{background:var(--head);border-block-start:2px solid var(--fieldline);border-block-end:0;min-block-size:64px}
.wf-r.res .l b{font:700 1.0625rem/1.3 var(--display)}
.wf-r.res .v{font:700 1.375rem/1.2 var(--body);font-variant-numeric:tabular-nums}
.wf-r.asmrow{background:color-mix(in srgb,var(--asm-bg) 35%,var(--surface))}
.wf-f{padding:12px 16px;background:var(--surface);border-block-start:1px solid var(--line)}
.wf-f h5{margin:0 0 8px;font:600 .9375rem/1.3 var(--display)}
.wf-f dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 28px}
.wf-f dl div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:baseline;border-block-end:1px dotted var(--line);padding-block:3px}
.wf-f dt{color:var(--dim);font-size:.875rem}
.wf-f dd{margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot-note{display:flex;gap:8px;align-items:flex-start;padding:10px 16px;background:var(--note-bg);font-size:.875rem;line-height:1.5;border-block-start:1px solid var(--line)}
.foot-note svg{inline-size:18px;block-size:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-block-start:2px}
.lg{display:grid;gap:12px}
.lg-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{border:1.5px solid var(--fieldline);border-radius:var(--radius);background:var(--surface);padding:14px;display:grid;gap:6px;align-content:start;position:relative}
.tile h5{margin:0;font:700 .9375rem/1.35 var(--display)}
.tile .mn{color:var(--dim);font-size:.8125rem;line-height:1.45;min-block-size:3.6em}
.tile .big{font:700 1.375rem/1.2 var(--body);font-variant-numeric:tabular-nums}
.tile .fl{font-size:.75rem;color:var(--dim);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tile .fl svg{inline-size:13px;block-size:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile .bar{block-size:8px;border-radius:4px;background:var(--line);overflow:hidden}
.tile .bar i{display:block;block-size:100%;background:var(--ink)}
.tile .dr{min-block-size:44px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1.5px solid var(--fieldline);border-radius:var(--radius);background:transparent;font:600 .875rem/1 var(--body);justify-self:start}
.tile .dr:hover{background:var(--hover)}
.tile .dr[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.tile .dr svg{inline-size:15px;block-size:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile.open{box-shadow:0 0 0 3px var(--focus)}
.lg-no{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:.9375rem;padding:2px 2px}
.lg-no .nx{display:inline-flex;align-items:center;justify-content:center;inline-size:26px;block-size:26px;border:2px solid var(--fieldline);border-radius:50%;color:var(--ink)}
.lg-no .nx::before{content:"";inline-size:12px;block-size:2px;background:currentColor;transform:rotate(-45deg)}
.lg-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.box{border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:12px 14px;display:grid;gap:4px;align-content:start}
.box h6{margin:0;font:600 .875rem/1.35 var(--display);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box .big{font:700 1.25rem/1.2 var(--body);font-variant-numeric:tabular-nums}
.box .mn{color:var(--dim);font-size:.8125rem;line-height:1.45}
.box.unc.zero{border-color:var(--line)}
.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--radius);border-inline-start:6px solid var(--ok-ink);background:var(--ok-bg);color:var(--ok-ink);font-weight:600;line-height:1.5}
.rec svg{inline-size:20px;block-size:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rec small{font-weight:400;flex-basis:100%}
.drill{border:1.5px solid var(--fieldline);border-radius:var(--radius);background:var(--surface);overflow-x:auto}
.drill table{inline-size:100%;border-collapse:separate;border-spacing:0;font-size:.875rem;min-inline-size:760px}
.drill th{background:var(--head);text-align:start;font:600 .8125rem/1.3 var(--body);color:var(--dim);padding:0 12px;block-size:40px;white-space:nowrap}
.drill td{padding:0 12px;block-size:44px;border-block-start:1px solid var(--line);white-space:nowrap}
.drill th.n,.drill td.n{text-align:end}

/* the jump line: five links, no more. One per group the viewer may see. */

/* group section: heading column holds the INTENTION, body column holds what the type declares */

.pg{display:grid;gap:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 16px}

/* design stage strip: segment WIDTH is the fixed payment weight; fill and hatch say state */
.stg{display:flex;gap:4px;direction:inherit}

[dir="rtl"] .stg .sg.wip,[dir="rtl"] .legend i.wip{background:linear-gradient(270deg,var(--ink) 40%,transparent 40%)}

.tw{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow-x:auto}
.tw table{inline-size:100%;border-collapse:separate;border-spacing:0;font-size:.9375rem;min-inline-size:560px}
.tw th{background:var(--head);text-align:start;font:600 .8125rem/1.3 var(--body);color:var(--dim);padding:0 14px;block-size:44px;white-space:nowrap}

.t-m{display:none}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 16px;border-block-start:1px solid var(--line);min-block-size:64px;align-items:center}

.mrow .bd .trk{flex:1;block-size:10px;border-radius:4px;background:var(--line);overflow:hidden}
.mrow .bd .trk i{display:block;block-size:100%;background:var(--ink)}

.lst{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}

.lst li:first-child{border-block-start:0}

.cfm{display:grid;gap:10px;padding:12px 16px;border-radius:var(--radius);background:var(--note-bg);border-block-start:1px solid var(--fieldline)}

/* ---------- reviewer chrome (NOT part of the design) ---------- */
.rv{border:1.5px dashed var(--fieldline);border-radius:var(--radius);background:var(--asm-bg);color:var(--asm-ink);padding:10px 14px;font-size:.875rem;line-height:1.6;text-align:start;direction:ltr}

.m-only{display:none}
.mh{flex:none}
@media (max-width:1100px){

  .kv>div{grid-template-columns:minmax(0,1fr) auto;padding:10px 14px}

  .t-d{display:none}.t-m{display:block}
  .lg-tiles,.lg-side{grid-template-columns:1fr}

     ${rv('The consequence block states arithmetic exactly (rows above) and, separately, shows the floor the database may refuse with its current figure and a timestamp. It never says it will succeed. This example lands exactly on zero by design (the section 15 sequence). The safe floor is not shown: approving an extract raises a receivable and takes no cash out (study correction). A refused commit is a designed state on the extract screen, not here.','Consequence')}

/* ============ ORGANISE ============ */
function org(){
  const p=P[S.type],owner=S.role==='owner',v=S.view;
  const team=[['خالد منصور','مهندس موقع'],['محمود رضا','مهندس موقع'],['سارة عادل','المكتب الفني'],['ياسر عوض','المكتب الفني'],['منى سامي','المالية'],['هبة فؤاد','مشرف']].slice(0,Math.min(p.team,6));
  let out=`<div class="sec-h"><h3>الفريق (${p.team})</h3><span class="sub" ${ds('served',SV+' (count only)')}>العدد وحده يُخدَّم اليوم</span></div>
   <ul class="lst" ${ds('needs','roster: KAFF-115')}>${team.map(t=>`<li><span style="display:flex;gap:12px;align-items:center"><span class="av" style="background:var(--ink);color:var(--bg);inline-size:32px;block-size:32px;font-size:.875rem">${[...t[0]][0]}</span><b>${t[0]}</b></span><span class="r">${t[1]}</span></li>`).join('')}</ul>`;
  if(S.type==='ls'&&!['setup','empty'].includes(v))out+=`<div class="sec-h"><h3>مشاريع مرتبطة</h3></div><ul class="lst" ${ds('needs',NE)}><li><span><b>تصميم فيلا 47 — التجمع الخامس</b></span><span class="r"><span class="badge q">من تصميم إلى تنفيذ</span></span><small>العميل نفسه، وحسابات وفوترة منفصلة. عند توقيع التنفيذ يُرحَّل ائتمان بنسبة 30% من قيمة التصميم.</small></li></ul>`;
  if(S.type==='ds')out+=`<div class="sec-h"><h3>مشاريع مرتبطة</h3></div><ul class="lst" ${ds('needs',NE)}><li><span><b>فيلا الشروق: التنفيذ</b></span><span class="r"><span class="badge q">من تصميم إلى تنفيذ</span></span><small>لم يُوقَّع عقد التنفيذ بعد.</small></li></ul>`;
  if(owner&&!['setup','empty'].includes(v)){
    out+=`<div class="sec-h"><h3>حالة المشروع</h3></div>
     <div class="wf" ${ds('needs','lifecycle endpoints not built')}><div style="padding:14px 16px;display:grid;gap:10px">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between"><span>${pill('run')} <span style="color:var(--dim);font-size:.875rem;margin-inline-start:8px">الحالة في النظام: Active</span></span>
      ${v==='stop'?'':`<button type="button" class="btn sec2 sm" data-stop>${mi('pause')}إيقاف المشروع…</button>`}</div>
      ${v==='stop'?`<div class="cfm" role="group" aria-label="تأكيد الإيقاف"><span>${mi('pause')} إيقاف «${p.name}»؟ لا تُصدر مستخلصات أثناء الإيقاف، ويستمر قبول السجل اليومي. يمكنك إعادة التشغيل في أي وقت.</span><div class="bt"><button type="button" class="btn sm">إيقاف المشروع</button><button type="button" class="btn sec2 sm" data-stopx>إلغاء</button></div></div>`:''}
     </div></div>`
     +rv('Stop is recoverable, so it uses the quiet confirmation, never red. It is a secondary button inside this section, never the page primary and never in the phone bottom bar. Three questions for Nabil: (1) no permission row exists for stop, restart, terminate or practical completion (study item 7); (2) what happens to an extract already in the chain when the project stops (spec 7 only forbids issuing); (3) Terminated is entirely unruled (study item 8), so no terminate control is drawn. The five Kaff words cover only Setup, Active and Closed: how Stopped, HandoverPending, Handover and UnderWarranty are worded is open, so the pill above shows the system state beside it.','Question');
  }
  return gs('org',out);
}

/* ============ page composition ============ */
function body(){
  const v=S.view;
  if(v==='loading')return `<div aria-busy="true" role="status"><span class="vh">جارٍ التحميل</span>${['understand','quantify','execute','pay','org'].map(k=>{const [t,ic]=GN[k];return `<section class="gs"><header class="gh"><span class="gi">${i(ic)}</span><h2>${t}</h2><p><span class="sk" style="inline-size:150px"></span></p></header><div class="gb"><span class="sk b" style="block-size:52px"></span><span class="sk b" style="block-size:52px"></span><span class="sk b" style="block-size:52px;inline-size:70%"></span></div></section>`}).join('')}</div>`
    +rv('While loading, the header keeps its shape but the title is a bar (the name is not known yet), and the primary action is a reserved slot. This is a small deviation from the shell (which keeps the primary visible): the primary depends on type, state and role, none of which is known. All five group headings are shown because every contract type has all five groups; only their contents differ, so the headings are a safe promise.','Loading');
  if(v==='failed')return `<div class="ban rowc" role="alert">${mi('err')}<span><b>تعذّر تحميل المشروع.</b> لم نتمكن من الوصول إلى الخادم. لم يتغير شيء.</span><button type="button" class="btn sec2 sm act">${mi('redo','s')}إعادة المحاولة</button></div>`+rv('Whole-record failure: nothing about the project is known, so no groups and no primary action. A business-rule or permission refusal never offers retry; a network failure does.','Failed');
  if(v==='refused')return `<div class="state refused"><div class="ico">${i('lock')}</div><h4>هذا المشروع خارج تكليفك</h4><p>دورك يتيح لك فتح المشاريع، لكنك غير مُسنَد إلى هذا المشروع. اطلب الإسناد ممن يملك صلاحية إسناد المشاريع.</p><a class="back" href="#">${i('left','s')}العودة إلى المشاريع</a></div>`
    +rv('Project-scoped refusal (role without assignment). Not red, not an error, no retry, and it reveals nothing about the project: no name, client or type. Who holds the right to assign users to projects is not stated in the material read; the sentence names the permission, not a person, until that is confirmed.','Refused');
  const groups=[understand(),quantify(),execute(),pay(),org()].join('');
  return groups;
}
function jump(){
  if(['loading','failed','refused'].includes(S.view))return '';
  const ids=['understand','quantify','execute','pay','org'].filter(k=>!(k==='pay'&&S.role==='site'));
  return `<nav class="jump" aria-label="مجموعات المشروع">${ids.map(k=>`<a href="#g-${k}">${i(GN[k][1],'s')}${GN[k][0]}</a>`).join('')}</nav>`}
function abar(){const pa=primaryAction();return `<button type="button" class="menu" id="menu">${i('menu')}القائمة</button>${pa?`<button type="button" class="btn">${i(pa.ic)}${pa.ar}</button>`:''}`}

function isoDates(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];let n;while(n=w.nextNode()){if(/\d{4}-\d{2}-\d{2}|\d{2}-\d{2}/.test(n.nodeValue)&&!n.parentElement.closest('bdi,script,style,.rv'))ns.push(n)}
 ns.forEach(n=>{const sp=document.createElement('span');sp.innerHTML=n.nodeValue.replace(/(\d{4}-\d{2}-\d{2}|\d{2}-\d{2})/g,'<bdi dir="ltr">$1</bdi>');n.replaceWith(sp)})}
function draw(){
  if(['setup','empty'].includes(S.view)&&S.type!=='ls')S.view='normal';
  if(S.role==='site'&&['setup','empty','stop'].includes(S.view))S.view='normal';
  $('#ph').innerHTML=header();$('#jumpw').innerHTML=jump();$('#frame').innerHTML=body();$('#abar').innerHTML=abar();isoDates($('#ph'));isoDates($('#frame'));
  $('#menu').onclick=()=>{$('#app').dataset.sheet='1'};
  const u=USERS[S.role];['1','2'].forEach(k=>{$('#un'+k).textContent=u.n;$('#ur'+k).textContent=u.r;$('#av'+k).textContent=[...u.n][0]});
  document.querySelectorAll('[data-type]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.type===S.type));
  document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===S.role));
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
  document.querySelectorAll('[data-dr]').forEach(b=>b.onclick=()=>{S.drill=S.drill===b.dataset.dr?null:b.dataset.dr;const y=$('#main').scrollTop;draw();$('#main').scrollTop=y});
  const st=$('[data-stop]');if(st)st.onclick=()=>{S.view='stop';draw()};const sx=$('[data-stopx]');if(sx)sx.onclick=()=>{S.view='normal';draw()};
  const url=new URLSearchParams({type:S.type,role:S.role,view:S.view});history.replaceState(null,'','?'+url+(EMBED?'&embed=1':''));
}
$('#nav').innerHTML=navHtml();$('#nav2').innerHTML=navHtml();
$('#closeN').onclick=()=>{$('#app').dataset.sheet='0'};$('#scrim').onclick=()=>{$('#app').dataset.sheet='0'};
const tgl=()=>{const d=H.dataset.theme?H.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;H.dataset.theme=d?'light':'dark'};
$('#themebtn').onclick=$('#theme1').onclick=$('#theme2').onclick=tgl;
$('#dirbtn').onclick=()=>{const l=H.dir==='rtl';H.dir=l?'ltr':'rtl';H.lang=l?'en':'ar'};
$('#rvbtn').onclick=e=>{const o=document.body.dataset.rv==='1';document.body.dataset.rv=o?'0':'1';e.currentTarget.setAttribute('aria-pressed',!o)};
$('#srcbtn').onclick=e=>{const o=document.body.dataset.srcflag==='1';document.body.dataset.srcflag=o?'0':'1';e.currentTarget.setAttribute('aria-pressed',!o)};
$('#phbtn').onclick=()=>{$('#phf').src=location.pathname+location.search.replace(/&?embed=1/,'')+'&embed=1';$('#phone').dataset.open='1'};
$('#phx').onclick=()=>{$('#phone').dataset.open='0'};
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{S.type=b.dataset.type;S.drill=null;draw()});
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;draw()});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;draw()});
const rail=()=>{$('#app').dataset.rail=(matchMedia('(max-width:1100px)').matches&&innerWidth>820)?'1':'0'};rail();addEventListener('resize',rail);
if(EMBED){document.body.classList.add('embed');$('#strip').remove()}
if(q0.get('rv')==='0')document.body.dataset.rv='0';
if(q0.get('src')==='1')document.body.dataset.srcflag='1';
draw();
if(q0.get('goto'))requestAnimationFrame(()=>document.getElementById(q0.get('goto'))?.scrollIntoView());
