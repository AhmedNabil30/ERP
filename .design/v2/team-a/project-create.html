<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كف - مشروع جديد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --g900:#09221e; --g800:#0f2e29; --g300:#9fb3ad; --c100:#f4eee9; --c200:#e6d9d1; --radius:6px;
  --bg:var(--c100); --surface:#fbf8f5; --head:#ebe0d8; --ink:var(--g900); --dim:#4b5f59; --line:rgba(9,34,30,.16); --hover:rgba(9,34,30,.055);
  --btn:var(--g900); --btn-h:#25544b; --btn-ink:var(--c200); --field:#fbf8f5; --fieldline:var(--g900); --focus:var(--g900);
  --err-bg:#f9e4dd; --err-ink:#7a1a0e; --err-bar:#c2321c;
  --st-run-bg:#d3e3db; --st-run-ink:#0b3b32; --st-done-bg:var(--g900); --st-done-ink:var(--c200);
  --st-stuck-bg:#f9e4dd; --st-stuck-ink:#7a1a0e; --st-post-bg:#e6d9d1; --st-post-ink:#43392f; --st-none-ink:#4b5f59;
  --note-bg:#ebe0d8; --ok-bg:#d3e3db; --ok-ink:#0b3b32; --asm-bg:#f3e4c9; --asm-ink:#4a3410;
  --scrim:rgba(3,13,11,.55); --strip:var(--c200); --shadow:0 12px 36px rgba(9,34,30,.22);
  --display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --side:256px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#061815; --surface:#0a1f1b; --head:#0f2e29; --ink:var(--c200); --dim:var(--g300); --line:rgba(230,217,209,.18); --hover:rgba(230,217,209,.06);
  --btn:var(--c200); --btn-h:#fbf6f2; --btn-ink:var(--g900); --field:#0f2e29; --fieldline:#7f9a92; --focus:var(--c200);
  --err-bg:#3b1612; --err-ink:#ffd0c6; --err-bar:#ff7b63;
  --st-run-bg:#17403a; --st-run-ink:#e6d9d1; --st-done-bg:var(--c200); --st-done-ink:var(--g900);
  --st-stuck-bg:#3b1612; --st-stuck-ink:#ffd0c6; --st-post-bg:#1d2b27; --st-post-ink:#c9bfb7; --st-none-ink:#9fb3ad;
  --note-bg:#0f2e29; --ok-bg:#17403a; --ok-ink:#e6d9d1; --asm-bg:#3d3017; --asm-ink:#f1dcae; --strip:#030d0b; --shadow:0 12px 36px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --bg:#061815; --surface:#0a1f1b; --head:#0f2e29; --ink:var(--c200); --dim:var(--g300); --line:rgba(230,217,209,.18); --hover:rgba(230,217,209,.06);
  --btn:var(--c200); --btn-h:#fbf6f2; --btn-ink:var(--g900); --field:#0f2e29; --fieldline:#7f9a92; --focus:var(--c200);
  --err-bg:#3b1612; --err-ink:#ffd0c6; --err-bar:#ff7b63;
  --st-run-bg:#17403a; --st-run-ink:#e6d9d1; --st-done-bg:var(--c200); --st-done-ink:var(--g900);
  --st-stuck-bg:#3b1612; --st-stuck-ink:#ffd0c6; --st-post-bg:#1d2b27; --st-post-ink:#c9bfb7; --st-none-ink:#9fb3ad;
  --note-bg:#0f2e29; --ok-bg:#17403a; --ok-ink:#e6d9d1; --asm-bg:#3d3017; --asm-ink:#f1dcae; --strip:#030d0b; --shadow:0 12px 36px rgba(0,0,0,.6);}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{inline-size:22px;block-size:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{inline-size:18px;block-size:18px}
.vh{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible,.is-focus{outline:3px solid var(--focus);outline-offset:3px}
bdi{unicode-bidi:isolate}

/* ---------- preview strip (NOT part of the design) ---------- */
.strip{background:var(--strip);font-size:.8125rem;position:relative;z-index:80}
.strip summary{list-style:none;display:flex;align-items:center;gap:.5rem;min-block-size:36px;padding:0 1rem;cursor:pointer}
.strip summary::-webkit-details-marker{display:none}
.strip .panelx{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;padding:.25rem 1rem .75rem}
.strip .grp{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center}
.strip .grp>b{font-weight:600;margin-inline-end:6px}
.strip button{min-block-size:36px;padding:0 .7rem;border:1px solid currentColor;background:transparent;border-radius:var(--radius);color:inherit}
.strip button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
body.embed .strip{display:none}
body.embed .strip{display:none}
/* ---------- app + shell (layout.html, unchanged) ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);block-size:calc(100dvh - 36px);overflow:hidden}
.app[data-rail="1"]{--side:76px}
.side{background:var(--g900);color:var(--c200);display:flex;flex-direction:column;min-inline-size:0;min-block-size:0}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding-inline:20px 12px;block-size:72px;flex:none}
.side-top img{display:block;inline-size:104px;block-size:auto;aspect-ratio:519/155}
.coll{inline-size:44px;block-size:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--c200);border-radius:var(--radius)}
.coll:hover{background:rgba(230,217,209,.1)}
[dir="rtl"] .coll .chev,[dir="ltr"] .app[data-rail="1"] .coll .chev{transform:scaleX(-1)}
[dir="rtl"] .app[data-rail="1"] .coll .chev{transform:none}
.nav{flex:1;overflow-y:auto;padding:8px 12px 16px;min-block-size:0}
.grp-h{margin:18px 0 6px;padding-inline:12px;font:600 .8125rem/1.4 var(--display);color:var(--g300)}
.nav .grp:first-child .grp-h{margin-block-start:6px}
.nav .grp+.grp{margin-block-start:10px;border-block-start:1px solid rgba(230,217,209,.14)}
.row{position:relative;display:flex;align-items:center;gap:14px;min-block-size:44px;padding:0 12px;border-radius:var(--radius);color:var(--c200);text-decoration:none;font:500 .96875rem/1.3 var(--body)}
.row:hover{background:rgba(230,217,209,.09)}
.row:focus-visible{outline:3px solid var(--c200);outline-offset:-3px}
.row[aria-current="page"]{background:rgba(230,217,209,.15);font-weight:600}
.row[aria-current="page"]::before{content:"";position:absolute;inset-block:8px;inset-inline-start:-12px;inline-size:5px;border-start-end-radius:3px;border-end-end-radius:3px;background:var(--c200)}
.side-foot{flex:none;padding:12px;border-block-start:1px solid rgba(230,217,209,.14)}
.who{display:flex;align-items:center;gap:12px;padding:6px 6px 12px}
.av{inline-size:40px;block-size:40px;border-radius:50%;background:var(--c200);color:var(--g900);display:grid;place-items:center;font:700 1rem/1 var(--display);flex:none}
.who b{display:block;font:600 .96875rem/1.3 var(--body)}
.who span{display:block;font-size:.8125rem;color:var(--g300)}
.ctl2{display:flex;gap:8px}
.ctl2 button{flex:1;min-block-size:44px;border:1.5px solid rgba(230,217,209,.55);background:transparent;color:var(--c200);border-radius:var(--radius);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.ctl2 button:hover{background:rgba(230,217,209,.1)}
.i-short{display:none}
.app[data-rail="1"] .i-short{display:inline;font-weight:700}
.app[data-rail="1"] .lbl,.app[data-rail="1"] .grp-h,.app[data-rail="1"] .who>div,.app[data-rail="1"] .side-top img,.app[data-rail="1"] .ctl2 .t{display:none}
.app[data-rail="1"] .side-top{justify-content:center;padding:0}
.app[data-rail="1"] .row{justify-content:center;padding:0}
.app[data-rail="1"] .who{justify-content:center;padding-inline:0}
.app[data-rail="1"] .ctl2{flex-direction:column}
.main{min-inline-size:0;min-block-size:0;display:flex;flex-direction:column;overflow-y:auto;position:relative}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:12px 32px 12px;flex-wrap:wrap}
.ph h1{font:700 2rem/1.3 var(--display);margin:0}
.acts{display:flex;align-items:center;gap:12px}
.frame{padding:0 32px 56px;flex:1;min-inline-size:0}

/* ---------- kit parts, unchanged ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-block-size:48px;padding:0 22px;border:2px solid transparent;border-radius:var(--radius);background:var(--btn);color:var(--btn-ink);font:700 1rem/1 var(--display);white-space:nowrap;text-decoration:none}
.btn.sm{min-block-size:44px;padding:0 16px;font-size:.9375rem}
.btn:hover{background:var(--btn-h)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sec2{background:transparent;color:var(--ink);border-color:var(--fieldline)}
.btn.sec2:hover{background:var(--hover)}
.btn.quiet{background:transparent;color:var(--ink)}
.btn.quiet:hover{background:var(--hover)}
.ib{inline-size:44px;block-size:44px;display:inline-grid;place-items:center;border:2px solid transparent;background:transparent;color:var(--ink);border-radius:var(--radius);padding:0}
.ib:hover{background:var(--hover)}
.lnk{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;font-weight:500;background:none;border:0;padding:0}
.lnk:hover{text-decoration-thickness:3px}
a.lnk{display:inline-flex;align-items:center;min-block-size:44px}
.back{display:inline-flex;align-items:center;gap:6px;min-block-size:44px;color:var(--ink);text-decoration:none;font-weight:600}
[dir="rtl"] .back svg{transform:scaleX(-1)}
.back:hover{text-decoration:underline;text-underline-offset:4px}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-inline-size:24px;block-size:24px;padding:0 8px;border-radius:var(--radius);border:1.5px solid var(--fieldline);font:600 .8125rem/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge svg{inline-size:14px;block-size:14px}
.badge.q{border-color:var(--line);color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:7px;block-size:28px;padding-inline:10px 12px;border-radius:var(--radius);font:600 .8125rem/1 var(--body);white-space:nowrap;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 30%,transparent)}
.pill svg{inline-size:13px;block-size:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s-run{background:var(--st-run-bg);color:var(--st-run-ink)}
.s-done{background:var(--st-done-bg);color:var(--st-done-ink)}
.s-none{background:transparent;color:var(--st-none-ink);box-shadow:inset 0 0 0 1.5px currentColor}
.spin{display:none;inline-size:18px;block-size:18px;border:3px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.ban{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius);border-inline-start:6px solid var(--err-bar);background:var(--err-bg);color:var(--err-ink);font-weight:500;line-height:1.55}
.ban svg{margin-block-start:2px}
.ban.note{background:var(--note-bg);color:var(--ink);border-inline-start-color:var(--fieldline);font-weight:400}
.ban.ok{background:var(--ok-bg);color:var(--ok-ink);border-inline-start-color:var(--ok-ink)}
.ban .act{margin-inline-start:auto;flex:none}
.ban>svg,.locked>svg,.cfm svg,.rec>svg{inline-size:20px;block-size:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cfm>span{display:flex;gap:10px;align-items:flex-start}
.ban b{font-weight:700}
.ban.rowc{flex-wrap:wrap;align-items:center}
.state{border:1.5px solid var(--line);border-radius:var(--radius);background:transparent;padding:44px 24px;text-align:center;display:grid;justify-items:center;gap:10px}
.state.refused{border-style:dashed;border-color:var(--fieldline)}
.state.solid{background:var(--surface)}
.state .ico{inline-size:56px;block-size:56px;border-radius:var(--radius);display:grid;place-items:center;background:var(--head)}
.state.refused .ico{border-radius:50%;border:2px solid var(--fieldline);background:transparent}
.state .ico svg{inline-size:28px;block-size:28px}
.state h4{font:700 1.125rem/1.4 var(--display);margin:4px 0 0}
.state p{margin:0;color:var(--dim);max-inline-size:46ch;font-size:.9375rem}
.sk{display:inline-block;block-size:14px;border-radius:4px;background:linear-gradient(90deg,var(--line),var(--hover),var(--line));background-size:200% 100%;animation:sh 1.4s linear infinite;vertical-align:middle}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}}
.sk.b{display:block}

/* ---------- phone (kit breakpoint) ---------- */
.m-only{display:none}
.mh{flex:none}
@media (max-width:1100px){
}
@media (max-width:820px){
  .app{display:flex;flex-direction:column;block-size:calc(100dvh - 36px)}
  .side,.d-only{display:none!important}
  .m-only{display:block}
  .mh{display:flex;align-items:center;justify-content:space-between;block-size:56px;padding:0 16px;background:var(--g900);color:var(--c200)}
  .mh img{display:block;inline-size:88px;block-size:auto;aspect-ratio:519/155}
  .mh .lang{min-block-size:44px;padding:0 14px;border:1.5px solid rgba(230,217,209,.6);background:transparent;color:var(--c200);border-radius:var(--radius);font-weight:600}
  .main{flex:1;overscroll-behavior:contain}
  .ph{display:block;padding:8px 16px 8px}
  .ph h1{font-size:1.625rem}
  .frame{padding:0 16px 24px}
  .abar{flex:none;display:flex;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-block-start:1px solid var(--line)}
  .abar .menu{flex:none;min-inline-size:116px;block-size:60px;display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--fieldline);background:transparent;border-radius:var(--radius);font:700 1rem/1 var(--display)}
  .abar .btn{flex:1;block-size:60px;font-size:1.0625rem}
  [data-sheet="1"] .abar{visibility:hidden}
  .nsheet{position:fixed;inset-inline:0;inset-block-end:0;z-index:70;max-block-size:90dvh;display:none;flex-direction:column;background:var(--bg);border-start-start-radius:var(--radius);border-start-end-radius:var(--radius);box-shadow:0 -12px 40px rgba(0,0,0,.35)}
  [data-sheet="1"] .scrim{display:block;z-index:65}
  [data-sheet="1"] .nsheet{display:flex}
  .grab{inline-size:44px;block-size:4px;border-radius:2px;background:var(--line);margin:10px auto 0;flex:none}
  .sh-top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-block-end:1px solid var(--line)}
  .sh-top .who{padding:0;flex:1}.sh-top .who span{color:var(--dim)}
  .sh-top button{inline-size:48px;block-size:48px;border:1.5px solid var(--fieldline);background:transparent;border-radius:var(--radius);display:grid;place-items:center}
  .sh-nav{overflow-y:auto;padding:6px 12px 14px}
  .sh-nav .grp-h{color:var(--dim)}
  .sh-nav .grp+.grp{border-block-start:1px solid var(--line)}
  .sh-nav .row{min-block-size:52px;color:var(--ink);font-size:1.0625rem}
  .sh-nav .row[aria-current="page"]{background:var(--head)}
  .sh-nav .row[aria-current="page"]::before{background:var(--ink)}
}
.scrim{display:none;position:fixed;inset:0;background:var(--scrim)}
@media (max-width:820px){.scrim{inset:0}}
/* ---------- THIS SCREEN: new parts (documented in README) ---------- */
/* date segmented control: the kit's .seg, unchanged */
.seg{display:inline-flex;border:2px solid var(--fieldline);border-radius:var(--radius);overflow:hidden;background:var(--field)}
.seg button{min-block-size:44px;padding:0 20px;border:0;background:transparent;font:600 .9375rem/1 var(--body);display:inline-flex;align-items:center;gap:8px}
.seg button+button{border-inline-start:2px solid var(--fieldline)}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.seg button:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
/* kit search field */
.search{position:relative;max-inline-size:100%}
.search>svg{position:absolute;inset-inline-start:14px;inset-block-start:50%;transform:translateY(-50%);color:var(--dim);inline-size:20px;block-size:20px;pointer-events:none}
.search input{inline-size:100%;block-size:48px;padding-inline:44px 14px;border:2px solid var(--fieldline);border-radius:var(--radius);background:var(--field);font-size:1rem;outline:none}
.search input:focus{outline:3px solid var(--focus);outline-offset:3px}
.search input::placeholder{color:var(--dim)}
.ck{display:flex;align-items:center;gap:12px;min-block-size:44px;cursor:pointer;font-size:1rem;position:relative}
.ck.is-focus{outline:none}
.ck input{position:absolute;opacity:0;inline-size:1px;block-size:1px}
.ck .bx{inline-size:24px;block-size:24px;flex:none;border:2px solid var(--fieldline);background:var(--field);display:grid;place-items:center;border-radius:var(--radius)}
.ck .bx svg{inline-size:16px;block-size:16px;stroke:var(--bg);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none}
.ck.rd .bx{border-radius:50%}
.ck input:checked+.bx,.ck.on .bx,.ck.ind .bx{background:var(--ink);border-color:var(--ink)}
.ck.rd input:checked+.bx,.ck.rd.on .bx{background:var(--ink);box-shadow:inset 0 0 0 4px var(--field)}
.ck input:checked+.bx svg.ck-c,.ck.on .bx svg.ck-c,.ck.ind .bx svg.ck-i{display:block}
.ck.rd .bx svg{display:none!important}
.ck:hover .bx,.ck.is-hover .bx{border-color:var(--ink);outline:4px solid var(--hover)}
.ck input:focus-visible+.bx,.ck.is-focus .bx{outline:3px solid var(--focus);outline-offset:3px}
.ck.dis{opacity:.45;cursor:not-allowed}
.ck.err .bx{border-color:var(--err-bar);box-shadow:inset 0 0 0 1px var(--err-bar)}
.ck .lb small{display:block;color:var(--dim);font-size:.875rem;line-height:1.4}
.tabs{display:flex;border-block-end:2px solid var(--line);overflow-x:auto;gap:4px}
/* ---------- THIS SCREEN: new parts (documented in README) ---------- */
.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--radius);border-inline-start:6px solid var(--ok-ink);background:var(--ok-bg);color:var(--ok-ink);font-weight:600;line-height:1.5}
.rec svg{inline-size:20px;block-size:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.field{display:grid;gap:6px;min-inline-size:0}
.field>label{display:flex;gap:8px;align-items:center;font:600 1rem/1.4 var(--body)}
.ctl{display:flex;align-items:stretch;min-inline-size:0;block-size:48px;border:2px solid var(--fieldline);border-radius:var(--radius);background:var(--field)}
.ctl input,.ctl .val{flex:1;min-inline-size:0;border:0;background:transparent;padding:0 14px;font-size:1.0625rem;outline:none;block-size:100%;display:flex;align-items:center}
.ctl:focus-within,.ctl.is-focus{outline:3px solid var(--focus);outline-offset:3px}
.ctl .aff{display:flex;align-items:center;padding:0 14px;border-inline-start:2px solid var(--line);color:var(--dim);font-weight:600;white-space:nowrap}
.ctl.money input,.ctl.money .val{text-align:end;direction:ltr;font-variant-numeric:tabular-nums;justify-content:flex-end}
.ctl.ro{background:var(--head);border-color:var(--line)}
.ctl.ro .val{font-weight:700}
/* ---------- THIS SCREEN ---------- */
.form{max-inline-size:560px;display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding-block-start:8px}
.form .ft1{min-block-size:24px;display:flex;gap:6px;align-items:center;color:var(--err-ink);font-weight:500;font-size:.9375rem;line-height:1.4}
.form .ft1 svg{inline-size:18px;block-size:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.field.bad .ctl{border-color:var(--err-bar);box-shadow:inset 0 0 0 1px var(--err-bar)}
.form .field{grid-template-columns:minmax(0,1fr)}
.field .fl{font:600 1rem/1.4 var(--body)}
.ctl>svg.i{align-self:center;margin-inline-start:14px;color:var(--dim)}
.ctl.dis{border-style:dashed;opacity:.45;cursor:not-allowed}
.ctl .clr{inline-size:44px;align-self:center;block-size:44px;border:0;background:transparent;display:grid;place-items:center;border-radius:var(--radius)}
.ctl .clr:hover{background:var(--hover)}
.ctl .spin{display:inline-block;align-self:center;margin-inline:14px}
.cb{position:relative}
.pop{position:absolute;inset-inline:0;inset-block-start:calc(100% + 6px);z-index:20;background:var(--surface);border:1.5px solid var(--fieldline);border-radius:var(--radius);box-shadow:var(--shadow);max-block-size:300px;overflow:auto}
.opt-c{display:flex;align-items:center;min-block-size:48px;padding:6px 14px;inline-size:100%;border:0;border-block-end:1px solid var(--line);background:transparent;text-align:start;font-size:1rem}
.opt-c:last-child{border-block-end:0}
.opt-c:hover,.opt-c.act{background:var(--hover)}
.opt-c[aria-selected="true"]{font-weight:700}
.opt-c mark{background:transparent;color:inherit;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.pop .none{padding:12px 14px;display:grid;gap:0;color:var(--dim)}
fieldset.types{border:0;margin:0;padding:0;display:grid;gap:8px;min-inline-size:0}
fieldset.types legend{padding:0;margin-block-end:8px;font:600 1rem/1.4 var(--body)}
.types label.ck{min-block-size:56px;padding-inline:14px;border:2px solid var(--line);border-radius:var(--radius);background:var(--field);font-weight:500}
.types label.ck.on{border-color:var(--ink);font-weight:700}
.types label.ck:hover{border-color:var(--ink)}
.types label.ck:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:3px}
.fa{padding-block-start:16px;border-block-start:1px solid var(--line);display:flex}
.btn[aria-busy="true"] .spin{display:inline-block}
.btn[aria-busy="true"]{pointer-events:none}
@media (max-width:820px){
  .ctl{block-size:56px}
  .opt-c{min-block-size:56px}
  .ph .back{margin-inline-start:-4px}
}
</style>
</head>
<body>

<details class="strip" id="strip">
  <summary><span aria-hidden="true">▾</span> معاينة (ليست جزءاً من التصميم)</summary>
  <div class="panelx">
    <div class="grp" role="group" aria-label="الحالة"><b>الحالة</b>
      <button type="button" data-view="normal">فارغ</button>
      <button type="button" data-view="filled">معبّأ</button>
      <button type="button" data-view="search">بحث عن عميل</button>
      <button type="button" data-view="noresult">لا نتيجة</button>
      <button type="button" data-view="noclients">لا عملاء</button>
      <button type="button" data-view="loading">تحميل العملاء</button>
      <button type="button" data-view="failed">تعذّر تحميل العملاء</button>
      <button type="button" data-view="errors">أخطاء التحقق</button>
      <button type="button" data-view="submitting">جارٍ الإنشاء</button>
      <button type="button" data-view="refused">مرفوض (الدور)</button>
    </div>
    <div class="grp"><button type="button" id="themebtn">فاتح / داكن</button><button type="button" id="dirbtn">اتجاه LTR</button></div>
  </div>
</details>

<div class="app" id="app" data-rail="0" data-sheet="0">
  <aside class="side" aria-label="التنقل الرئيسي">
    <div class="side-top"><img src="../brand/kaaf-wordmark.png" width="519" height="155" alt="KAAF"><button type="button" class="coll" aria-label="تصغير الشريط الجانبي"><svg class="i chev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>
    <nav class="nav" id="nav" aria-label="الشاشات"></nav>
    <div class="side-foot"><div class="who"><div class="av" id="av1"></div><div><b id="un1"></b><span id="ur1"></span></div></div><div class="ctl2"><button type="button" id="lang1" lang="en" dir="ltr"><span class="t">English</span><span class="i-short">EN</span></button><button type="button" id="theme1" aria-label="الوضع"><svg class="i" viewBox="0 0 24 24"><path d="M21 13.5A8.5 8.5 0 1110.5 3a7 7 0 0010.5 10.5z"/></svg><span class="t">الوضع</span></button></div></div>
  </aside>
  <header class="mh m-only"><img src="../brand/kaaf-wordmark.png" width="519" height="155" alt="KAAF"><button type="button" class="lang" id="lang2" lang="en" dir="ltr">English</button></header>

  <main class="main" id="main">
    <div class="ph" id="ph"></div>
    <div class="frame" id="frame"></div>
  </main>

  <div class="abar m-only" id="abar"></div>
  <div class="scrim" id="scrim"></div>
  <div class="nsheet m-only" id="nsheet" role="dialog" aria-label="الشاشات"><div class="grab"></div><div class="sh-top"><div class="who"><div class="av" id="av2"></div><div><b id="un2"></b><span id="ur2"></span></div></div><button type="button" id="theme2" aria-label="الوضع"><svg class="i" viewBox="0 0 24 24"><path d="M21 13.5A8.5 8.5 0 1110.5 3a7 7 0 0010.5 10.5z"/></svg></button><button type="button" id="closeN" aria-label="إغلاق"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><nav class="sh-nav" id="nav2"></nav></div>
</div>

<script>
const IC={projects:'M4 21V7l8-4 8 4v14M9 21v-6h6v6M8 10h.01M12 10h.01M16 10h.01',catalog:'M3 11V4h7l11 11-7 7L3 11zM7.5 7.5h.01',bab:'M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5',employees:'M16 20v-1.5a3.5 3.5 0 00-3.5-3.5h-5A3.5 3.5 0 004 18.5V20M10 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM20 20v-1.5a3.5 3.5 0 00-2.6-3.4M15.5 4.2a3.5 3.5 0 010 6.6',subs:'M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.8-3.8a6 6 0 01-7.9 7.9l-6.9 6.9a2.1 2.1 0 01-3-3l6.9-6.9a6 6 0 017.9-7.9l-3.8 3.8z',suppliers:'M3 6h11v10H3zM14 9h4l3 3v4h-7zM7 19a2 2 0 100-4 2 2 0 000 4zM17 19a2 2 0 100-4 2 2 0 000 4z',clients:'M3 8h18v12H3zM8 8V5h8v3M3 13h18',users:'M12 3l8 3v6c0 4.5-3.2 7.6-8 9-4.8-1.4-8-4.5-8-9V6l8-3zM12 11a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM7.5 17c.8-2 2.4-3 4.5-3s3.7 1 4.5 3',depts:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',audit:'M9 4h6v3H9zM6 5h-.5A1.5 1.5 0 004 6.5v13A1.5 1.5 0 005.5 21h13a1.5 1.5 0 001.5-1.5v-13A1.5 1.5 0 0018.5 5H18M8 12h8M8 16h5',
 left:'M15 6l-6 6 6 6',menu:'M4 7h16M4 12h16M4 17h16',plus:'M12 5v14M5 12h14',check:'M5 12.5l4.5 4.5L19 7.5',x:'M6 6l12 12M18 6L6 18',clock:'M12 21a9 9 0 100-18 9 9 0 000 18zM12 7v5l3 2',lock:'M6 11h12v9H6zM8 11V8a4 4 0 018 0v3',info:'M12 21a9 9 0 100-18 9 9 0 000 18zM12 11v5M12 8v.01',err:'M12 21a9 9 0 100-18 9 9 0 000 18zM12 7.5v5.5M12 16.5v.01',redo:'M20 11a8 8 0 10-2.3 5.7M20 4v7h-7',chev:'M6 9l6 6 6-6',
 search:'M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-4-4',copy:'M9 9h11v11H9zM5 15V4h11',doc:'M6 3h9l4 4v14H6zM14 3v5h5',print:'M7 9V3h10v6M7 17H4v-6h16v6h-3M7 14h10v7H7z',grip:'M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01',archive:'M3 5h18v4H3zM5 9v10h14V9M10 13h4'};
const NAV=[{id:'projects',g:'core',ar:'المشاريع'},{id:'catalog',g:'core',ar:'كتالوج الأسعار'},{id:'bab',g:'core',ar:'الأبواب'},{id:'employees',g:'core',ar:'الموظفون'},{id:'subs',g:'core',ar:'مقاولو الباطن'},{id:'suppliers',g:'core',ar:'الموردون'},{id:'clients',g:'core',ar:'العملاء'},{id:'users',g:'admin',ar:'المستخدمون'},{id:'depts',g:'admin',ar:'الأقسام'},{id:'audit',g:'admin',ar:'سجل التدقيق'}];
const GROUPS={core:'البيانات الأساسية',admin:'الإدارة'};
const i=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
const mi=(n,c)=>`<svg class="${c||''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${IC[n]}"/></svg>`;
function navHtml(){let o='';for(const g of['core','admin']){const it=NAV.filter(n=>n.g===g);o+=`<div class="grp"><div class="grp-h">${GROUPS[g]}</div>`+it.map(n=>`<a class="row" href="#" ${n.id==='projects'?'aria-current="page"':''} title="${n.ar}">${i(n.id)}<span class="lbl">${n.ar}</span></a>`).join('')+'</div>'}return o}
const $=s=>document.querySelector(s);
const H=document.documentElement;
const q0=new URLSearchParams(location.search);
const EMBED=q0.get('embed')==='1';
const USER={n:'سامي عادل',r:'المكتب الفني'};
const CLIENTS=['شركة النيل للتطوير العقاري','شركة النخبة للاستثمار العقاري','مجموعة الأمل للتطوير','م. أحمد عبد الرحمن','د. منى السيد','أ. محمود فؤاد','شركة السلام للفنادق'];
const TYPES=['مقاولة بالمقطوعية','التكلفة زائد نسبة إشراف','تصميم'];
const V=q0.get('view')||'normal';
const S={view:V,name:'',client:'',q:'',type:0,errs:false,open:false};
function setup(){
  const v=S.view;S.errs=false;S.open=false;S.q='';
  S.name=['filled','search','noresult','submitting'].includes(v)?'فيلا الشروق — القاهرة الجديدة':'';
  S.client=(v==='filled'||v==='submitting')?CLIENTS[0]:'';
  S.type=(v==='filled'||v==='submitting')?1:0;
  if(v==='search'){S.open=true;S.q='شركة'}
  if(v==='noresult'){S.open=true;S.q='حسن'}
  if(v==='errors')S.errs=true;
}
const ES=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const req='<span aria-hidden="true">*</span><span class="vh">مطلوب</span>';
const slot=t=>t?`<div class="ft1" id="e-${t[0]}" role="alert">${mi('err')}${t[1]}</div>`:'<div class="ft1"></div>';
const ncl=()=>`<a class="lnk" href="#">تسجيل عميل جديد</a>`;
function hl(n,q){if(!q)return ES(n);const k=n.indexOf(q);return k<0?ES(n):ES(n.slice(0,k))+'<mark>'+ES(q)+'</mark>'+ES(n.slice(k+q.length))}
function clientField(){
  const v=S.view,bad=S.errs&&!S.client;
  const lab=`<label for="cq">العميل ${req}</label>`;
  if(v==='loading')return `<div class="field" aria-busy="true">${lab}<div class="ctl dis"><span class="val"><span class="sk" style="inline-size:40%"></span></span><span class="spin" aria-hidden="true"></span></div><div class="ft1"></div><span class="vh" role="status">جارٍ تحميل العملاء</span></div>`;
  if(v==='failed')return `<div class="field"><div class="fl">العميل ${req}</div><div class="ban rowc" role="alert">${mi('err')}<span>تعذّر تحميل العملاء</span><button type="button" class="btn sm sec2 act" data-testid="retry-clients">إعادة المحاولة</button></div></div>`;
  if(v==='noclients')return `<div class="field"><div class="fl">العميل ${req}</div><div class="state" style="padding:24px 16px;justify-items:start;text-align:start"><h4 style="margin:0">لا يوجد عملاء مسجّلون</h4>${ncl()}</div></div>`;
  const list=CLIENTS.filter(c=>!S.q||c.includes(S.q));
  const pop=S.open?`<div class="pop" role="listbox" id="cl">${list.length?list.map((c,k)=>`<button type="button" class="opt-c${k===0&&S.q?' act':''}" role="option" aria-selected="${c===S.client}" data-c="${ES(c)}">${hl(c,S.q)}</button>`).join(''):`<div class="none"><span>لا يوجد عميل بهذا الاسم</span>${ncl()}</div>`}</div>`:'';
  const val=S.open?S.q:S.client;
  return `<div class="field${bad?' bad':''}">${lab}<div class="cb"><div class="ctl">${mi('search','i')}<input id="cq" role="combobox" aria-expanded="${S.open}" aria-controls="cl" autocomplete="off" value="${ES(val)}" ${bad?'aria-invalid="true" aria-describedby="e-c"':''}>${val?`<button type="button" class="clr" id="clr" aria-label="مسح">${mi('x')}</button>`:''}</div>${pop}</div>${slot(bad?['c','اختر العميل']:null)}</div>`;
}
function body(){
  const v=S.view;
  if(v==='refused')return `<div class="state refused"><div class="ico">${mi('lock')}</div><h4>لا تملك صلاحية إنشاء المشاريع</h4></div>`;
  const bn=S.errs&&!S.name.trim(),busy=v==='submitting';
  return `<form class="form" id="f" novalidate>
   <div class="field${bn?' bad':''}"><label for="nm">المشروع ${req}</label><div class="ctl${busy?' ro':''}"><input id="nm" value="${ES(S.name)}" ${busy?'readonly':''} ${bn?'aria-invalid="true" aria-describedby="e-n"':''}></div>${slot(bn?['n','اسم المشروع مطلوب']:null)}</div>
   ${clientField()}
   <fieldset class="types"><legend>نوع التعاقد</legend>${TYPES.map((t,k)=>`<label class="ck rd${S.type===k?' on':''}"><input type="radio" name="t" value="${k}" ${S.type===k?'checked':''} ${busy?'disabled':''}><span class="bx"></span><span class="lb">${t}</span></label>`).join('')}</fieldset>
   <div class="fa d-only">${pbtn()}</div>
  </form>`;
}
function pbtn(){
  const v=S.view;
  if(v==='submitting')return `<button type="button" class="btn" aria-busy="true" data-testid="create-project"><span class="spin" aria-hidden="true"></span>جارٍ الإنشاء…</button>`;
  return `<button type="submit" form="f" class="btn" data-testid="create-project" ${v==='loading'?'disabled':''}>إنشاء المشروع</button>`;
}
function header(){return `<div><a class="back" href="#">${mi('left')}المشاريع</a><h1>مشروع جديد</h1></div>`}
function abar(){return `<button type="button" class="menu" id="menu">${i('menu')}القائمة</button>${S.view==='refused'?'':pbtn()}`}
function draw(keep){
  if(!keep)setup();
  const f=document.activeElement&&document.activeElement.id==='cq';
  $('#ph').innerHTML=header();$('#frame').innerHTML=body();$('#abar').innerHTML=abar();
  $('#menu').onclick=()=>{$('#app').dataset.sheet='1'};
  document.querySelectorAll('.strip [data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
  history.replaceState(null,'','?view='+S.view+(EMBED?'&embed=1':''));
  bind();
  if(f){const e=$('#cq');e.focus();e.setSelectionRange(e.value.length,e.value.length)}
}
function bind(){
  const cq=$('#cq');
  if(cq){cq.oninput=()=>{S.q=cq.value;S.open=true;S.client='';draw(true)};cq.onfocus=()=>{if(!S.open){S.open=true;S.q=S.client?'':S.q;draw(true)}}}
  document.querySelectorAll('.opt-c').forEach(b=>b.onclick=()=>{S.client=b.dataset.c;S.open=false;S.q='';draw(true)});
  const c=$('#clr');if(c)c.onclick=()=>{S.client='';S.q='';S.open=true;draw(true)};
  document.querySelectorAll('input[name=t]').forEach(r=>r.onchange=()=>{S.type=+r.value;draw(true)});
  const nm=$('#nm');if(nm)nm.oninput=()=>{S.name=nm.value};
  const f=$('#f');if(f)f.onsubmit=e=>{e.preventDefault();S.errs=true;S.open=false;draw(true)};
}
const u=USER;['1','2'].forEach(k=>{$('#un'+k).textContent=u.n;$('#ur'+k).textContent=u.r;$('#av'+k).textContent=[...u.n][0]});
$('#nav').innerHTML=navHtml();$('#nav2').innerHTML=navHtml();
$('#closeN').onclick=()=>{$('#app').dataset.sheet='0'};$('#scrim').onclick=()=>{$('#app').dataset.sheet='0'};
const tgl=()=>{const d=H.dataset.theme?H.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;H.dataset.theme=d?'light':'dark'};
$('#themebtn').onclick=$('#theme1').onclick=$('#theme2').onclick=tgl;
$('#dirbtn').onclick=()=>{const l=H.dir==='rtl';H.dir=l?'ltr':'rtl';H.lang=l?'en':'ar'};
document.querySelectorAll('.strip [data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;draw()});
const rail=()=>{$('#app').dataset.rail=(matchMedia('(max-width:1100px)').matches&&innerWidth>820)?'1':'0'};rail();addEventListener('resize',rail);
if(EMBED){document.body.classList.add('embed');$('#strip').remove()}
draw();
</script>
</body>
</html>
