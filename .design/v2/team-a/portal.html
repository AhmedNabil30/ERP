<style>
/* KAAF client portal (release 5) + its staff screens. Tokens and kit parts copied from project.html / components.html. New parts are listed in portal-notes.md. */
/* KAAF project workspace, r3 2026-11-11: project frame (header, stage line, tabs) plus the overview tab. Kit parts (components.html, money.html) inside the approved shell (layout.html).
   New here: project frame (stage line, screen tabs), hero, fact list, disclosure link. All listed in README.md. */
:root{
  --g900:#09221e; --g800:#0f2e29; --g300:#9fb3ad; --c100:#f4eee9; --c200:#e6d9d1; --radius:6px;
  --bg:var(--c100); --surface:#fbf8f5; --head:#ebe0d8; --ink:var(--g900); --dim:#4b5f59; --line:rgba(9,34,30,.16); --hover:rgba(9,34,30,.055);
  --btn:var(--g900); --btn-h:#25544b; --btn-ink:var(--c200); --field:#fbf8f5; --fieldline:var(--g900); --focus:var(--g900);
  --err-bg:#f9e4dd; --err-ink:#7a1a0e; --err-bar:#c2321c;
  --st-run-bg:#d3e3db; --st-run-ink:#0b3b32; --st-done-bg:var(--g900); --st-done-ink:var(--c200);
  --st-stuck-bg:#f9e4dd; --st-stuck-ink:#7a1a0e; --st-post-bg:#e6d9d1; --st-post-ink:#43392f; --st-none-ink:#4b5f59;
  --note-bg:#ebe0d8; --ok-bg:#d3e3db; --ok-ink:#0b3b32;
  --scrim:rgba(3,13,11,.55); --strip:var(--c200); --shadow:0 12px 36px rgba(9,34,30,.22);
  --display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --side:256px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#061815; --surface:#0a1f1b; --head:#0f2e29; --ink:var(--c200); --dim:var(--g300); --line:rgba(230,217,209,.18); --hover:rgba(230,217,209,.06);
  --btn:var(--c200); --btn-h:#fbf6f2; --btn-ink:var(--g900); --field:#0f2e29; --fieldline:#7f9a92; --focus:var(--c200);
  --err-bg:#3b1612; --err-ink:#ffd0c6; --err-bar:#ff7b63;
  --st-run-bg:#17403a; --st-run-ink:#e6d9d1; --st-done-bg:var(--c200); --st-done-ink:var(--g900);
  --st-stuck-bg:#3b1612; --st-stuck-ink:#ffd0c6; --st-post-bg:#1d2b27; --st-post-ink:#c9bfb7; --st-none-ink:#9fb3ad;
  --note-bg:#0f2e29; --ok-bg:#17403a; --ok-ink:#e6d9d1; --strip:#030d0b; --shadow:0 12px 36px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --bg:#061815; --surface:#0a1f1b; --head:#0f2e29; --ink:var(--c200); --dim:var(--g300); --line:rgba(230,217,209,.18); --hover:rgba(230,217,209,.06);
  --btn:var(--c200); --btn-h:#fbf6f2; --btn-ink:var(--g900); --field:#0f2e29; --fieldline:#7f9a92; --focus:var(--c200);
  --err-bg:#3b1612; --err-ink:#ffd0c6; --err-bar:#ff7b63;
  --st-run-bg:#17403a; --st-run-ink:#e6d9d1; --st-done-bg:var(--c200); --st-done-ink:var(--g900);
  --st-stuck-bg:#3b1612; --st-stuck-ink:#ffd0c6; --st-post-bg:#1d2b27; --st-post-ink:#c9bfb7; --st-none-ink:#9fb3ad;
  --note-bg:#0f2e29; --ok-bg:#17403a; --ok-ink:#e6d9d1; --strip:#030d0b; --shadow:0 12px 36px rgba(0,0,0,.6);}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{inline-size:22px;block-size:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{inline-size:18px;block-size:18px}
.vh{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible,.is-focus{outline:3px solid var(--focus);outline-offset:3px}
bdi{unicode-bidi:isolate}
/* ---------- preview strip (NOT part of the design) ---------- */
.strip{background:var(--strip);font-size:.8125rem;position:relative;z-index:80}
.strip summary{list-style:none;display:flex;align-items:center;gap:.5rem;min-block-size:36px;padding:0 1rem;cursor:pointer}
.strip summary::-webkit-details-marker{display:none}
.strip .panelx{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;padding:.25rem 1rem .75rem}
.strip .grp{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center}
.strip .grp>b{font-weight:600;margin-inline-end:6px}
.strip button{min-block-size:36px;padding:0 .7rem;border:1px solid currentColor;background:transparent;border-radius:var(--radius);color:inherit}
.strip button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
body.embed .strip{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-block-size:48px;padding:0 22px;border:2px solid transparent;border-radius:var(--radius);background:var(--btn);color:var(--btn-ink);font:700 1rem/1 var(--display);white-space:nowrap;text-decoration:none}
.btn.sm{min-block-size:44px;padding:0 16px;font-size:.9375rem}
.btn:hover{background:var(--btn-h)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sec2{background:transparent;color:var(--ink);border-color:var(--fieldline)}
.btn.sec2:hover{background:var(--hover)}
.btn.quiet{background:transparent;color:var(--ink)}
.btn.quiet:hover{background:var(--hover)}
.ib{inline-size:44px;block-size:44px;display:inline-grid;place-items:center;border:2px solid transparent;background:transparent;color:var(--ink);border-radius:var(--radius);padding:0}
.ib:hover{background:var(--hover)}
.lnk{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;font-weight:500;background:none;border:0;padding:0}
.lnk:hover{text-decoration-thickness:3px}
a.lnk{display:inline-flex;align-items:center;min-block-size:44px}
.back{display:inline-flex;align-items:center;gap:6px;min-block-size:44px;color:var(--ink);text-decoration:none;font-weight:600}
[dir="rtl"] .back svg{transform:scaleX(-1)}
.back:hover{text-decoration:underline;text-underline-offset:4px}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-inline-size:24px;block-size:24px;padding:0 8px;border-radius:var(--radius);border:1.5px solid var(--fieldline);font:600 .8125rem/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge svg{inline-size:14px;block-size:14px}
.badge.q{border-color:var(--line);color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:7px;block-size:28px;padding-inline:10px 12px;border-radius:var(--radius);font:600 .8125rem/1 var(--body);white-space:nowrap;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 30%,transparent)}
.pill svg{inline-size:13px;block-size:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s-run{background:var(--st-run-bg);color:var(--st-run-ink)}
.s-done{background:var(--st-done-bg);color:var(--st-done-ink)}
.s-none{background:transparent;color:var(--st-none-ink);box-shadow:inset 0 0 0 1.5px currentColor}
.spin{display:none;inline-size:18px;block-size:18px;border:3px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.ban{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius);border-inline-start:6px solid var(--err-bar);background:var(--err-bg);color:var(--err-ink);font-weight:500;line-height:1.55}
.ban svg{margin-block-start:2px}
.ban.note{background:var(--note-bg);color:var(--ink);border-inline-start-color:var(--fieldline);font-weight:400}
.ban.ok{background:var(--ok-bg);color:var(--ok-ink);border-inline-start-color:var(--ok-ink)}
.ban .act{margin-inline-start:auto;flex:none}
.ban>svg,.locked>svg,.cfm svg,.rec>svg{inline-size:20px;block-size:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cfm>span{display:flex;gap:10px;align-items:flex-start}
.ban b{font-weight:700}
.ban.rowc{flex-wrap:wrap;align-items:center}
.state{border:1.5px solid var(--line);border-radius:var(--radius);background:transparent;padding:44px 24px;text-align:center;display:grid;justify-items:center;gap:10px}
.state.refused{border-style:dashed;border-color:var(--fieldline)}
.state.solid{background:var(--surface)}
.state .ico{inline-size:56px;block-size:56px;border-radius:var(--radius);display:grid;place-items:center;background:var(--head)}
.state.refused .ico{border-radius:50%;border:2px solid var(--fieldline);background:transparent}
.state .ico svg{inline-size:28px;block-size:28px}
.state h4{font:700 1.125rem/1.4 var(--display);margin:4px 0 0}
.state p{margin:0;color:var(--dim);max-inline-size:46ch;font-size:.9375rem}
.sk{display:inline-block;block-size:14px;border-radius:4px;background:linear-gradient(90deg,var(--line),var(--hover),var(--line));background-size:200% 100%;animation:sh 1.4s linear infinite;vertical-align:middle}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}}
.sk.b{display:block}
.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--radius);border-inline-start:6px solid var(--ok-ink);background:var(--ok-bg);color:var(--ok-ink);font-weight:600;line-height:1.5}
.rec svg{inline-size:20px;block-size:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rec small{font-weight:400;flex-basis:100%}
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;list-style:none;margin:0;padding:0}
.chain li{padding:12px 12px 14px;display:grid;gap:4px;align-content:start;position:relative;min-inline-size:0}
.chain li+li{border-inline-start:1px solid var(--line)}
.chain .st{display:flex;align-items:center;gap:8px;font-weight:600;line-height:1.3}
.chain .mk{inline-size:26px;block-size:26px;border-radius:50%;border:2px solid var(--fieldline);display:grid;place-items:center;flex:none;font:700 .75rem/1 var(--body)}
.chain .mk svg{inline-size:14px;block-size:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chain li.done .mk{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chain li.cur{background:var(--head)}
.chain li.cur .mk{border-width:3px;background:var(--bg)}
.chain li.cur .mk::after{content:"";inline-size:8px;block-size:8px;border-radius:50%;background:var(--ink)}
.chain .who2 bdi{white-space:nowrap}
.chain .who2{font-size:.8125rem;color:var(--dim);line-height:1.4}
.chain .age{display:inline-flex;gap:5px;align-items:center;font-size:.8125rem;font-weight:600}
.chain .age svg{inline-size:14px;block-size:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
/* ---------- portal parts ---------- */
body{display:flex;flex-direction:column;min-block-size:100dvh}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;block-size:56px;padding:0 16px;background:var(--g900);color:var(--c200)}
.top img{display:block;inline-size:88px;block-size:auto;aspect-ratio:519/155}
.top .ib{color:var(--c200)}
.top .ib:hover{background:rgba(230,217,209,.12)}
main{flex:1;min-inline-size:0}
.wrap{max-inline-size:720px;margin-inline:auto;padding:12px 16px 28px;display:grid;gap:20px;align-content:start}

.card{display:grid;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px;min-inline-size:0;color:inherit;text-decoration:none}

a.card:hover{background:var(--hover)}

.ln{display:flex;align-items:center;justify-content:space-between;gap:12px;min-inline-size:0}

.lst{list-style:none;margin:0;padding:0;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}

.lst>li+li{border-block-start:1px solid var(--line)}
.lst a,.lst .it{display:flex;align-items:center;gap:12px;min-block-size:56px;padding:8px 16px;color:inherit;text-decoration:none;min-inline-size:0}

.grow{flex:1;min-inline-size:0;display:grid;gap:2px}
small,.dim{color:var(--dim);font-size:.875rem}
.meter{block-size:8px;border-radius:4px;background:var(--head);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}

.u{color:var(--dim);font-weight:400;font-size:.8125em;margin-inline-start:6px}

.abar{position:sticky;inset-block-end:0;z-index:20;background:var(--surface);border-block-start:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}

.state{padding:36px 20px}

<body>
<details class="strip" id="strip"><summary><span>معاينة التصميم (ليست جزءًا من الشاشة)</span></summary>
<div class="panelx"><div class="grp"><b>الشاشة</b><span id="gs"></span></div><div class="grp"><b>الحالة</b><span id="gv"></span></div><div class="grp"><button type="button" id="th">الوضع الداكن</button></div></div></details>

<script>
const q=new URLSearchParams(location.search);

V.p8={v:[['normal','عادي'],['open','صورة مفتوحة'],['empty','لا صور'],['loading','تحميل'],['failed','تعذّر التحميل']],draw(v){
 const bk=back(to('p3'),PROJ);
 if(v==='open')return portal(bk+`<div class="ph-c"><div class="ph3" style="aspect-ratio:3/4">${i('img')}</div><div class="cap"><b>${PH[0][0]}</b><small>${num(PH[0][1])}</small></div></div>`);
 return portal(bk+`<h1>الصور</h1>`+(v==='loading'?`<ul class="grid">${[1,2,3,4].map(()=>`<li class="ph-c"><div class="ph3"></div><div class="cap">${sk(70)}${sk(40)}</div></li>`).join('')}</ul>`:v==='failed'?fail():v==='empty'?empty('لا توجد صور بعد','img'):`<ul class="grid">${PH.map(p=>`<li><a class="ph-c" href="${to('p8','open')}"><div class="ph3">${i('img')}</div><div class="cap"><b style="font-size:.9375rem">${p[0]}</b><small>${num(p[1])}</small></div></a></li>`).join('')}</ul>`))}};

/* staff screens: shell is layout.html, not redrawn here */
function staff(title,sub,pr,body,extra=''){const pa=pr?btn(pr.t,{i:pr.i,b:pr.b}):'';return `<main><div class="wrap wide"><div class="stf-h"><div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div><span class="pa-d">${pa}</span></div>${extra}${body}</div></main>`+(pa?`<div class="abar wide stf"><div>${pa}</div></div>`:'')}
const sfail=m=>`<div class="ban" role="alert">${i('alert')}<span><b>${m}</b></span></div>`;

/* S1 */
V.s1={v:[['normal','عادي'],['selected','محدد'],['busy','جارٍ النشر'],['failed','فشل النشر']],draw(v){
 const sel=v!=='normal';const cells=[['تركيب الأرضيات','2026-11-18',0],['أعمال الدهان','2026-11-12',1],['واجهة المبنى','2026-11-05',0],['تمديد الكهرباء','2026-10-28',0]];
 const grid=`<ul class="grid">${cells.map((c,k)=>`<li class="ph-c"><div class="ph3">${i('img')}</div><div class="cap"><b style="font-size:.9375rem">${c[0]}</b><small>${num(c[1])}</small>${c[2]===1?`<div class="ln" style="flex-wrap:wrap;justify-content:flex-start">${pill('ok','منشورة')}<button type="button" class="lnk" style="white-space:nowrap">سحب النشر</button></div>`:`<label class="cb"><input type="checkbox" ${sel&&(k===0||k===2)?'checked':''}><span>تحديد</span></label>`}</div></li>`).join('')}</ul>`;
 return staff('صور الموقع','',{t:v==='busy'?'جارٍ النشر…':sel?'نشر المحدد ('+2+')':'نشر المحدد',i:'up',b:v==='busy'},grid,v==='failed'?sfail('لم تُنشر الصور'):'')}};

/* S2 */
const ROWS=[['المفهوم الأولي',16200,'1 من 2','مدفوعة'],['المخطط المبدئي',10800,'1 من 2','غير مدفوعة'],['التصور ثلاثي الأبعاد',10800,'0 من 2','غير مدفوعة'],['تطوير التصميم',10800,'0 من 2','غير مدفوعة'],['الوثائق النهائية',5400,'0 من 2','غير مدفوعة']];
V.s2={v:[['progress','جاري العمل'],['review','مراجعة داخلية'],['empty','قبل تحديد الشروط'],['failed','فشل الرفع'],['busy','جارٍ الرفع']],draw(v){
 if(v==='empty')return staff('التصميم','',null,empty('لا توجد مراحل بعد','info'));
 const st=v==='review'?['مراجعة داخلية','المالك']:['جاري العمل','فريق التصميم'];
 const rows=ROWS.map((r,k)=>`<tr class="${k===1?'cur':''}"><td data-l="المرحلة"><b>${r[0]}</b></td><td data-l="الحالة">${k===1?pill('run',st[0]):k===0?pill('ok','تمت الموافقة'):pill('none','لم تبدأ')}</td><td data-l="الأتعاب">${fig(r[1])}</td><td data-l="جولات التعديل">${r[2]}</td><td data-l="الدفع">${r[3]}</td><td data-l="بانتظار" class="${k===1?'':'e'}">${k===1?st[1]:''}</td></tr>`).join('');
 const tbl=`<table class="tbl"><thead><tr><th>المرحلة</th><th>الحالة</th><th>الأتعاب (ج.م)</th><th>جولات التعديل</th><th>الدفع</th><th>بانتظار</th></tr></thead><tbody>${rows}</tbody></table>`;
 const cur=v==='review'?`<div class="card"><div class="ln"><b>الملف</b>${pill('wm','بعلامة مائية')}</div><div class="row2">${btn('اعتماد وإرسال للعميل',{i:'chk'})}${btn('إرجاع للتنفيذ بسبب',{c:'sec2'})}</div></div>`:'';
 const p=v==='review'?null:{t:v==='busy'?'جارٍ الرفع…':'رفع الملف',i:'up',b:v==='busy'};
 return staff('التصميم','تصميم شقة المعادي',p,tbl+cur,v==='failed'?sfail('تعذّر رفع الملف'):'')}};

/* S3 */
const COND=[['اكتمال تحصيل المراحل الخمس',1,''],['تسليم الملف النهائي',1,''],['تحصيل آخر ١٠٪',0,'تسجيل تحصيل'],['نقل الملكية الفكرية للعميل',0,'تسجيل النقل']];
V.s3={v:[['unmet','شروط ناقصة'],['met','الشروط مكتملة'],['refused','مرفوض'],['busy','جارٍ الإغلاق'],['closed','مغلق']],draw(v){
 const ok=v!=='unmet';
 const cl=`<ul class="cl">${COND.map(c=>{const d=c[1]||ok;return `<li><span class="mk ${d?'ok':''}">${d?i('chk'):''}</span><span class="grow"><b>${c[0]}</b></span>${d?'':`<button type="button" class="btn sm sec2">${c[2]}</button>`}</li>`}).join('')}</ul>`;
 if(v==='closed')return staff('إغلاق المشروع','تصميم شقة المعادي',null,cl,`<div class="rec">${i('chk')}مغلق<small>${num('2026-11-22')}</small></div>`);
 return staff('إغلاق المشروع','تصميم شقة المعادي',ok?{t:v==='busy'?'جارٍ الإغلاق…':'إغلاق المشروع',i:'lock',b:v==='busy'}:null,cl,v==='refused'?sfail('لم يُغلق المشروع'):'')}};

/* S4 */
V.s4={v:[['normal','عادي'],['busy','جارٍ الإنشاء'],['failed','فشل'],['refused','مرفوض']],draw(v){
 const ro=(l,t)=>`<div class="field"><label>${l}</label><div class="ctl ro"><span class="val">${t}</span></div></div>`;
 const f=`<div class="form" style="max-inline-size:560px">${ro('المشروع الأصلي',PROJ)}${ro('العميل','أسامة الشريف')}<div class="field"><label>اسم المشروع</label><div class="ctl"><input value="فرش الفيلا"></div></div><div class="field"><label>نوع العقد</label><div class="ctl"><select><option>مقطوعية</option><option>التكلفة زائد</option></select></div></div></div>`;
 return staff('مشروع فرش جديد','',{t:v==='busy'?'جارٍ الإنشاء…':'إنشاء',i:'plus',b:v==='busy'},f,v==='failed'?sfail('لم يُنشأ المشروع'):v==='refused'?sfail('لا يمكن إنشاء فرش لهذا المشروع في حالته الحالية'):'')}};

/* S5 */
V.s5={v:[['normal','عادي'],['created','تم الإنشاء'],['refused','بلا رقم موبايل'],['busy','جارٍ الإنشاء']],draw(v){
 const nop=v==='refused';
 const f=`<div class="form" style="max-inline-size:560px"><div class="field"><label>العميل</label><div class="ctl"><select><option>أسامة الشريف</option></select></div></div><div class="field"><label>رقم الموبايل</label><div class="ctl ro ltr"><span class="val">${nop?'—':'01001234567'}</span></div></div><div class="field"><label>الدور</label><div class="ctl ro"><span class="val">عميل</span></div></div></div>`;
 if(v==='created')return staff('حساب عميل جديد','',null,f,`<div class="cfm"><b>كلمة السر المؤقتة</b><div class="pwbox"><span>Kf7-Qm29-Xt4</span><button type="button" class="ib" aria-label="نسخ">${i('copy')}</button></div></div>`);
 return staff('حساب عميل جديد','',{t:v==='busy'?'جارٍ الإنشاء…':'إنشاء',i:'plus',b:v==='busy'},f,nop?sfail('ملف العميل بلا رقم موبايل'):'')}};

/* S6 */
V.s6={v:[['normal','عند العميل']],draw(){
 const ST=[['مسودة','done'],['مراجعة فنية','done'],['موافقة العميل','cur'],['موافقة المالك','']];
 const ch=`<ol class="chain" style="grid-auto-flow:row">${ST.map(s=>`<li class="${s[1]}"><span class="st"><span class="mk ${s[1]==='done'?'ok':''}">${s[1]==='done'?i('chk'):''}</span>${s[0]}</span>${s[1]==='cur'?pill('wait','عند العميل'):''}</li>`).join('')}</ol>`;
 return staff('تعديل تصميم المطبخ','أمر تغيير',null,`<div class="kvs"><div class="kv"><span>الحالة</span>${pill('wait','عند العميل')}</div><div class="kv"><span>الإجمالي</span>${fig(48470,1)}</div></div>`+ch)}};

const D=V[SC]||V.p3;const view=q.get('view')||D.v[0][0];
const NAME={p1:'دخول',p2:'مشاريعي',p3:'المشروع',p4:'المستخلصات',p5:'أمر تغيير',p6:'مرحلة تصميم',p7:'الملفات',p8:'الصور',s1:'نشر الصور',s2:'التصميم',s3:'إغلاق التصميم',s4:'فرش جديد',s5:'حساب عميل',s6:'أمر تغيير للموظف'};
document.getElementById('root').innerHTML=D.draw(view);
document.getElementById('gs').innerHTML=Object.keys(V).map(k=>`<button type="button" aria-pressed="${k===SC}" onclick="location.search='?s=${k}'">${NAME[k]}</button>`).join('');
document.getElementById('gv').innerHTML=D.v.map(x=>`<button type="button" aria-pressed="${x[0]===view}" onclick="location.search='?s=${SC}&view=${x[0]}'">${x[1]}</button>`).join('');
document.getElementById('th').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};
</script>
</body>
</html>
