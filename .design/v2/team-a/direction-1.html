<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كف - تسجيل الدخول </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Direction 1: "Survey stake", re-based on the supplied KAAF logo: green #09221e, cream #e6d9d1. */
:root{
  /* ramp built from the logo: green #09221e, cream #e6d9d1. See README.md for what each token is for. */
  --g900:#09221e; --g800:#0f2e29; --g300:#9fb3ad;
  --c100:#f4eee9; --c200:#e6d9d1;
  --panel:var(--g900); --panel-ink:var(--c200);
  --bg:var(--c100); --ink:var(--g900); --dim:#4b5f59; --line:var(--g900); --field:#fbf8f5;
  --btn:var(--g900); --btn-ink:var(--c200);
  --err-bg:#f9e4dd; --err-ink:#7a1a0e; --err-bar:#c2321c;
  --dock:var(--c200); --focus:var(--g900);
  --display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#061815; --ink:var(--c200); --dim:var(--g300); --line:#7f9a92; --field:var(--g800);
  --btn:var(--c200); --btn-ink:var(--g900);
  --err-bg:#3b1612; --err-ink:#ffd0c6; --err-bar:#ff7b63; --dock:#030d0b; --focus:var(--c200);}}
:root[data-theme="dark"]{
  --bg:#061815; --ink:var(--c200); --dim:var(--g300); --line:#7f9a92; --field:var(--g800);
  --btn:var(--c200); --btn-ink:var(--g900);
  --err-bg:#3b1612; --err-ink:#ffd0c6; --err-bar:#ff7b63; --dock:#030d0b; --focus:var(--c200);}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body);min-height:100svh}
button,input{font:inherit;color:inherit}

/* preview chrome, not part of the screen */
.dock{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;
  padding:.5rem 1rem;background:var(--dock);font-size:.8125rem;color:var(--dim)}
.seg{display:flex;gap:.25rem}
.dock button{min-height:36px;padding:0 .75rem;border:1px solid var(--dim);background:transparent;border-radius:4px;cursor:pointer;color:var(--ink)}
.dock button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

.stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:calc(100svh - 52px)}

/* brand panel: the supplied logo (flat #09221e) sits on the same green, no cutout */
.brand{position:relative;overflow:hidden;background:var(--panel);color:var(--panel-ink);
  padding:clamp(1.5rem,4vw,3.5rem);display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}
.logo{display:block;margin:auto;inline-size:min(440px,100%);block-size:auto;aspect-ratio:519/155;user-select:none}
.claim{max-inline-size:22ch;text-wrap:balance;align-self:flex-start;font:600 clamp(1.25rem,1.9vw,1.7rem)/1.7 var(--display);margin:0;color:var(--panel-ink)}

/* form side */
.side{display:flex;flex-direction:column;padding:clamp(1.25rem,3vw,2.5rem)}
.lang{align-self:flex-end;min-block-size:44px;padding:0 1rem;border:2px solid var(--line);background:transparent;border-radius:6px;font-weight:600;cursor:pointer}
.lang:hover{background:var(--ink);color:var(--bg)}
.formwrap{flex:1;display:flex;align-items:center;justify-content:center;padding-block:2rem}
form{inline-size:100%;max-inline-size:384px}
h1{font:700 clamp(1.75rem,2.6vw,2.25rem)/1.4 var(--display);margin:0 0 .5rem}
.sub{margin:0 0 2rem;color:var(--dim)}
.f{margin-block-end:1.25rem}
.f+.f{margin-block-end:0}
label{display:block;font-weight:600;margin-block-end:.4rem}
input{inline-size:100%;block-size:56px;padding-inline:1rem;background:var(--field);border:2px solid var(--line);border-radius:6px;font-size:1.0625rem}
input[dir="ltr"]{text-align:start}
input:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
input:focus-visible{border-color:var(--focus)}
/* ONE refusal region between fields and button. The slot is a fixed two-line height (zero layout shift);
   idle, it holds the owner-reset note in the same cell, so the space reads as intended, not empty. */
.slot{display:grid;min-block-size:4.25rem;margin-block:.5rem .75rem;align-items:center}
.slot>*{grid-area:1/1}
.note{margin:0;color:var(--dim);font-size:.9rem;line-height:1.6;}
.refusal{display:none}
.refusal .msg{gap:.75rem;align-items:flex-start;padding:.6rem .9rem;background:var(--err-bg);color:var(--err-ink);display:flex;
  border-inline-start:6px solid var(--err-bar);border-radius:4px;font-weight:500;line-height:1.5;font-size:.96875rem}
.msg svg{flex:none;inline-size:22px;block-size:22px;margin-block-start:1px}
[data-state="refusal"] .refusal{display:block}
[data-state="refusal"] .note{visibility:hidden}
.go{inline-size:100%;block-size:58px;border:0;border-radius:6px;background:var(--btn);color:var(--btn-ink);font:700 1.15rem/1 var(--display);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.75rem;transition:transform .12s}
.go:active{transform:translateY(2px)}
.go .spin{display:none;inline-size:20px;block-size:20px;border:3px solid color-mix(in srgb,var(--btn-ink) 30%,transparent);border-top-color:var(--btn-ink);border-radius:50%;animation:r .8s linear infinite}
[data-state="busy"] .go{cursor:progress;opacity:.88}
[data-state="busy"] .go .spin{display:block}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.go .spin{animation-duration:2.4s}.go{transition:none}}

/* Phone ("thumb bar"): cream page, a slim 72px green header (mark and language switch on one line),
   then the form as two groups. The statement (heading and subtitle) sits under the header; the action
   (fields, refusal slot, full-bleed 72px bar) is packed to the bottom edge for one-handed reach. The
   space between the two is deliberate negative space, kept proportionate by sizing the controls up. */
@media (max-width:820px){
  .stage{grid-template-columns:1fr;grid-template-rows:72px minmax(0,1fr);min-height:calc(100dvh - 52px)}
  .stage::before{content:"";grid-row:1;grid-column:1;background:var(--panel)}
  .side{display:contents}
  .brand{display:contents}
  .logo{grid-row:1;grid-column:1;align-self:center;justify-self:start;margin:0 16px;inline-size:96px;z-index:1}
  /* The tagline is desktop-only (client decision): on a phone the header carries the brand. */
  .claim{display:none}
  .lang{grid-row:1;grid-column:1;align-self:center;justify-self:end;margin:0 16px;z-index:1;color:var(--panel-ink);border-color:var(--panel-ink)}
  .lang:hover{background:var(--panel-ink);color:var(--panel)}
  .formwrap{grid-row:2;grid-column:1;display:flex;align-items:stretch;padding:0}
  form{max-inline-size:none;display:flex;flex-direction:column;padding:clamp(24px,4.5vh,40px) 16px 0}
  /* the heading is the screen's one big typographic moment: stacked word by word (min-content = longest word) */
  h1{font-size:3.5rem;line-height:1.3;inline-size:min-content;margin-block-end:.5rem}
  :lang(en) h1{inline-size:auto;font-size:3rem}
  /* margin-block-end:auto is what splits the form into the top statement and the bottom action */
  .sub{margin-block-end:auto;font-size:1rem}
  .f{margin-block-end:1.1rem}
  .f+.f{margin-block-end:0}
  label{font-size:1.0625rem;margin-block-end:.45rem}
  input{block-size:60px;font-size:1.125rem}
  .slot{margin-block:.4rem .75rem}
  .note{padding-block-start:0}
  .go{border-radius:0;block-size:calc(72px + env(safe-area-inset-bottom));padding-block-end:env(safe-area-inset-bottom);margin-inline:-16px;inline-size:calc(100% + 32px);font-size:1.25rem}
}
/* keyboard up: visible height under ~620px. Drop the statement so fields, refusal and bar stay above the keyboard. */
@media (max-width:820px) and (max-height:620px){
  form{padding-block-start:12px}
  h1{display:none}
  .sub{display:none}
  form>.f:first-of-type{margin-block-start:auto}
  .f{margin-block-end:.75rem}
  input{block-size:56px}
  .slot{min-block-size:3.9rem}
}
</style>
</head>
<body data-state="idle">
<div class="dock" role="group" aria-label="Preview">
  <div class="seg" role="group" aria-label="الحالة">
    <button type="button" data-st="idle" aria-pressed="true">عادي</button>
    <button type="button" data-st="refusal" aria-pressed="false">رفض</button>
    <button type="button" data-st="busy" aria-pressed="false">جارٍ الإرسال</button>
  </div>
  <button type="button" id="theme">فاتح / داكن</button>
</div>

<main class="stage">
  <section class="brand">
    <img class="logo" src="../brand/kaaf-wordmark.png" width="519" height="155" alt="KAAF">
    <p class="claim" data-i="claim">كل جنيه مسجَّل. كل موقع مُتابَع.</p>
  </section>

  <section class="side">
    <button type="button" class="lang" id="lang" lang="en" dir="ltr">English</button>
    <div class="formwrap">
      <form id="f" novalidate>
        <h1 data-i="title">تسجيل الدخول</h1>
        <p class="sub" data-i="sub">أدخل بيانات الحساب الذي أنشأه لك المالك.</p>
        <div class="f">
          <label for="u" data-i="user">اسم المستخدم</label>
          <input id="u" name="username" type="text" dir="ltr" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
        <div class="f">
          <label for="p" data-i="pass">كلمة المرور</label>
          <input id="p" name="password" type="password" dir="ltr" autocomplete="current-password" minlength="8" required>
        </div>
        <div class="slot">
          <p class="note" data-i="help">نسيت كلمة المرور؟ اطلب من المالك إعادة تعيينها.</p>
          <div class="refusal" role="alert" aria-live="assertive">
            <div class="msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.5"/></svg><span data-i="refuse">لم يتم الدخول. تأكد من اسم المستخدم وكلمة المرور، أو تواصل مع المالك.</span></div>
          </div>
        </div>
        <button class="go" type="submit" id="go"><span class="spin" aria-hidden="true"></span><span data-i="go">دخول</span></button>
      </form>
    </div>
  </section>
</main>

<script>
const T={ar:{claim:"كل جنيه مسجَّل. كل موقع مُتابَع.",title:"تسجيل الدخول",sub:"أدخل بيانات الحساب الذي أنشأه لك المالك.",user:"اسم المستخدم",pass:"كلمة المرور",
 refuse:"لم يتم الدخول. تأكد من اسم المستخدم وكلمة المرور، أو تواصل مع المالك.",go:"دخول",busy:"جارٍ التحقق…",help:"نسيت كلمة المرور؟ اطلب من المالك إعادة تعيينها.",lang:"English"},
 en:{claim:"Every pound recorded. Every site tracked.",title:"Sign in",sub:"Use the account the owner created for you.",user:"User name",pass:"Password",
 refuse:"Sign-in failed. Check your user name and password, or contact the owner.",go:"Sign in",busy:"Checking…",help:"Forgot your password? Ask the owner to reset it.",lang:"العربية"}};
let lang="ar",state="idle";
const $=s=>document.querySelector(s),H=document.documentElement;
function render(){const t=T[lang];
  H.lang=lang;H.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
  $("#lang").textContent=t.lang;$("#lang").lang=lang==="ar"?"en":"ar";$("#lang").dir=lang==="ar"?"ltr":"rtl";
  if(state==="busy")$("#go [data-i=go]").textContent=t.busy;
  $("#go").disabled=state==="busy";$("#go").setAttribute("aria-busy",state==="busy");
  document.body.dataset.state=state;
  document.querySelectorAll("[data-st]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.st===state));
  const filled=state!=="idle";$("#u").value=filled?"m.hassan":"";$("#p").value=filled?"pa55word-demo":"";}
function setState(s){state=s;render()}
document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>setState(b.dataset.st));
$("#lang").onclick=()=>{lang=lang==="ar"?"en":"ar";render()};
$("#theme").onclick=()=>{const dark=H.dataset.theme?H.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;H.dataset.theme=dark?"light":"dark"};
$("#f").onsubmit=e=>{e.preventDefault();setState("busy");setTimeout(()=>setState("refusal"),1500)};
const h=location.hash.slice(1);if(["idle","refusal","busy"].includes(h))state=h;
if(new URLSearchParams(location.search).get("lang")==="en")lang="en";
render();
</script>
</body>
</html>
