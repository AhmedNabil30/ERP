<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كف - المقايسة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --g900:#09221e; --g800:#0f2e29; --g300:#9fb3ad; --c100:#f4eee9; --c200:#e6d9d1; --radius:6px;
  --bg:var(--c100); --surface:#fbf8f5; --head:#ebe0d8; --ink:var(--g900); --dim:#4b5f59; --line:rgba(9,34,30,.16); --hover:rgba(9,34,30,.055);
  --btn:var(--g900); --btn-h:#25544b; --btn-ink:var(--c200); --field:#fbf8f5; --fieldline:var(--g900); --focus:var(--g900);
  --err-bg:#f9e4dd; --err-ink:#7a1a0e; --err-bar:#c2321c;
  --st-run-bg:#d3e3db; --st-run-ink:#0b3b32; --st-done-bg:var(--g900); --st-done-ink:var(--c200);
  --st-stuck-bg:#f9e4dd; --st-stuck-ink:#7a1a0e; --st-post-bg:#e6d9d1; --st-post-ink:#43392f; --st-none-ink:#4b5f59;
  --note-bg:#ebe0d8; --ok-bg:#d3e3db; --ok-ink:#0b3b32; --asm-bg:#f3e4c9; --asm-ink:#4a3410;
  --scrim:rgba(3,13,11,.55); --strip:var(--c200); --shadow:0 12px 36px rgba(9,34,30,.22);
  --display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --side:256px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#061815; --surface:#0a1f1b; --head:#0f2e29; --ink:var(--c200); --dim:var(--g300); --line:rgba(230,217,209,.18); --hover:rgba(230,217,209,.06);
  --btn:var(--c200); --btn-h:#fbf6f2; --btn-ink:var(--g900); --field:#0f2e29; --fieldline:#7f9a92; --focus:var(--c200);
  --err-bg:#3b1612; --err-ink:#ffd0c6; --err-bar:#ff7b63;
  --st-run-bg:#17403a; --st-run-ink:#e6d9d1; --st-done-bg:var(--c200); --st-done-ink:var(--g900);
  --st-stuck-bg:#3b1612; --st-stuck-ink:#ffd0c6; --st-post-bg:#1d2b27; --st-post-ink:#c9bfb7; --st-none-ink:#9fb3ad;
  --note-bg:#0f2e29; --ok-bg:#17403a; --ok-ink:#e6d9d1; --asm-bg:#3d3017; --asm-ink:#f1dcae; --strip:#030d0b; --shadow:0 12px 36px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --bg:#061815; --surface:#0a1f1b; --head:#0f2e29; --ink:var(--c200); --dim:var(--g300); --line:rgba(230,217,209,.18); --hover:rgba(230,217,209,.06);
  --btn:var(--c200); --btn-h:#fbf6f2; --btn-ink:var(--g900); --field:#0f2e29; --fieldline:#7f9a92; --focus:var(--c200);
  --err-bg:#3b1612; --err-ink:#ffd0c6; --err-bar:#ff7b63;
  --st-run-bg:#17403a; --st-run-ink:#e6d9d1; --st-done-bg:var(--c200); --st-done-ink:var(--g900);
  --st-stuck-bg:#3b1612; --st-stuck-ink:#ffd0c6; --st-post-bg:#1d2b27; --st-post-ink:#c9bfb7; --st-none-ink:#9fb3ad;
  --note-bg:#0f2e29; --ok-bg:#17403a; --ok-ink:#e6d9d1; --asm-bg:#3d3017; --asm-ink:#f1dcae; --strip:#030d0b; --shadow:0 12px 36px rgba(0,0,0,.6);}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{inline-size:22px;block-size:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{inline-size:18px;block-size:18px}
.vh{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible,.is-focus{outline:3px solid var(--focus);outline-offset:3px}
bdi{unicode-bidi:isolate}

/* ---------- preview strip (NOT part of the design) ---------- */
.strip{background:var(--strip);font-size:.8125rem;position:relative;z-index:80}
.strip summary{list-style:none;display:flex;align-items:center;gap:.5rem;min-block-size:36px;padding:0 1rem;cursor:pointer}
.strip summary::-webkit-details-marker{display:none}
.strip .panelx{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;padding:.25rem 1rem .75rem}
.strip .grp{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center}
.strip .grp>b{font-weight:600;margin-inline-end:6px}
.strip button{min-block-size:36px;padding:0 .7rem;border:1px solid currentColor;background:transparent;border-radius:var(--radius);color:inherit}
.strip button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
body.embed .strip{display:none}
body.embed .strip{display:none}
/* ---------- app + shell (layout.html, unchanged) ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);block-size:calc(100dvh - 36px);overflow:hidden}
.app[data-rail="1"]{--side:76px}
.side{background:var(--g900);color:var(--c200);display:flex;flex-direction:column;min-inline-size:0;min-block-size:0}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding-inline:20px 12px;block-size:72px;flex:none}
.side-top img{display:block;inline-size:104px;block-size:auto;aspect-ratio:519/155}
.coll{inline-size:44px;block-size:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--c200);border-radius:var(--radius)}
.coll:hover{background:rgba(230,217,209,.1)}
[dir="rtl"] .coll .chev,[dir="ltr"] .app[data-rail="1"] .coll .chev{transform:scaleX(-1)}
[dir="rtl"] .app[data-rail="1"] .coll .chev{transform:none}
.nav{flex:1;overflow-y:auto;padding:8px 12px 16px;min-block-size:0}
.grp-h{margin:18px 0 6px;padding-inline:12px;font:600 .8125rem/1.4 var(--display);color:var(--g300)}
.nav .grp:first-child .grp-h{margin-block-start:6px}
.nav .grp+.grp{margin-block-start:10px;border-block-start:1px solid rgba(230,217,209,.14)}
.row{position:relative;display:flex;align-items:center;gap:14px;min-block-size:44px;padding:0 12px;border-radius:var(--radius);color:var(--c200);text-decoration:none;font:500 .96875rem/1.3 var(--body)}
.row:hover{background:rgba(230,217,209,.09)}
.row:focus-visible{outline:3px solid var(--c200);outline-offset:-3px}
.row[aria-current="page"]{background:rgba(230,217,209,.15);font-weight:600}
.row[aria-current="page"]::before{content:"";position:absolute;inset-block:8px;inset-inline-start:-12px;inline-size:5px;border-start-end-radius:3px;border-end-end-radius:3px;background:var(--c200)}
.side-foot{flex:none;padding:12px;border-block-start:1px solid rgba(230,217,209,.14)}
.who{display:flex;align-items:center;gap:12px;padding:6px 6px 12px}
.av{inline-size:40px;block-size:40px;border-radius:50%;background:var(--c200);color:var(--g900);display:grid;place-items:center;font:700 1rem/1 var(--display);flex:none}
.who b{display:block;font:600 .96875rem/1.3 var(--body)}
.who span{display:block;font-size:.8125rem;color:var(--g300)}
.ctl2{display:flex;gap:8px}
.ctl2 button{flex:1;min-block-size:44px;border:1.5px solid rgba(230,217,209,.55);background:transparent;color:var(--c200);border-radius:var(--radius);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.ctl2 button:hover{background:rgba(230,217,209,.1)}
.i-short{display:none}
.app[data-rail="1"] .i-short{display:inline;font-weight:700}
.app[data-rail="1"] .lbl,.app[data-rail="1"] .grp-h,.app[data-rail="1"] .who>div,.app[data-rail="1"] .side-top img,.app[data-rail="1"] .ctl2 .t{display:none}
.app[data-rail="1"] .side-top{justify-content:center;padding:0}
.app[data-rail="1"] .row{justify-content:center;padding:0}
.app[data-rail="1"] .who{justify-content:center;padding-inline:0}
.app[data-rail="1"] .ctl2{flex-direction:column}
.main{min-inline-size:0;min-block-size:0;display:flex;flex-direction:column;overflow-y:auto;position:relative}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:12px 32px 12px;flex-wrap:wrap}
.ph h1{font:700 2rem/1.3 var(--display);margin:0}
.acts{display:flex;align-items:center;gap:12px}
.frame{padding:0 32px 56px;flex:1;min-inline-size:0}

/* ---------- kit parts, unchanged ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-block-size:48px;padding:0 22px;border:2px solid transparent;border-radius:var(--radius);background:var(--btn);color:var(--btn-ink);font:700 1rem/1 var(--display);white-space:nowrap;text-decoration:none}
.btn.sm{min-block-size:44px;padding:0 16px;font-size:.9375rem}
.btn:hover{background:var(--btn-h)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sec2{background:transparent;color:var(--ink);border-color:var(--fieldline)}
.btn.sec2:hover{background:var(--hover)}
.btn.quiet{background:transparent;color:var(--ink)}
.btn.quiet:hover{background:var(--hover)}
.ib{inline-size:44px;block-size:44px;display:inline-grid;place-items:center;border:2px solid transparent;background:transparent;color:var(--ink);border-radius:var(--radius);padding:0}
.ib:hover{background:var(--hover)}
.lnk{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;font-weight:500;background:none;border:0;padding:0}
.lnk:hover{text-decoration-thickness:3px}
a.lnk{display:inline-flex;align-items:center;min-block-size:44px}
.back{display:inline-flex;align-items:center;gap:6px;min-block-size:44px;color:var(--ink);text-decoration:none;font-weight:600}
[dir="rtl"] .back svg{transform:scaleX(-1)}
.back:hover{text-decoration:underline;text-underline-offset:4px}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-inline-size:24px;block-size:24px;padding:0 8px;border-radius:var(--radius);border:1.5px solid var(--fieldline);font:600 .8125rem/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge svg{inline-size:14px;block-size:14px}
.badge.q{border-color:var(--line);color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:7px;block-size:28px;padding-inline:10px 12px;border-radius:var(--radius);font:600 .8125rem/1 var(--body);white-space:nowrap;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 30%,transparent)}
.pill svg{inline-size:13px;block-size:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s-run{background:var(--st-run-bg);color:var(--st-run-ink)}
.s-done{background:var(--st-done-bg);color:var(--st-done-ink)}
.s-none{background:transparent;color:var(--st-none-ink);box-shadow:inset 0 0 0 1.5px currentColor}
.spin{display:none;inline-size:18px;block-size:18px;border:3px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.ban{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius);border-inline-start:6px solid var(--err-bar);background:var(--err-bg);color:var(--err-ink);font-weight:500;line-height:1.55}
.ban svg{margin-block-start:2px}
.ban.note{background:var(--note-bg);color:var(--ink);border-inline-start-color:var(--fieldline);font-weight:400}
.ban.ok{background:var(--ok-bg);color:var(--ok-ink);border-inline-start-color:var(--ok-ink)}
.ban .act{margin-inline-start:auto;flex:none}
.ban>svg,.locked>svg,.cfm svg,.rec>svg{inline-size:20px;block-size:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cfm>span{display:flex;gap:10px;align-items:flex-start}
.ban b{font-weight:700}
.ban.rowc{flex-wrap:wrap;align-items:center}
.state{border:1.5px solid var(--line);border-radius:var(--radius);background:transparent;padding:44px 24px;text-align:center;display:grid;justify-items:center;gap:10px}
.state.refused{border-style:dashed;border-color:var(--fieldline)}
.state.solid{background:var(--surface)}
.state .ico{inline-size:56px;block-size:56px;border-radius:var(--radius);display:grid;place-items:center;background:var(--head)}
.state.refused .ico{border-radius:50%;border:2px solid var(--fieldline);background:transparent}
.state .ico svg{inline-size:28px;block-size:28px}
.state h4{font:700 1.125rem/1.4 var(--display);margin:4px 0 0}
.state p{margin:0;color:var(--dim);max-inline-size:46ch;font-size:.9375rem}
.sk{display:inline-block;block-size:14px;border-radius:4px;background:linear-gradient(90deg,var(--line),var(--hover),var(--line));background-size:200% 100%;animation:sh 1.4s linear infinite;vertical-align:middle}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}}
.sk.b{display:block}

/* ---------- phone (kit breakpoint) ---------- */
.m-only{display:none}
.mh{flex:none}
@media (max-width:1100px){
}
@media (max-width:820px){
  .app{display:flex;flex-direction:column;block-size:calc(100dvh - 36px)}
  .side,.d-only{display:none!important}
  .m-only{display:block}
  .mh{display:flex;align-items:center;justify-content:space-between;block-size:56px;padding:0 16px;background:var(--g900);color:var(--c200)}
  .mh img{display:block;inline-size:88px;block-size:auto;aspect-ratio:519/155}
  .mh .lang{min-block-size:44px;padding:0 14px;border:1.5px solid rgba(230,217,209,.6);background:transparent;color:var(--c200);border-radius:var(--radius);font-weight:600}
  .main{flex:1;overscroll-behavior:contain}
  .ph{display:block;padding:8px 16px 8px}
  .ph h1{font-size:1.625rem}
  .frame{padding:0 16px 24px}
  .abar{flex:none;display:flex;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-block-start:1px solid var(--line)}
  .abar .menu{flex:none;min-inline-size:116px;block-size:60px;display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--fieldline);background:transparent;border-radius:var(--radius);font:700 1rem/1 var(--display)}
  .abar .btn{flex:1;block-size:60px;font-size:1.0625rem}
  [data-sheet="1"] .abar{visibility:hidden}
  .nsheet{position:fixed;inset-inline:0;inset-block-end:0;z-index:70;max-block-size:90dvh;display:none;flex-direction:column;background:var(--bg);border-start-start-radius:var(--radius);border-start-end-radius:var(--radius);box-shadow:0 -12px 40px rgba(0,0,0,.35)}
  [data-sheet="1"] .scrim{display:block;z-index:65}
  [data-sheet="1"] .nsheet{display:flex}
  .grab{inline-size:44px;block-size:4px;border-radius:2px;background:var(--line);margin:10px auto 0;flex:none}
  .sh-top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-block-end:1px solid var(--line)}
  .sh-top .who{padding:0;flex:1}.sh-top .who span{color:var(--dim)}
  .sh-top button{inline-size:48px;block-size:48px;border:1.5px solid var(--fieldline);background:transparent;border-radius:var(--radius);display:grid;place-items:center}
  .sh-nav{overflow-y:auto;padding:6px 12px 14px}
  .sh-nav .grp-h{color:var(--dim)}
  .sh-nav .grp+.grp{border-block-start:1px solid var(--line)}
  .sh-nav .row{min-block-size:52px;color:var(--ink);font-size:1.0625rem}
  .sh-nav .row[aria-current="page"]{background:var(--head)}
  .sh-nav .row[aria-current="page"]::before{background:var(--ink)}
}
.scrim{display:none;position:fixed;inset:0;background:var(--scrim)}
@media (max-width:820px){.scrim{inset:0}}
/* ---------- THIS SCREEN: new parts (documented in README) ---------- */
/* date segmented control: the kit's .seg, unchanged */
.seg{display:inline-flex;border:2px solid var(--fieldline);border-radius:var(--radius);overflow:hidden;background:var(--field)}
.seg button{min-block-size:44px;padding:0 20px;border:0;background:transparent;font:600 .9375rem/1 var(--body);display:inline-flex;align-items:center;gap:8px}
.seg button+button{border-inline-start:2px solid var(--fieldline)}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.seg button:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
/* kit search field */
.search{position:relative;max-inline-size:100%}
.search>svg{position:absolute;inset-inline-start:14px;inset-block-start:50%;transform:translateY(-50%);color:var(--dim);inline-size:20px;block-size:20px;pointer-events:none}
.search input{inline-size:100%;block-size:48px;padding-inline:44px 14px;border:2px solid var(--fieldline);border-radius:var(--radius);background:var(--field);font-size:1rem;outline:none}
.search input:focus{outline:3px solid var(--focus);outline-offset:3px}
.search input::placeholder{color:var(--dim)}
.ck{display:flex;align-items:center;gap:12px;min-block-size:44px;cursor:pointer;font-size:1rem;position:relative}
.ck.is-focus{outline:none}
.ck input{position:absolute;opacity:0;inline-size:1px;block-size:1px}
.ck .bx{inline-size:24px;block-size:24px;flex:none;border:2px solid var(--fieldline);background:var(--field);display:grid;place-items:center;border-radius:var(--radius)}
.ck .bx svg{inline-size:16px;block-size:16px;stroke:var(--bg);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none}
.ck.rd .bx{border-radius:50%}
.ck input:checked+.bx,.ck.on .bx,.ck.ind .bx{background:var(--ink);border-color:var(--ink)}
.ck.rd input:checked+.bx,.ck.rd.on .bx{background:var(--ink);box-shadow:inset 0 0 0 4px var(--field)}
.ck input:checked+.bx svg.ck-c,.ck.on .bx svg.ck-c,.ck.ind .bx svg.ck-i{display:block}
.ck.rd .bx svg{display:none!important}
.ck:hover .bx,.ck.is-hover .bx{border-color:var(--ink);outline:4px solid var(--hover)}
.ck input:focus-visible+.bx,.ck.is-focus .bx{outline:3px solid var(--focus);outline-offset:3px}
.ck.dis{opacity:.45;cursor:not-allowed}
.ck.err .bx{border-color:var(--err-bar);box-shadow:inset 0 0 0 1px var(--err-bar)}
.ck .lb small{display:block;color:var(--dim);font-size:.875rem;line-height:1.4}
.tabs{display:flex;border-block-end:2px solid var(--line);overflow-x:auto;gap:4px}
/* ---------- THIS SCREEN: new parts (documented in README) ---------- */
.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--radius);border-inline-start:6px solid var(--ok-ink);background:var(--ok-bg);color:var(--ok-ink);font-weight:600;line-height:1.5}
.rec svg{inline-size:20px;block-size:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.field{display:grid;gap:6px;min-inline-size:0}
.field>label{display:flex;gap:8px;align-items:center;font:600 1rem/1.4 var(--body)}
.ctl{display:flex;align-items:stretch;min-inline-size:0;block-size:48px;border:2px solid var(--fieldline);border-radius:var(--radius);background:var(--field)}
.ctl input,.ctl .val{flex:1;min-inline-size:0;border:0;background:transparent;padding:0 14px;font-size:1.0625rem;outline:none;block-size:100%;display:flex;align-items:center}
.ctl:focus-within,.ctl.is-focus{outline:3px solid var(--focus);outline-offset:3px}
.ctl .aff{display:flex;align-items:center;padding:0 14px;border-inline-start:2px solid var(--line);color:var(--dim);font-weight:600;white-space:nowrap}
.ctl.money input,.ctl.money .val{text-align:end;direction:ltr;font-variant-numeric:tabular-nums;justify-content:flex-end}
.ctl.ro{background:var(--head);border-color:var(--line)}
.ctl.ro .val{font-weight:700}
.atag{display:inline-flex;align-items:center;gap:5px;block-size:24px;padding:0 8px;border-radius:var(--radius);border:1.5px dashed var(--fieldline);font:600 .75rem/1 var(--body);color:var(--ink);flex:none;white-space:nowrap}
.atag svg{inline-size:14px;block-size:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bdg{display:inline-flex;align-items:center;gap:6px;min-block-size:28px;padding:0 10px;border-radius:var(--radius);border:1.5px solid var(--line);color:var(--dim);font:600 .8125rem/1 var(--body);white-space:nowrap}
.bdg svg{inline-size:15px;block-size:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ph .meta{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-block-start:4px}
.ph .acts{flex-wrap:wrap}
.ph .acts-m{margin-block-start:6px}

/* the workspace: lines + catalogue pane */

 ['f1','f','بلاط بورسلين أرضيات 80×80','م²',1318.2],['f2','f','رخام جلالة للأرضيات','م²',2450.5],['f3','f','سيراميك حوائط حمامات','م²',811.2],['f4','f','دهان بلاستيك فاخر مع معجون','م²',144.3],['f5','f','أسقف جبس بورد مستوية','م²',310],['fx','f','سيراميك أرضيات 60×60','م²',640,1],
 ['e1','e','نقطة إنارة','نقطة',385],['e2','e','نقطة بريزة','نقطة',420],['e3','e','لوحة كهرباء رئيسية','عدد',6200],

].forEach(a=>CAT[a[0]]={id:a[0],b:a[1],n:a[2],u:a[3],r:a[4],fail:!!a[5]});
const LINES0=[['m1',1146,1],['p1',2467.5,1],['p2',641.25,1],['p3',783.5],['f1',648.75],['f2',214.5],['f3',308.25],['f4',3126]];

const BASES=[
 {p:1,n:'شقة 120 م، سوبر لوكس',c:7,l:[['m1',300],['p1',420],['p3',120],['f1',120],['f4',420],['e1',28],['s1',14]]},
 {p:1,n:'شقة 90 م، تشطيب عادي',c:5,l:[['m1',210],['p1',320],['p3',90],['f1',90],['f4',320]]},
 {n:'فيلا 31 — القاهرة الجديدة',c:8,d:'مارس 2026',l:[['m1',980],['m3',62],['p1',2100],['p3',700],['f1',560],['f4',2800],['e1',74],['s1',28]]},
 {n:'شقة 12 — الشيخ زايد',c:6,d:'يناير 2026',l:[['m1',420],['p1',900],['p3',310],['f1',280],['f4',1100],['s1',16]]},
 {n:'مبنى إداري — العبور',c:11,d:'نوفمبر 2025',l:[['m2',1500],['p1',3200],['f1',1800],['f5',900],['e1',160],['e3',4]]},
 {n:'فيلا 18 — الشروق',c:7,d:'أغسطس 2025',l:[['m1',1010],['p2',500],['f2',160],['f3',240],['e2',60],['s2',30]]}];
const cp=o=>JSON.parse(JSON.stringify(o));
const fm=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fq=n=>n.toLocaleString('en-US',{maximumFractionDigits:3});
const BUILD=['building','edit','pending','sheet','dropfail','partial','sign','signerr','custom','customerr','review'];
const S={view:q0.get('view')||'building',lines:[],ticks:new Set(),open:{m:1,p:1,f:1,e:0,s:0},q:'',rowErr:{},pb:null,started:false,sx:null,bq:'',drag:null,hold:'',adv:'',serr:false,cf:{n:'',u:'',r:'',b:''},cerr:false};
const mobile=()=>matchMedia('(max-width:820px)').matches;
const ro=()=>S.view==='frozen'||S.view==='archived';
const isBuild=()=>BUILD.includes(S.view);
const lineTot=l=>l.qty>0?l.qty*CAT[l.id].r:null;
const pendN=()=>S.lines.filter(l=>!(l.qty>0)).length;
const totalV=()=>pendN()?null:S.lines.reduce((a,l)=>a+lineTot(l),0);
const added=id=>S.lines.some(l=>l.id===id);

function setup(){
  const v=S.view;S.lines=[];S.ticks=new Set();S.rowErr={};S.pb=null;S.started=false;S.sx=null;S.q='';S.bq='';S.hold='';S.adv='';S.serr=false;S.cf={n:'',u:'',r:'',b:''};S.cerr=false;
  if(!['empty','base','blank','loading','failed','design'].includes(v))S.lines=LINES0.map(a=>({id:a[0],qty:a[1],s:a[2]}));
  if(v==='pending')S.lines.push({id:'e1',qty:null});
  if(v==='blank')S.started=true;
  if(v==='dropfail')S.rowErr.fx=true;
  if(v==='partial'){S.ticks=new Set(['e1','e2','fx','e3']);addMany([...S.ticks],true)}
  if(v==='base')S.sx='base';
  if(v==='sign'||v==='signerr')S.sx='sign';if(v==='signerr')S.serr=true;
  if(v==='custom'||v==='customerr')S.sx='custom';if(v==='customerr'){S.cerr=true;S.cf={n:'ورق جدران مستورد',u:'',r:'',b:''}}
  if(v==='review'){CAT.c1={id:'c1',b:'f',n:CUSTOM0.n,u:CUSTOM0.u,r:CUSTOM0.r,custom:1};S.lines.push({id:'c1',qty:120})}
  if(['sheet','dropfail','partial'].includes(v)&&mobile())S.sx='add';
}

/* ============ parts ============ */
const sk=w=>`<span class="sk b" style="inline-size:${w}"></span>`;
const tags=l=>{if(ro())return '';const rv=CAT[l.id].custom?`<span class="atag">${mi('clock')}بانتظار المراجعة</span>`:'';const q=!(l.qty>0)?`<span class="atag">${mi('info')}بلا كمية</span>`:(l.s?`<span class="qs">${mi('check')}معاينة</span>`:`<span class="atag">تقديري</span>`);return q+rv};
function row(l){const c=CAT[l.id],t=lineTot(l),pend=!(l.qty>0),r=ro();
  return `<div class="ln ${pend&&!r?'pend':''}" data-ln="${l.id}"><div class="nm"><b>${c.n}</b><span class="tags">${tags(l)}</span></div>`
  +(r?'':`<button type="button" class="ib rm" data-rm="${l.id}" aria-label="حذف ${c.n}">${i('x')}</button>`)
  +`<div class="calc"><div class="qty">${r?`<span class="ro"><bdi dir="ltr">${fq(l.qty)}</bdi> ${c.u}</span>`:`<div class="qi ${S.view==='edit'&&l.id==='m1'?'is-focus':''}"><input type="text" inputmode="decimal" dir="ltr" data-q="${l.id}" value="${l.qty?fq(l.qty):''}" placeholder="0" aria-label="كمية ${c.n}"><span class="aff">${c.u}</span></div>`}</div>`
  +`<div class="rt"><bdi dir="ltr">${fm(c.r)}</bdi></div><div class="tt" id="t-${l.id}">${t==null?'<span class="none">—</span>':`<bdi dir="ltr">${fm(t)}</bdi>`}</div></div></div>`}
function subOf(bid){const ls=S.lines.filter(l=>CAT[l.id].b===bid);return ls.some(l=>!(l.qty>0))?null:ls.reduce((a,l)=>a+lineTot(l),0)}
const subH=bid=>{const s=subOf(bid);return s==null?'<span>—</span>':`<bdi dir="ltr">${fm(s)}</bdi>`};
function linesH(){
  const by=BABS.map(b=>[b,S.lines.filter(l=>CAT[l.id].b===b.id)]).filter(x=>x[1].length);
  return `<div class="lines" id="lines">${ro()?'':`<div class="ln-h" aria-hidden="true"><span>البند</span><span class="q">الكمية</span><span class="r">السعر</span><span class="t">الإجمالي (ج.م)</span></div>`}`
   +by.map(([b,ls])=>`<section class="sec ${ro()?'':'tgt'}" data-bab="${b.id}"><div class="sec-h"><b>${b.n}</b><span class="sub" id="s-${b.id}">${subH(b.id)}</span></div>${ls.map(row).join('')}<div class="slot">${i('plus')}</div></section>`).join('')+`</div>`}
function totH(){const t=totalV(),p=pendN();
  return `<div class="tot2" id="tot2"><div class="tot2-in"><div class="k"><span>${S.view==='frozen'?'قيمة التعاقد':'الإجمالي'}</span><b>${t==null?'—':`<bdi dir="ltr">${fm(t)}</bdi>`}<small>ج.م</small></b></div><div class="k n"><span>البنود</span><b>${S.lines.length}</b></div>${p&&!ro()?`<span class="atag">${mi('info')}بلا كمية: ${p}</span>`:''}</div></div>`}

/* catalogue pane + phone sheet share one filter */
function matches(){const q=S.q.trim();return BABS.map(b=>[b,Object.values(CAT).filter(c=>c.b===b.id&&(!q||c.n.includes(q)))]).filter(x=>x[1].length)}
function ciRow(c,mode){
  const sub=`<small><span>${c.u}</span><bdi dir="ltr">${fm(c.r)}</bdi></small>`,bad=S.rowErr[c.id];
  if(added(c.id))return `<div class="ci ${mode==='sheet'?'sci':''}"><div class="added">${mi('check')}<div class="tx"><b>${c.n}</b>${sub}</div></div></div>`;
  const tk=`<label class="ck"><input type="checkbox" data-tk="${c.id}" ${S.ticks.has(c.id)?'checked':''} aria-label="تحديد ${c.n}"><span class="bx"><svg class="ck-c" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="tx"><b>${c.n}</b>${sub}</span></label>`;
  if(mode==='sheet')return `<div class="ci sci ${bad?'bad':''}">${tk}${bad?`<div class="msg">${mi('err')}البند مؤرشف</div>`:''}</div>`;
  return `<div class="ci ${bad?'bad':''}" draggable="true" data-id="${c.id}">${i('grip','grip')}${tk}<button type="button" class="ib" data-add="${c.id}" aria-label="إضافة ${c.n}">${i('plus')}</button>${bad?`<div class="msg">${mi('err')}تعذّرت الإضافة: البند مؤرشف</div>`:''}</div>`}
function groupsH(mode){const m=matches();if(!m.length)return '<div class="pane-none">لا نتائج</div>';
  return m.map(([b,it])=>{const op=S.q.trim()?true:!!S.open[b.id];
   return `<div class="pg"><button type="button" class="gbtn" data-gb="${b.id}" aria-expanded="${op}">${i('chev','s chev')}<span class="gn">${b.n}</span><span class="gc">${it.length}</span></button>${op?it.map(c=>ciRow(c,mode)).join(''):''}</div>`}).join('')}
const addBtn=(sec)=>{const n=S.ticks.size;return `<button type="button" class="btn ${sec?'sec2':''}" data-act="addticks" ${n?'':'disabled'}>${i('plus','s')}${n?`أضف (${n})`:'أضف'}</button>`};
const pbanH=()=>S.pb?`<div class="ban" role="alert">${mi('err')}<span>أُضيف ${S.pb.done} من ${S.pb.total}. ما تبقّى بقي محدّداً.</span></div>`:'';
function paneH(){return `<aside class="pane d-only" id="pane" aria-label="الكتالوج"><div class="pane-h"><div class="hrow"><h2>الكتالوج</h2><button type="button" class="btn sec2 sm" data-act="custom">${i('plus','s')}بند مخصص</button></div><div class="search">${i('search')}<input type="search" id="psq" value="${S.q}" placeholder="اسم البند" aria-label="بحث"></div></div><div class="pane-b" id="pb">${groupsH('pane')}</div>${S.ticks.size||S.pb?`<div class="pane-f" id="pf">${pbanH()}${addBtn(true)}</div>`:''}</aside>`}
const paneSk=()=>`<aside class="pane d-only" aria-busy="true"><div class="pane-h"><h2>الكتالوج</h2></div><div class="pane-b">${[1,2,3,4,5,6].map(()=>`<div class="skr">${sk('55%')}${sk('25%')}</div>`).join('')}</div></aside>`;

/* header */
function primary(){if(isBuild()||S.view==='sign')return {ar:'توقيع المقايسة',ic:'check',act:'sign',off:pendN()>0};return null}
const pbtn=(p,cls)=>p?`<button type="button" class="btn ${cls||''}" data-act="${p.act}" ${p.off?'disabled':''}>${i(p.ic,'s')}${p.ar}</button>`:'';
function header(){const v=S.view;
  const list=(isBuild()||v==='blank'||v==='empty'||v==='base');
  let meta='';
  if(v==='frozen')meta=`<span class="bdg">${mi('lock')}مجمّدة في 10 نوفمبر 2026</span>`;
  else if(v==='archived')meta=`<span class="atag">${mi('archive')}مؤرشف</span>`;
  else if(list)meta=`<span class="bdg">${mi('clock')}تنتهي المتابعة 10 ديسمبر 2026</span>`;
  const canPrint=(isBuild()||ro())&&S.lines.length>0;
  const acts=(canPrint?`<button type="button" class="btn sec2 sm">${i('print','s')}طباعة عرض السعر</button>`:'')+`<span class="d-only" style="display:contents" id="pri">${pbtn(primary())}</span>`;
  return `<div class="phl"><a class="back" href="#">${i('left','s')}${v==='design'?'المشاريع':PROJECT}</a><div class="ttl"><h1>المقايسة</h1></div>${meta?`<div class="meta">${meta}</div>`:''}</div><div class="acts" id="acts">${v==='design'||v==='loading'||v==='failed'?'':acts}</div>`}
function abar(){return `<button type="button" class="menu" id="menu">${i('menu')}القائمة</button><span id="abtn" style="display:contents">${pbtn(primary())}</span>`}

function body(){const v=S.view;
  if(v==='design')return `<div class="state refused"><div class="ico">${i('lock')}</div><h4>لا توجد مقايسة لهذا النوع من التعاقد.</h4><a class="lnk" href="#">العودة إلى المشروع</a></div>`;
  if(v==='failed')return `<div class="ban rowc" role="alert">${mi('err')}<span><b>تعذّر تحميل المقايسة.</b> لم يتغير شيء.</span><button type="button" class="btn sec2 sm act" data-retry="1">${mi('redo','s')}إعادة المحاولة</button></div>`;
  if(v==='loading')return `<div class="boq" aria-busy="true" role="status"><span class="vh">جارٍ التحميل</span><div class="lw"><div class="tot2"><div class="tot2-in">${sk('40%')}</div></div><div class="lines">${[1,2,3,4,5,6].map(()=>`<div class="skr">${sk('45%')}${sk('30%')}</div>`).join('')}</div></div>${paneSk()}</div>`;
  const edit=!ro(),first=(v==='empty'||v==='base')&&!S.started&&!S.lines.length,pane=edit&&!first?paneH():'';
  let main;
  if(first)main=`<div class="state drop" id="drop"><div class="ico">${i('doc')}</div><h4>لا بنود بعد</h4><div class="choose"><button type="button" class="btn" data-act="frombase">${i('copy','s')}ابدأ من مشروع سابق</button><button type="button" class="btn sec2" data-act="blank">${i('plus','s')}مقايسة فارغة</button></div></div>`;
  else if(!S.lines.length)main=`<div class="state drop" id="drop"><div class="ico">${i('plus')}</div><h4 class="d-only">اسحب بنداً من الكتالوج</h4><div class="tools2" style="margin:6px 0 0"><button type="button" class="btn" data-act="opensheet">${i('plus','s')}إضافة بنود</button></div></div>`;
  else main=totH()+(edit?`<div class="tools2"><button type="button" class="btn sec2" data-act="opensheet">${i('plus','s')}إضافة بنود</button></div>`:'')
    +(v==='archived'?`<div class="ban note" role="status" style="margin-block-end:10px">${mi('archive')}<span>انتهت فترة المتابعة دون توقيع. <a class="lnk" href="#">فتح المشروع</a></span></div>`:'')+linesH();
  return `<div class="boq ${pane?'':'solo'}"><div class="lw" id="lw">${main}</div>${pane}</div>`}

/* ============ sheets ============ */
function baseList(){const q=S.bq.trim(),ok=b=>!q||b.n.includes(q);let o='',any=false;
  for(const [p,h] of [[1,'مقايسات جاهزة'],[0,'مشاريع سابقة']]){const r=BASES.filter(b=>!!b.p===!!p&&ok(b));if(!r.length)continue;any=true;
   o+=`<div class="res-g">${h}</div>`+r.map(b=>`<div class="res"><div><b>${b.n}</b></div><button type="button" class="btn sec2 sm" data-usebase="${BASES.indexOf(b)}">استخدام</button><div class="mt"><span>${b.c} بنود</span>${b.d?`<span>${b.d}</span>`:''}</div></div>`).join('')}
  return any?o:'<div class="res-none">لا نتائج</div>'}
function sxHtml(k){
  if(k==='base')return `<div class="grab"></div><div class="hd"><h2>مشروع سابق</h2><button type="button" class="ib" data-act="closesx" aria-label="إغلاق">${i('x')}</button></div><div class="bd"><div class="search">${i('search')}<input type="search" id="bq" value="${S.bq}" placeholder="اسم المشروع" aria-label="بحث"></div><div class="res-l" id="bl">${baseList()}</div></div>`;
  if(k==='sign'){const pf=(id,lab,v)=>{const m=S.serr?(v===''?'مطلوب':(isNaN(+v)||+v<0||+v>100?'من 0 إلى 100':'')):'';return `<div class="field"><label for="${id}">${lab}</label><div class="ctl money ${m?'err':''}"><input id="${id}" inputmode="decimal" dir="ltr" value="${v}" ${m?'aria-invalid="true"':''}><span class="aff">%</span></div>${m?`<div class="fmsg">${mi('err')}${m}</div>`:''}</div>`};
    return `<div class="grab"></div><div class="hd"><h2>توقيع المقايسة</h2><button type="button" class="ib" data-act="closesx" aria-label="إغلاق">${i('x')}</button></div><div class="bd"><div class="field"><label>ستصبح قيمة التعاقد</label><div class="ctl money ro"><span class="val"><bdi dir="ltr">${fm(totalV()||0)}</bdi></span><span class="aff">ج.م</span></div></div><div class="two">${pf('hold','نسبة المحجوز',S.hold)}${pf('adv','نسبة الدفعة المقدمة',S.adv)}</div><p class="lead">التوقيع يثبّت قيمة التعاقد على إجمالي المقايسة، وتُجمَّد البنود بعده فلا تُضاف ولا تُعدَّل ولا تُحذف.</p></div><div class="ft"><button type="button" class="btn" data-act="confirmsign">${i('check','s')}توقيع المقايسة</button><button type="button" class="btn sec2" data-act="closesx">إلغاء</button></div>`}
  if(k==='custom'){const f=S.cf,e=S.cerr,fl=(id,lab,inner,bad)=>`<div class="field"><label for="${id}">${lab}</label><div class="ctl ${id==='cr'?'money':''} ${e&&bad?'err':''}">${inner}</div>${e&&bad?`<div class="fmsg">${mi('err')}مطلوب</div>`:''}</div>`;
    return `<div class="grab"></div><div class="hd"><h2>بند مخصص</h2><button type="button" class="ib" data-act="closesx" aria-label="إغلاق">${i('x')}</button></div><div class="bd">${fl('cn','اسم البند',`<input id="cn" type="text" value="${f.n}">`,!f.n.trim())}<div class="two">${fl('cu','الوحدة',`<input id="cu" type="text" value="${f.u}">`,!f.u.trim())}${fl('cr','السعر',`<input id="cr" inputmode="decimal" dir="ltr" value="${f.r}"><span class="aff">ج.م</span>`,!(+f.r>0))}</div>${fl('cb','الباب',`<select id="cb"><option value=""></option>${BABS.map(x=>`<option value="${x.id}" ${f.b===x.id?'selected':''}>${x.n}</option>`).join('')}</select>`,!f.b)}</div><div class="ft"><button type="button" class="btn" data-act="confirmcustom">${i('plus','s')}أضف للمقايسة</button><button type="button" class="btn sec2" data-act="closesx">إلغاء</button></div>`}
  return `<div class="grab"></div><div class="hd"><h2>إضافة بنود</h2><button type="button" class="ib" data-act="closesx" aria-label="إغلاق">${i('x')}</button></div><div class="bd flush"><div class="sbar"><div class="search">${i('search')}<input type="search" id="psq" value="${S.q}" placeholder="اسم البند" aria-label="بحث"></div><button type="button" class="btn sec2 sm" data-act="custom">${i('plus','s')}بند مخصص</button></div><div id="pb">${groupsH('sheet')}</div></div><div class="ft" id="pf">${pbanH()}${addBtn(false)}</div>`}
function openSx(k){S.sx=k;document.body.dataset.sx=k?'1':'0';const e=$('#sx');e.className='sx'+(k==='add'?' full':'');e.setAttribute('aria-label',{base:'مشروع سابق',sign:'توقيع المقايسة',custom:'بند مخصص',add:'إضافة بنود'}[k]||'');if(k)e.innerHTML=sxHtml(k);bind()}

/* ============ actions ============ */
function addMany(ids,quiet){let done=0,k=0,last=null;S.pb=null;
  for(;k<ids.length;k++){const id=ids[k];if(CAT[id].fail){S.rowErr[id]=true;break}S.lines.push({id,qty:null});S.ticks.delete(id);delete S.rowErr[id];done++;last=id}
  if(k<ids.length&&ids.length>1)S.pb={done,total:ids.length};
  if(done&&['empty','blank','base'].includes(S.view))S.view='building';
  if(quiet)return;
  const ok=k===ids.length;
  if(ok&&S.sx==='add')openSx(null);
  draw(true);
  if(last){const inp=document.querySelector(`[data-q="${last}"]`);if(inp){inp.scrollIntoView({block:'nearest'});inp.focus()}}}
function upd(id){const l=S.lines.find(x=>x.id===id),t=lineTot(l);
  $('#t-'+id).innerHTML=t==null?'<span class="none">—</span>':`<bdi dir="ltr">${fm(t)}</bdi>`;
  document.querySelector(`[data-ln="${id}"]`).classList.toggle('pend',!(l.qty>0));
  document.querySelector(`[data-ln="${id}"] .tags`).innerHTML=tags(l);
  $('#s-'+CAT[id].b).innerHTML=subH(CAT[id].b);$('#tot2').outerHTML=totH();
  const p=primary();$('#pri').innerHTML=pbtn(p);$('#abtn').innerHTML=pbtn(p);bind()}
function bind(){
  document.querySelectorAll('[data-act]').forEach(b=>{const a=b.dataset.act;
    if(a==='sign')b.onclick=()=>openSx('sign');
    if(a==='closesx')b.onclick=()=>openSx(null);
    if(a==='confirmsign')b.onclick=()=>{const h=$('#hold').value.trim(),d=$('#adv').value.trim();S.hold=h;S.adv=d;const bad=v=>v===''||isNaN(+v)||+v<0||+v>100;
      if(bad(h)||bad(d)){S.serr=true;openSx('sign');return}S.sx=null;document.body.dataset.sx='0';S.view='frozen';draw(true)};
    if(a==='custom')b.onclick=()=>{S.cerr=false;openSx('custom')};
    if(a==='confirmcustom')b.onclick=()=>{const f=S.cf;if(!f.n.trim()||!f.u.trim()||!(+f.r>0)||!f.b){S.cerr=true;openSx('custom');return}
      const id='c'+(++CN);CAT[id]={id,b:f.b,n:f.n.trim(),u:f.u.trim(),r:+f.r,custom:1};S.lines.push({id,qty:null});S.cf={n:'',u:'',r:'',b:''};S.cerr=false;
      if(['empty','blank','base'].includes(S.view))S.view='building';S.sx=null;document.body.dataset.sx='0';draw(true);const inp=document.querySelector(`[data-q="${id}"]`);if(inp){inp.scrollIntoView({block:'nearest'});inp.focus()}};
    if(a==='frombase')b.onclick=()=>openSx('base');
    if(a==='blank')b.onclick=()=>{S.started=true;S.view='blank';draw(true)};
    if(a==='opensheet')b.onclick=()=>openSx('add');
    if(a==='addticks')b.onclick=()=>addMany([...S.ticks])});
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addMany([b.dataset.add]));
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.lines=S.lines.filter(l=>l.id!==b.dataset.rm);draw(true)});
  document.querySelectorAll('[data-tk]').forEach(b=>b.onchange=()=>{b.checked?S.ticks.add(b.dataset.tk):S.ticks.delete(b.dataset.tk);S.pb=null;refreshPick()});
  document.querySelectorAll('[data-gb]').forEach(b=>b.onclick=()=>{S.open[b.dataset.gb]=!S.open[b.dataset.gb];refreshPick(true)});
  document.querySelectorAll('[data-q]').forEach(inp=>inp.oninput=()=>{const l=S.lines.find(x=>x.id===inp.dataset.q),v=parseFloat(inp.value.replace(/[^\d.]/g,''));l.qty=isNaN(v)?null:v;upd(l.id)});
  document.querySelectorAll('[data-usebase]').forEach(b=>b.onclick=()=>{S.lines=BASES[+b.dataset.usebase].l.map(a=>({id:a[0],qty:a[1],s:0}));S.view='building';openSx(null);draw(true)});
  document.querySelectorAll('#psq').forEach(e=>e.oninput=()=>{S.q=e.value;refreshPick(true)});
  const fv=(id,k)=>{const e=$('#'+id);if(e)e.oninput=e.onchange=()=>{S.cf[k]=e.value}};fv('cn','n');fv('cu','u');fv('cr','r');fv('cb','b');
  ['hold','adv'].forEach(k=>{const e=$('#'+k);if(e)e.oninput=()=>{S[k]=e.value}});
  const bq=$('#bq');if(bq)bq.oninput=()=>{S.bq=bq.value;$('#bl').innerHTML=baseList();bind()};
  document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{S.view='loading';draw()})}
function refreshPick(){const m=S.sx==='add'?'sheet':'pane';const pb=$('#pb');if(pb)pb.innerHTML=groupsH(m);
  const pf=$('#pf'),h=S.ticks.size||S.pb?pbanH()+addBtn(m==='pane'):'';
  if(m==='sheet'&&pf)pf.innerHTML=pbanH()+addBtn(false);
  else if(m==='pane'){if(pf)pf.innerHTML=h;if(h&&!pf)$('#pane').insertAdjacentHTML('beforeend',`<div class="pane-f" id="pf">${h}</div>`);if(!h&&pf)pf.remove()}
  bind()}

/* drag from the catalogue into the lines (desktop) */
let ghost=null;
function endDrag(){document.body.classList.remove('dragging');document.querySelectorAll('.hot').forEach(e=>e.classList.remove('hot'));document.querySelectorAll('.over').forEach(e=>e.classList.remove('over'));if(ghost){ghost.remove();ghost=null}document.querySelectorAll('.ci.dragging').forEach(e=>e.classList.remove('dragging'))}
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.ci[data-id]');if(!c)return;S.drag=c.dataset.id;e.dataTransfer.setData('text/plain',S.drag);e.dataTransfer.effectAllowed='copy';
  requestAnimationFrame(()=>{c.classList.add('dragging');document.body.classList.add('dragging');
    const bid=CAT[S.drag].b,lines=$('#lines');
    if(lines&&!lines.querySelector(`[data-bab="${bid}"]`)){const b=BABS.find(x=>x.id===bid);ghost=document.createElement('section');ghost.className='sec tgt ghost';ghost.dataset.bab=bid;ghost.innerHTML=`<div class="sec-h"><b>${b.n}</b></div><div class="slot">${i('plus')}</div>`;lines.appendChild(ghost)}})});
document.addEventListener('dragend',endDrag);
document.addEventListener('dragover',e=>{const w=e.target.closest&&e.target.closest('#lw');if(!w||!S.drag)return;e.preventDefault();e.dataTransfer.dropEffect='copy';
  const L=$('#lines')||$('#drop');if(L)L.classList.add('over');const s=$(`#lines [data-bab="${CAT[S.drag].b}"]`);if(s)s.classList.add('hot')});
document.addEventListener('dragleave',e=>{const w=$('#lw');if(w&&!w.contains(e.relatedTarget)){document.querySelectorAll('.over,.hot').forEach(x=>x.classList.remove('over','hot'))}});
document.addEventListener('drop',e=>{const w=e.target.closest&&e.target.closest('#lw');if(!w||!S.drag)return;e.preventDefault();const id=S.drag;S.drag=null;endDrag();addMany([id])});

function draw(keep){
  if(!keep)setup();
  const hadSearch=document.activeElement&&document.activeElement.id==='psq';
  $('#ph').innerHTML=header();$('#frame').innerHTML=body();$('#abar').innerHTML=abar();
  $('#menu').onclick=()=>{$('#app').dataset.sheet='1'};
  document.querySelectorAll('.strip [data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
  history.replaceState(null,'','?view='+S.view+(EMBED?'&embed=1':''));
  if(S.sx&&!keep){openSx(S.sx)}else if(S.sx==='add'){openSx('add')}
  bind();
  if(hadSearch){const e=$('#psq');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
}
const u=USER;['1','2'].forEach(k=>{$('#un'+k).textContent=u.n;$('#ur'+k).textContent=u.r;$('#av'+k).textContent=[...u.n][0]});
$('#nav').innerHTML=navHtml();$('#nav2').innerHTML=navHtml();
$('#closeN').onclick=()=>{$('#app').dataset.sheet='0'};$('#scrim').onclick=()=>{$('#app').dataset.sheet='0'};
$('#sxs').onclick=()=>openSx(null);
const tgl=()=>{const d=H.dataset.theme?H.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;H.dataset.theme=d?'light':'dark'};
$('#themebtn').onclick=$('#theme1').onclick=$('#theme2').onclick=tgl;
$('#dirbtn').onclick=()=>{const l=H.dir==='rtl';H.dir=l?'ltr':'rtl';H.lang=l?'en':'ar'};
document.querySelectorAll('.strip [data-view]').forEach(b=>b.onclick=()=>{openSx(null);S.view=b.dataset.view;draw()});
const rail=()=>{$('#app').dataset.rail=(matchMedia('(max-width:1100px)').matches&&innerWidth>820)?'1':'0'};rail();addEventListener('resize',rail);
if(EMBED){document.body.classList.add('embed');$('#strip').remove()}
draw();
</script>
