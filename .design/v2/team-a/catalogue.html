<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>كف - كتالوج الأسعار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* KAAF catalogue list. Composed from the kit (components.html) inside the approved shell (layout.html).
   Parts new to the kit are documented in README.md. Prices are stored figures (costPrice, baseSellRate); nothing on this screen is calculated. */
:root{
  --g900:#09221e; --g300:#9fb3ad; --c100:#f4eee9; --c200:#e6d9d1; --radius:6px;
  --bg:var(--c100); --surface:#fbf8f5; --head:#ebe0d8; --ink:var(--g900); --dim:#4b5f59; --line:rgba(9,34,30,.16); --hover:rgba(9,34,30,.055);
  --btn:var(--g900); --btn-h:#25544b;  --btn-ink:var(--c200); --field:#fbf8f5; --fieldline:var(--g900); --focus:var(--g900);
  --note-bg:#ebe0d8; --ok-bg:#d3e3db; --ok-ink:#0b3b32;  
  --scrim:rgba(3,13,11,.55); --strip:var(--c200); --shadow:0 12px 36px rgba(9,34,30,.22);
  --display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --side:256px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#061815; --surface:#0a1f1b; --head:#0f2e29; --ink:var(--c200); --dim:var(--g300); --line:rgba(230,217,209,.18); --hover:rgba(230,217,209,.06);
  --btn:var(--c200); --btn-h:#fbf6f2;  --btn-ink:var(--g900); --field:#0f2e29; --fieldline:#7f9a92; --focus:var(--c200);
  --note-bg:#0f2e29; --ok-bg:#17403a; --ok-ink:#e6d9d1;  --strip:#030d0b; --shadow:0 12px 36px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --bg:#061815; --surface:#0a1f1b; --head:#0f2e29; --ink:var(--c200); --dim:var(--g300); --line:rgba(230,217,209,.18); --hover:rgba(230,217,209,.06);
  --btn:var(--c200); --btn-h:#fbf6f2;  --btn-ink:var(--g900); --field:#0f2e29; --fieldline:#7f9a92; --focus:var(--c200);
  --note-bg:#0f2e29; --ok-bg:#17403a; --ok-ink:#e6d9d1;  --strip:#030d0b; --shadow:0 12px 36px rgba(0,0,0,.6);}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{inline-size:22px;block-size:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{inline-size:18px;block-size:18px}
.vh{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible,.is-focus{outline:3px solid var(--focus);outline-offset:3px}
.money{font-variant-numeric:tabular-nums;font-weight:500;direction:ltr;unicode-bidi:isolate}
bdi{unicode-bidi:isolate}

/* preview strip (not part of the design) */
.strip{background:var(--strip);font-size:.8125rem;position:relative;z-index:80}
.strip summary{list-style:none;display:flex;align-items:center;gap:.5rem;min-block-size:36px;padding:0 1rem;cursor:pointer}
.strip summary::-webkit-details-marker{display:none}
.strip .panelx{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;padding:.25rem 1rem .75rem}
.strip .grp{display:flex;flex-wrap:wrap;gap:.25rem}
.strip button{min-block-size:36px;padding:0 .7rem;border:1px solid currentColor;background:transparent;border-radius:var(--radius);color:inherit}
.strip button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* ===== app + shell (from layout.html) ===== */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);block-size:calc(100dvh - 36px);overflow:hidden}
.app[data-rail="1"]{--side:76px}
.side{background:var(--g900);color:var(--c200);display:flex;flex-direction:column;min-inline-size:0;min-block-size:0}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding-inline:20px 12px;block-size:72px;flex:none}
.side-top img{display:block;inline-size:104px;block-size:auto;aspect-ratio:519/155}
.coll{inline-size:44px;block-size:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--c200);border-radius:var(--radius)}
.coll:hover{background:rgba(230,217,209,.1)}
[dir="rtl"] .coll .chev,[dir="ltr"] .app[data-rail="1"] .coll .chev{transform:scaleX(-1)}
[dir="rtl"] .app[data-rail="1"] .coll .chev{transform:none}
.nav{flex:1;overflow-y:auto;padding:8px 12px 16px;min-block-size:0}
.grp-h{margin:18px 0 6px;padding-inline:12px;font:600 .8125rem/1.4 var(--display);color:var(--g300)}
.nav .grp:first-child .grp-h{margin-block-start:6px}
.nav .grp+.grp{margin-block-start:10px;border-block-start:1px solid rgba(230,217,209,.14)}
.row{position:relative;display:flex;align-items:center;gap:14px;min-block-size:44px;padding:0 12px;border-radius:var(--radius);color:var(--c200);text-decoration:none;font:500 .96875rem/1.3 var(--body)}
.row:hover{background:rgba(230,217,209,.09)}
.row:focus-visible{outline:3px solid var(--c200);outline-offset:-3px}
.row[aria-current="page"]{background:rgba(230,217,209,.15);font-weight:600}
.row[aria-current="page"]::before{content:"";position:absolute;inset-block:8px;inset-inline-start:-12px;inline-size:5px;border-start-end-radius:3px;border-end-end-radius:3px;background:var(--c200)}
.side-foot{flex:none;padding:12px;border-block-start:1px solid rgba(230,217,209,.14)}
.who{display:flex;align-items:center;gap:12px;padding:6px 6px 12px}
.av{inline-size:40px;block-size:40px;border-radius:50%;background:var(--c200);color:var(--g900);display:grid;place-items:center;font:700 1rem/1 var(--display);flex:none}
.who b{display:block;font:600 .96875rem/1.3 var(--body)}
.who span{display:block;font-size:.8125rem;color:var(--g300)}
.ctl2{display:flex;gap:8px}
.ctl2 button{flex:1;min-block-size:44px;border:1.5px solid rgba(230,217,209,.55);background:transparent;color:var(--c200);border-radius:var(--radius);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.ctl2 button:hover{background:rgba(230,217,209,.1)}
.i-short{display:none}
.app[data-rail="1"] .i-short{display:inline;font-weight:700}
.app[data-rail="1"] .lbl,.app[data-rail="1"] .grp-h,.app[data-rail="1"] .who>div,.app[data-rail="1"] .side-top img,.app[data-rail="1"] .ctl2 .t{display:none}
.app[data-rail="1"] .side-top{justify-content:center;padding:0}
.app[data-rail="1"] .row{justify-content:center;padding:0}
.app[data-rail="1"] .who{justify-content:center;padding-inline:0}
.app[data-rail="1"] .ctl2{flex-direction:column}
.main{min-inline-size:0;min-block-size:0;display:flex;flex-direction:column;overflow-y:auto;position:relative}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:28px 32px 16px;flex-wrap:wrap}
.ph h1{font:700 2rem/1.3 var(--display);margin:0}
.ph .meta{margin:2px 0 0;color:var(--dim);font-size:.9375rem}
.acts{display:flex;align-items:center;gap:12px}
.frame{padding:0 32px 40px;flex:1;min-inline-size:0}

/* ===== kit parts ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-block-size:48px;padding:0 22px;border:2px solid transparent;border-radius:var(--radius);background:var(--btn);color:var(--btn-ink);font:700 1rem/1 var(--display);white-space:nowrap;text-decoration:none}
.btn.sm{min-block-size:44px;padding:0 16px;font-size:.9375rem}
.btn:hover{background:var(--btn-h)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sec2{background:transparent;color:var(--ink);border-color:var(--fieldline)}
.btn.sec2:hover{background:var(--hover)}
.btn.quiet{background:transparent;color:var(--ink)}
.btn.quiet:hover{background:var(--hover)}
.btn.is-busy{cursor:progress;opacity:.9}
.spin{display:none;inline-size:18px;block-size:18px;border:3px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor;border-radius:50%;animation:r .8s linear infinite}
.is-busy .spin{display:block}
@keyframes r{to{transform:rotate(360deg)}}
.ib{inline-size:44px;block-size:44px;display:inline-grid;place-items:center;border:2px solid transparent;background:transparent;color:var(--ink);border-radius:var(--radius);padding:0}
.ib:hover{background:var(--hover)}
.ib.bd{border-color:var(--fieldline)}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-inline-size:24px;block-size:24px;padding:0 8px;border-radius:var(--radius);border:1.5px solid var(--fieldline);font:600 .8125rem/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge svg{inline-size:14px;block-size:14px}
.badge.q{border-color:var(--line);color:var(--dim)}
.seg{display:inline-flex;border:2px solid var(--fieldline);border-radius:var(--radius);overflow:hidden;background:var(--field)}
.seg button{min-block-size:44px;padding:0 18px;border:0;background:transparent;font:600 .9375rem/1 var(--body);display:inline-flex;align-items:center;gap:8px}
.seg button+button{border-inline-start:2px solid var(--fieldline)}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.seg button:focus-visible{outline:3px solid var(--focus);outline-offset:-5px}
.search{position:relative;inline-size:300px;max-inline-size:100%}
.search>svg{position:absolute;inset-inline-start:14px;inset-block-start:50%;transform:translateY(-50%);color:var(--dim);inline-size:20px;block-size:20px;pointer-events:none}
.search input{inline-size:100%;block-size:48px;padding-inline:44px 48px;border:2px solid var(--fieldline);border-radius:var(--radius);background:var(--field);font-size:1rem;outline:none}
.search input::placeholder{color:var(--dim);opacity:1}
.search input:focus{outline:3px solid var(--focus);outline-offset:3px}
.search .x{position:absolute;inset-inline-end:2px;inset-block-start:2px}
.count{color:var(--dim);font-size:.9375rem;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lnk{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;font-weight:500;background:none;border:0;padding:0}
.mtools{padding:0 16px;display:grid;gap:10px;margin-block-end:8px}
.seg.full{display:flex}.seg.full button{flex:1;justify-content:center;min-block-size:52px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mrow .btn{min-block-size:52px;padding:0 12px;font-size:.9375rem}
.mrow .sel select{inline-size:100%;min-inline-size:0;block-size:52px}
.tools{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-block-end:10px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;block-size:48px;min-inline-size:200px;padding-inline:14px 40px;border:2px solid var(--fieldline);border-radius:var(--radius);background:var(--field);font-size:1rem;font-weight:500}
.sel svg{position:absolute;inset-inline-end:12px;inset-block-start:50%;transform:translateY(-50%);pointer-events:none;color:var(--dim)}

/* table */
.tw{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow-x:auto;position:relative}
.tbl{inline-size:100%;border-collapse:separate;border-spacing:0;font-size:.9375rem;min-inline-size:1060px}
.tbl th{background:var(--head);text-align:start;font:600 .8125rem/1.3 var(--body);color:var(--dim);padding:0 16px;block-size:44px;white-space:nowrap;position:sticky;inset-block-start:0;z-index:4}
.tbl td{padding:0 16px;block-size:48px;border-block-start:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl tbody tr.it:hover td{background:color-mix(in srgb,var(--ink) 5.5%,var(--surface))}
.tbl th.n,.tbl td.n{text-align:end}
.tbl .id{position:sticky;inset-inline-start:0;z-index:2;min-inline-size:300px;max-inline-size:380px;box-shadow:inset -1px 0 0 var(--line)}
[dir="ltr"] .tbl .id{box-shadow:inset 1px 0 0 var(--line)}
.tbl th.id{z-index:5}
.idc{display:flex;align-items:baseline;gap:10px;min-inline-size:0}
.idc .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.idc .cd{color:var(--dim);font-size:.8125rem;font-variant-numeric:tabular-nums;flex:none}
.tbl td.en{color:var(--dim);direction:ltr;text-align:start;max-inline-size:260px;overflow:hidden;text-overflow:ellipsis}
.tbl td.un{color:var(--dim)}
/* KIT+ cost column: internal, tinted so it reads as a different kind of number */
.tbl th.cost,.tbl td.cost{background:color-mix(in srgb,var(--ink) 3.5%,var(--surface))}
.tbl th.cost{background:color-mix(in srgb,var(--ink) 6%,var(--head))}
.tbl tbody tr.it:hover td.cost{background:color-mix(in srgb,var(--ink) 8%,var(--surface))}
.int{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.int svg{inline-size:15px;block-size:15px}
/* KIT+ collapsible group row (sticky) */
.tbl tr.grp td{background:var(--head);block-size:52px;border-block-start:1px solid var(--line);padding:0;position:sticky;inset-block-start:44px;z-index:3}
.gbtn{display:flex;align-items:center;gap:12px;inline-size:100%;block-size:52px;padding:0 16px;border:0;background:transparent;text-align:start;position:sticky;inset-inline-start:0;min-inline-size:min(100%,780px)}
.gbtn:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.gbtn .gn{font:600 1rem/1 var(--display);flex:1}
.gc{color:var(--dim);font-size:.875rem;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.gbtn .chev{transition:none}
[dir="rtl"] .gbtn .chev{transform:scaleX(-1) rotate(90deg)}
.gbtn .chev{transform:rotate(-90deg)}
[dir="rtl"] .gbtn .chev{transform:rotate(90deg)}
.gbtn[aria-expanded="true"] .chev{transform:rotate(0)}
.tbl tr.grp.col td{position:static}
/* KIT+ price origin */
.sellv{font-weight:500}
/* archived rows */
.tbl tr.arch td{color:var(--dim)}
.tbl tr.arch .nm{font-weight:500;text-decoration:none}
.atag{display:inline-flex;align-items:center;gap:5px;block-size:22px;padding:0 7px;border-radius:var(--radius);border:1.5px dashed var(--fieldline);font:600 .75rem/1 var(--body);color:var(--ink);flex:none}
.atag svg{inline-size:13px;block-size:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* KIT+ load-more row inside a group */
.tbl tr.more td{block-size:48px;background:var(--surface)}
.more .btn{inline-size:100%;justify-content:flex-start;position:sticky;inset-inline-start:0;min-inline-size:min(100%,640px)}
.more .btn{font:600 .9375rem/1 var(--body)}
/* below 1100px the English description column drops out (it is in the detail panel) so cost and sell stay on screen; the identity column stays pinned */
@media (max-width:1100px){.tbl{min-inline-size:820px}.tbl .en,.tbl th.en{display:none}.tbl .id{min-inline-size:260px}.tbl th,.tbl td{padding-inline:12px}}
.tbl td.act{inline-size:64px;padding-inline:8px;text-align:end}
/* inline confirmation (kit) */
.tbl tr.conf td{background:var(--note-bg);block-size:64px;border-block-start:1px solid var(--fieldline);padding:0 16px}
.confrow{display:flex;align-items:center;gap:12px;color:var(--ink);font-weight:500;white-space:normal;position:sticky;inset-inline-start:0;min-inline-size:min(100%,800px)}
.confrow .ico{flex:none;display:grid;place-items:center}
.confrow .msg{flex:1;min-inline-size:0;line-height:1.4}
.confrow .msg b{font-weight:700}
.confrow .msg small{display:block;font-weight:400;opacity:.9}
.tbl tr.done td{background:var(--ok-bg);color:var(--ok-ink);block-size:48px;padding:0 16px}
/* menu */
.pop{background:var(--surface);border:1.5px solid var(--fieldline);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px;min-inline-size:200px}
.opt{display:flex;align-items:center;gap:12px;min-block-size:44px;padding:0 12px;border-radius:var(--radius);font-size:1rem;color:var(--ink);background:none;border:0;inline-size:100%;text-align:start}
.opt:hover{background:var(--hover)}
.sepr{block-size:1px;background:var(--line);margin:6px 4px}
.menuwrap .pop{position:fixed;z-index:90;inline-size:240px;display:none}
.menuwrap.open .pop{display:block}
/* states */
.state{border:1.5px solid var(--line);border-radius:var(--radius);background:transparent;padding:44px 24px;text-align:center;display:grid;justify-items:center;gap:10px}
.state .ico{inline-size:56px;block-size:56px;border-radius:var(--radius);display:grid;place-items:center;background:var(--head)}
.state .ico svg{inline-size:28px;block-size:28px}
.state h4{font:700 1.125rem/1.4 var(--display);margin:4px 0 0}
.state p{margin:0;color:var(--dim);max-inline-size:44ch;font-size:.9375rem}
.sk{display:inline-block;block-size:14px;border-radius:4px;background:linear-gradient(90deg,var(--line),var(--hover),var(--line));background-size:200% 100%;animation:sh 1.4s linear infinite;vertical-align:middle}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}}

/* fields (kit) */
.field{display:grid;gap:6px;min-inline-size:0}
.field>label{display:flex;gap:8px;align-items:center;font:600 1rem/1.4 var(--body)}
.req{font-weight:700}
.ctl{display:flex;align-items:stretch;min-inline-size:0;block-size:48px;border:2px solid var(--fieldline);border-radius:var(--radius);background:var(--field)}
.ctl input,.ctl .val{flex:1;min-inline-size:0;border:0;background:transparent;padding:0 14px;font-size:1.0625rem;outline:none;block-size:100%;display:flex;align-items:center}
.ctl:focus-within,.ctl.is-focus{outline:3px solid var(--focus);outline-offset:3px}
.ctl .aff{display:flex;align-items:center;padding:0 14px;border-inline-start:2px solid var(--line);color:var(--dim);font-weight:600;white-space:nowrap}
.ctl .tail{display:grid;place-items:center;inline-size:44px;color:var(--dim)}
.ctl.money input{text-align:end;direction:ltr;font-variant-numeric:tabular-nums}
.ctl input[dir="ltr"]{text-align:start}
.ctl.ro{background:var(--head);border-color:var(--line)}
.ctl.ro .val{font-weight:500}
.ctl.dirty{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.foot{min-block-size:24px;display:flex;align-items:flex-start;gap:6px;font-size:.875rem;line-height:1.5;color:var(--dim)}
.foot svg{inline-size:18px;block-size:18px;margin-block-start:2px;flex:none}
.ban{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius);border-inline-start:6px solid var(--fieldline);background:var(--note-bg);font-size:.9375rem;line-height:1.55}

/* detail panel (kit side panel / sheet) */
.scrim{position:fixed;inset:36px 0 0;z-index:60;background:var(--scrim);display:none}
.panel{position:fixed;inset-block:36px 0;inset-inline-end:0;z-index:61;inline-size:440px;max-inline-size:100%;background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);display:none;flex-direction:column}
[data-panel="1"] .scrim,[data-panel="1"] .panel{display:flex}
[data-panel="1"] .scrim{display:block}
.panel .hd{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px 20px;padding-inline:20px 12px;border-block-end:1px solid var(--line)}
.panel .hd .t{flex:1;min-inline-size:0}
.panel .hd h4{margin:0;font:700 1.25rem/1.4 var(--display)}
.panel .hd .sub{display:flex;gap:10px;align-items:center;margin-block-start:2px;color:var(--dim);font-size:.875rem}
.panel .bd{padding:20px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:18px;min-block-size:0}
.panel .bd>*{flex:none}
.panel .ft{padding:14px 20px 18px;border-block-start:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel .ft .spacer{flex:1}
.panel .meta{font-size:.8125rem;color:var(--dim);padding-block-start:4px}
.sec-h{font:700 1rem/1.4 var(--display);margin:4px 0 -6px;padding-block-start:6px;display:flex;align-items:center;gap:10px}
.g2c{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* phone parts */
.m-only{display:none}
.mh{flex:none}
@media (max-width:820px){
  .app{display:flex;flex-direction:column;block-size:calc(100dvh - 36px)}
  .side,.d-only{display:none!important}
  .m-only{display:block}
  .mh{display:flex;align-items:center;justify-content:space-between;block-size:56px;padding:0 16px;background:var(--g900);color:var(--c200)}
  .mh img{display:block;inline-size:88px;block-size:auto;aspect-ratio:519/155}

 {id:'exc',n:'أعمال الحفر والردم',c:62},{id:'con',n:'أعمال خرسانة',c:118},{id:'msn',n:'أعمال بناء',c:74},{id:'ins',n:'أعمال عزل',c:41},

  if(qs)return `${n} نتيجة لـ «${qs}» ${sc}`;
  if(babSel)return `${n} بنداً في هذا الباب ${sc}`;
  return filter==='archived'?`يعرض ${ARCHN} بنداً مؤرشفاً`:(filter==='all'?'يعرض كل البنود: 612':`يعرض ${612-ARCHN} بنداً نشطاً`);
}
function toolsHtml(){
  const seg=`<div class="seg" role="group" aria-label="التصفية">${[['active','نشط'],['archived','مؤرشف'],['all','الكل']].map(a=>`<button type="button" data-f="${a[0]}" aria-pressed="${filter===a[0]}">${a[1]}</button>`).join('')}</div>`;
  const sel=`<div class="sel"><label class="vh" for="bs">الباب</label><select id="bs"><option value="">كل الأبواب</option>${BABS.map(b=>`<option value="${b.id}" ${babSel===b.id?'selected':''}>${b.n}</option>`).join('')}</select>${i('chev','s')}</div>`;
  const clr=(query.trim()||babSel)?`<button type="button" class="lnk" id="clr">مسح التصفية</button>`:'';
  return `<div class="tools d-only">${seg}${sel}</div>
  <div class="mtools m-only"><div class="seg full" role="group" aria-label="التصفية">${[['active','نشط'],['archived','مؤرشف'],['all','الكل']].map(a=>`<button type="button" data-f="${a[0]}" aria-pressed="${filter===a[0]}">${a[1]}</button>`).join('')}</div>
   <div class="mrow">${sel}<button type="button" class="btn sec2 imp2">${i('up','s')}استيراد Excel</button></div></div>
  <div class="count"><span>${countText()}</span>${clr}</div>`;
}
function draw(){
  const vis=visible();
  let body='';
  if(view==='loading'){
    const w=[120,90,50,70,80];
    body=`<div class="tw d-only" role="status" aria-busy="true"><span class="vh">جارٍ التحميل</span><table class="tbl"><thead><tr><th class="id">الوصف</th><th class="en">English</th><th>الوحدة</th><th class="n cost">سعر التكلفة</th><th class="n">سعر البيع</th><th></th></tr></thead><tbody>${Array.from({length:10}).map(()=>`<tr class="it"><td class="id"><span class="sk" style="inline-size:200px"></span></td><td><span class="sk" style="inline-size:150px"></span></td><td><span class="sk" style="inline-size:36px"></span></td><td class="n cost"><span class="sk" style="inline-size:70px"></span></td><td class="n"><span class="sk" style="inline-size:80px"></span></td><td></td></tr>`).join('')}</tbody></table></div><div class="mlist m-only">${Array.from({length:7}).map(()=>`<div class="li"><span class="t"><span class="sk" style="inline-size:70%"></span></span><span class="sell"><span class="sk" style="inline-size:80px"></span></span><span class="sub"><span class="sk" style="inline-size:50%"></span></span></div>`).join('')}</div>`;
  }else if(!vis.length){
    const hasQ=query.trim()||babSel;
    body=`<div class="state">${hasQ?`<div class="ico">${i('search')}</div><h4>لا نتائج مطابقة</h4><p>لا يوجد بند يطابق «${query.trim()||'التصفية الحالية'}» ${filter==='archived'?'في المؤرشف':filter==='all'?'في الكتالوج':'في البنود النشطة'}. تحقق من الرمز أو جرّب كلمة من الوصف.</p><button class="btn sec2" type="button" id="clr2">مسح التصفية</button>`:`<div class="ico">${i('arch')}</div><h4>لا توجد بنود مؤرشفة</h4><p>البنود التي تُؤرشف تظهر هنا ويمكن استرجاعها.</p>`}</div>`;
  }else{
    const groups=BABS.filter(b=>vis.some(x=>x[0]===b.id)||(!query.trim()&&!babSel&&filter!=='archived'));
    const table=`<div class="tw d-only"><table class="tbl"><thead><tr><th class="id">الوصف</th><th class="en">English description</th><th>الوحدة</th><th class="n cost"><span class="int">${i('eyeoff','s')}سعر التكلفة (ج.م) <span class="badge q">داخلي</span></span></th><th class="n">سعر البيع (ج.م)</th><th class="act"><span class="vh">إجراءات</span></th></tr></thead><tbody>${groups.map(b=>groupHtml(b,vis.filter(x=>x[0]===b.id))).join('')}</tbody></table></div>`;
    const mob=`<div class="mlist m-only">${groups.map(b=>{const items=vis.filter(x=>x[0]===b.id);const o=open[b.id]||query.trim()||babSel||filter==='archived';const total=(query.trim()||filter==='archived')?items.length:b.c;
      return `<button type="button" class="mg" data-g="${b.id}" aria-expanded="${!!o}">${i('chev','s chev')}<span class="gn">${b.n}</span><span class="gc">${total} بنداً</span></button>`+(o?items.map(it=>{const code=it[1],isA=ARCH.has(code);
        if(confirmCode===code)return `<div class="li conf"><div class="msg">${i('arch','s')} أرشفة <b>«${it[2]}»</b>؟ يختفي من القائمة النشطة، ويمكنك استرجاعه من «مؤرشف» في أي وقت.</div><div class="bt"><button class="btn" type="button" data-yes="${code}"><span class="spin"></span>أرشفة</button><button class="btn sec2" type="button" data-no>إلغاء</button></div></div>`;
        return `<div class="li ${isA?'arch':''}" data-code="${code}"><span class="t">${it[2]}</span><span class="sell"><bdi class="money" dir="ltr">${money(it[6])}</bdi></span><span class="sub"><bdi dir="ltr">${code}</bdi><span>${unit(it[4])}</span>${isA?`<span class="atag">${i('arch','s')}مؤرشف</span>`:''}</span><span class="costl">${i('eyeoff','s')}تكلفة <bdi class="money" dir="ltr">${money(it[5])}</bdi></span><button type="button" class="ib" data-menu="${code}" aria-label="إجراءات ${it[2]}">${i('dots')}</button></div>`}).join('')+((b.c-items.length>0&&!query.trim()&&filter!=='archived')?`<div class="mmore"><button type="button" class="btn quiet">عرض ${b.c-items.length} بنداً أخرى</button></div>`:''):'')}).join('')}</div>`;
    body=table+mob;
  }
  $('#frame').innerHTML=toolsHtml()+body;
  $('#meta').innerHTML=metaText();
  $('#qx').classList.toggle('is-hidden',!query);
  $('#q').value=query;
  drawPanel();
}
/* ---- detail panel ---- */
function drawPanel(){
  const it=ITEMS.find(x=>x[1]===panelCode);
  A.dataset.panel=it?'1':'0';
  if(!it){$('#panel').innerHTML='';return}
  const b=bab(it[0]),cost=(!RO&&costEdit!=null)?costEdit:it[5];
  const dirty=!RO&&costEdit!=null;
  const mf=(id,label,val,foot,internal,dirtyf)=>RO
    ?`<div class="field"><label>${internal?i('eyeoff','s'):''}${label}${internal?' <span class="badge q">داخلي</span>':''}</label><div class="ctl money ro"><span class="val money" dir="ltr" tabindex="0">${money(val)}</span><span class="aff">ج.م</span><span class="tail">${i('lock','s')}</span></div><div class="foot">${internal?i('eyeoff','s'):''}<span>${foot}</span></div></div>`
    :`<div class="field"><label for="${id}"><span style="display:inline-flex;gap:6px;align-items:center">${internal?i('eyeoff','s'):''}${label}</span>${internal?' <span class="badge q">داخلي</span>':''} <span class="req" aria-hidden="true">*</span></label><div class="ctl money ${dirtyf?'dirty is-focus':''}"><input id="${id}" value="${money(val)}" dir="ltr" inputmode="decimal"><span class="aff">ج.م</span></div><div class="foot">${internal?i('eyeoff','s'):''}<span>${foot}</span></div></div>`;
  const prHead=RO?`<div class="sec-h">الأسعار <span class="badge q">${i('lock','s')}للاطلاع فقط</span></div><div class="foot" style="margin-block-start:2px">يعدّل المالك وحده سعر التكلفة وسعر البيع. بقية بيانات البند تعدّلها أنت.</div>`:`<div class="sec-h">الأسعار</div>`;
  $('#panel').innerHTML=`<div class="grabp"></div><div class="hd"><div class="t"><h4>${it[2]}</h4><div class="sub"><bdi dir="ltr">${it[1]}</bdi><span>${b.n}</span></div></div><button class="ib" type="button" id="pclose" aria-label="إغلاق">${i('x')}</button></div>
  <div class="bd">
   ${dirty?`<div class="ban" role="status">${i('info','s')}<span>تعديل غير محفوظ في سعر التكلفة.</span></div>`:''}
   ${prHead}
   ${mf('pc','سعر التكلفة',cost,'داخلي: لا يظهر في أي مستند يراه العميل.',true,dirty)}
   ${mf('ps','سعر البيع',it[6],'سعر البيع المسجّل لهذا البند في الكتالوج.',false,false)}
   <div class="sec-h">بيانات البند</div>
   <div class="field"><label for="d1">الوصف بالعربية <span class="req" aria-hidden="true">*</span></label><div class="ctl"><input id="d1" value="${it[2]}"></div></div>
   <div class="field"><label for="d2">الوصف بالإنجليزية</label><div class="ctl"><input id="d2" value="${it[3]}" dir="ltr"></div></div>
   <div class="g2c"><div class="field"><label for="d3">الوحدة <span class="req" aria-hidden="true">*</span></label><div class="ctl"><span class="val">${unit(it[4])}</span><span class="tail">${i('chev','s')}</span></div></div>
   <div class="field"><label>رمز البند</label><div class="ctl ro"><span class="val" dir="ltr" tabindex="0">${it[1]}</span><span class="tail">${i('lock','s')}</span></div></div></div>
   <div class="meta">أُنشئ في 03/02/2026. آخر تعديل: ${RO?'أحمد نبيل':'سارة عادل'}، 28/08/2026.</div>
  </div>
  <div class="ft"><button class="btn prim" type="button" ${dirty?'':'disabled'}>حفظ</button><button class="btn sec2" type="button" id="pclose2">إغلاق</button><span class="spacer"></span><button class="btn sec2" type="button">${i('arch','s')}أرشفة</button></div>`;
  $('#pclose').onclick=$('#pclose2').onclick=()=>{panelCode=null;costEdit=null;drawPanel()};
}
/* ---- menu + actions ---- */
function placePop(w,b){const p=w.querySelector('.pop'),r=b.getBoundingClientRect(),h=p.offsetHeight||200;p.style.left=Math.max(8,r.left+240<=innerWidth-8?r.left:r.right-240)+'px';p.style.top=(r.bottom+h+8>innerHeight?r.top-h-4:r.bottom+4)+'px'}
function menuFor(code){const isA=ARCH.has(code);return `<div class="pop" role="menu"><button class="opt" role="menuitem" data-open="${code}">${i('eye','s')}عرض التفاصيل</button><button class="opt" role="menuitem" data-open="${code}">${i('pen','s')}تعديل</button><div class="sepr"></div>${isA?`<button class="opt" role="menuitem" data-unarch="${code}">${i('unarch','s')}إلغاء الأرشفة</button>`:`<button class="opt" role="menuitem" data-arch="${code}">${i('arch','s')}أرشفة…</button>`}</div>`}
document.addEventListener('click',e=>{
  const mb=e.target.closest('[data-menu]');
  document.querySelectorAll('.menuwrap.open').forEach(w=>{if(!mb||w!==mb.closest('.menuwrap'))w.classList.remove('open')});
  if(mb){const w=mb.closest('.menuwrap')||mb.parentElement;let mw=w;if(!w.classList.contains('menuwrap')){mb.insertAdjacentHTML('beforebegin','<span class="menuwrap"></span>');mw=mb.previousElementSibling;mw.appendChild(mb)}
    if(!mw.querySelector('.pop'))mw.insertAdjacentHTML('beforeend',menuFor(mb.dataset.menu));mw.classList.toggle('open');if(mw.classList.contains('open'))placePop(mw,mb);return}
  const g=e.target.closest('[data-g]');if(g){const id=g.dataset.g;open[id]=!(open[id]||query.trim());draw();return}
  const f=e.target.closest('[data-f]');if(f){filter=f.dataset.f;draw();return}
  const o=e.target.closest('[data-open]');if(o){panelCode=o.dataset.open;costEdit=null;draw();return}
  const ar=e.target.closest('[data-arch]');if(ar){confirmCode=ar.dataset.arch;draw();return}
  const ua=e.target.closest('[data-unarch]');if(ua){ARCH.delete(ua.dataset.unarch);doneCode=ua.dataset.unarch;draw();setTimeout(()=>{doneCode=null;draw()},2500);return}
  if(e.target.closest('[data-no]')){confirmCode=null;draw();return}
  const yes=e.target.closest('[data-yes]');if(yes){yes.classList.add('is-busy');setTimeout(()=>{ARCH.add(yes.dataset.yes);confirmCode=null;draw()},900);return}
  const row=e.target.closest('tr.it,.li');if(row&&row.dataset.code&&!e.target.closest('.ib,.menuwrap')){panelCode=row.dataset.code;costEdit=null;draw();return}
  if(e.target.closest('#clr,#clr2')){query='';babSel='';draw();return}
});
document.addEventListener('change',e=>{if(e.target.id==='bs'){babSel=e.target.value;draw()}});
$('#q').addEventListener('input',e=>{query=e.target.value;draw();$('#q').focus()});
$('#qx').onclick=()=>{query='';draw()};
$('#scrim').onclick=()=>{if(sheet){sheet=false;A.dataset.sheet='0'}else{panelCode=null;costEdit=null;drawPanel()}};
addEventListener('keydown',e=>{if(e.key==='Escape'){if(panelCode){panelCode=null;drawPanel()}document.querySelectorAll('.menuwrap.open').forEach(w=>w.classList.remove('open'))}});
addEventListener('scroll',()=>document.querySelectorAll('.menuwrap.open').forEach(w=>w.classList.remove('open')),true);
/* shell chrome */
$('#nav').innerHTML=navHtml();$('#nav2').innerHTML=navHtml();
['1','2'].forEach(k=>{$('#un'+k).textContent=USER.n;$('#ur'+k).textContent=USER.r;$('#av'+k).textContent=[...USER.n][0]});
$('#menu').onclick=()=>{sheet=true;A.dataset.sheet='1'};$('#closeN').onclick=()=>{sheet=false;A.dataset.sheet='0'};
if(sheet)A.dataset.sheet='1';
const tgl=()=>{const d=H.dataset.theme?H.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;H.dataset.theme=d?'light':'dark'};
$('#themebtn').onclick=$('#theme1').onclick=$('#theme2').onclick=tgl;
$('#dirbtn').onclick=()=>{const l=H.dir==='rtl';H.dir=l?'ltr':'rtl';H.lang=l?'en':'ar'};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v=b.dataset.view;location.search='?view='+v});
document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));
const rail=()=>{A.dataset.rail=(matchMedia('(max-width:1100px)').matches&&innerWidth>820)?'1':'0'};rail();addEventListener('resize',rail);
draw();
if(view==='archive')requestAnimationFrame(()=>document.querySelector('.li.conf')?.scrollIntoView({block:'center'}));
</script>
</body>
</html>
