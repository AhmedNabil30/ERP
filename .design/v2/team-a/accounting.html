<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كف - المحاسبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* KAAF accounting release 4, screens A1-A14 (mock). Shell, frame, tabs, list, table, buttons, banners, fields, sheet copied unchanged from extracts.html. New parts under "THIS FILE (accounting)". */
:root{
  --g900:#09221e; --g800:#0f2e29; --g300:#9fb3ad; --c100:#f4eee9; --c200:#e6d9d1; --radius:6px;
  --bg:var(--c100); --surface:#fbf8f5; --head:#ebe0d8; --ink:var(--g900); --dim:#4b5f59; --line:rgba(9,34,30,.16); --hover:rgba(9,34,30,.055);
  --btn:var(--g900); --btn-h:#25544b; --btn-ink:var(--c200); --field:#fbf8f5; --fieldline:var(--g900); --focus:var(--g900);
  --err-bg:#f9e4dd; --err-ink:#7a1a0e; --err-bar:#c2321c;
  --st-run-bg:#d3e3db; --st-run-ink:#0b3b32; --st-done-bg:var(--g900); --st-done-ink:var(--c200);
  --st-stuck-bg:#f9e4dd; --st-stuck-ink:#7a1a0e; --st-post-bg:#e6d9d1; --st-post-ink:#43392f; --st-none-ink:#4b5f59;
  --note-bg:#ebe0d8; --ok-bg:#d3e3db; --ok-ink:#0b3b32;
  --scrim:rgba(3,13,11,.55); --strip:var(--c200); --shadow:0 12px 36px rgba(9,34,30,.22);
  --display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;
  --side:256px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#061815; --surface:#0a1f1b; --head:#0f2e29; --ink:var(--c200); --dim:var(--g300); --line:rgba(230,217,209,.18); --hover:rgba(230,217,209,.06);
  --btn:var(--c200); --btn-h:#fbf6f2; --btn-ink:var(--g900); --field:#0f2e29; --fieldline:#7f9a92; --focus:var(--c200);
  --err-bg:#3b1612; --err-ink:#ffd0c6; --err-bar:#ff7b63;
  --st-run-bg:#17403a; --st-run-ink:#e6d9d1; --st-done-bg:var(--c200); --st-done-ink:var(--g900);
  --st-stuck-bg:#3b1612; --st-stuck-ink:#ffd0c6; --st-post-bg:#1d2b27; --st-post-ink:#c9bfb7; --st-none-ink:#9fb3ad;
  --note-bg:#0f2e29; --ok-bg:#17403a; --ok-ink:#e6d9d1; --strip:#030d0b; --shadow:0 12px 36px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --bg:#061815; --surface:#0a1f1b; --head:#0f2e29; --ink:var(--c200); --dim:var(--g300); --line:rgba(230,217,209,.18); --hover:rgba(230,217,209,.06);
  --btn:var(--c200); --btn-h:#fbf6f2; --btn-ink:var(--g900); --field:#0f2e29; --fieldline:#7f9a92; --focus:var(--c200);
  --err-bg:#3b1612; --err-ink:#ffd0c6; --err-bar:#ff7b63;
  --st-run-bg:#17403a; --st-run-ink:#e6d9d1; --st-done-bg:var(--c200); --st-done-ink:var(--g900);
  --st-stuck-bg:#3b1612; --st-stuck-ink:#ffd0c6; --st-post-bg:#1d2b27; --st-post-ink:#c9bfb7; --st-none-ink:#9fb3ad;
  --note-bg:#0f2e29; --ok-bg:#17403a; --ok-ink:#e6d9d1; --strip:#030d0b; --shadow:0 12px 36px rgba(0,0,0,.6);}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{inline-size:22px;block-size:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{inline-size:18px;block-size:18px}
.vh{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible,.is-focus{outline:3px solid var(--focus);outline-offset:3px}
bdi{unicode-bidi:isolate}

/* ---------- preview strip (NOT part of the design) ---------- */
.strip{background:var(--strip);font-size:.8125rem;position:relative;z-index:80}
.strip summary{list-style:none;display:flex;align-items:center;gap:.5rem;min-block-size:36px;padding:0 1rem;cursor:pointer}
.strip summary::-webkit-details-marker{display:none}
.strip .panelx{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;padding:.25rem 1rem .75rem}
.strip .grp{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center}
.strip .grp>b{font-weight:600;margin-inline-end:6px}
.strip button{min-block-size:36px;padding:0 .7rem;border:1px solid currentColor;background:transparent;border-radius:var(--radius);color:inherit}
.strip button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
body.embed .strip{display:none}
body.embed .app{block-size:100dvh}
#phone{position:fixed;inset:0;z-index:200;background:var(--scrim);display:none;place-items:center}
#phone[data-open="1"]{display:grid}
#phone .dev{display:grid;gap:8px;justify-items:center}
#phone iframe{inline-size:390px;block-size:min(800px,calc(100dvh - 90px));border:8px solid #000;border-radius:26px;background:var(--bg)}
#phone button{min-block-size:44px;padding:0 18px;border:1.5px solid var(--c200);background:transparent;color:var(--c200);border-radius:var(--radius)}

/* ---------- app + shell (layout.html, unchanged) ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);block-size:calc(100dvh - 36px);overflow:hidden}
.app[data-rail="1"]{--side:76px}
.side{background:var(--g900);color:var(--c200);display:flex;flex-direction:column;min-inline-size:0;min-block-size:0}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding-inline:20px 12px;block-size:72px;flex:none}
.side-top img{display:block;inline-size:104px;block-size:auto;aspect-ratio:519/155}
.coll{inline-size:44px;block-size:44px;display:grid;place-items:center;border:0;background:transparent;color:var(--c200);border-radius:var(--radius)}
.coll:hover{background:rgba(230,217,209,.1)}
[dir="rtl"] .coll .chev,[dir="ltr"] .app[data-rail="1"] .coll .chev{transform:scaleX(-1)}
[dir="rtl"] .app[data-rail="1"] .coll .chev{transform:none}
.nav{flex:1;overflow-y:auto;padding:8px 12px 16px;min-block-size:0}
.grp-h{margin:18px 0 6px;padding-inline:12px;font:600 .8125rem/1.4 var(--display);color:var(--g300)}
.nav .grp:first-child .grp-h{margin-block-start:6px}
.nav .grp+.grp{margin-block-start:10px;border-block-start:1px solid rgba(230,217,209,.14)}
.row{position:relative;display:flex;align-items:center;gap:14px;min-block-size:44px;padding:0 12px;border-radius:var(--radius);color:var(--c200);text-decoration:none;font:500 .96875rem/1.3 var(--body)}
.row:hover{background:rgba(230,217,209,.09)}
.row:focus-visible{outline:3px solid var(--c200);outline-offset:-3px}
.row[aria-current="page"]{background:rgba(230,217,209,.15);font-weight:600}
.row[aria-current="page"]::before{content:"";position:absolute;inset-block:8px;inset-inline-start:-12px;inline-size:5px;border-start-end-radius:3px;border-end-end-radius:3px;background:var(--c200)}
.side-foot{flex:none;padding:12px;border-block-start:1px solid rgba(230,217,209,.14)}
.who{display:flex;align-items:center;gap:12px;padding:6px 6px 12px}
.av{inline-size:40px;block-size:40px;border-radius:50%;background:var(--c200);color:var(--g900);display:grid;place-items:center;font:700 1rem/1 var(--display);flex:none}
.who b{display:block;font:600 .96875rem/1.3 var(--body)}
.who span{display:block;font-size:.8125rem;color:var(--g300)}
.ctl2{display:flex;gap:8px}
.ctl2 button{flex:1;min-block-size:44px;border:1.5px solid rgba(230,217,209,.55);background:transparent;color:var(--c200);border-radius:var(--radius);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.ctl2 button:hover{background:rgba(230,217,209,.1)}
.i-short{display:none}
.app[data-rail="1"] .i-short{display:inline;font-weight:700}
.app[data-rail="1"] .lbl,.app[data-rail="1"] .grp-h,.app[data-rail="1"] .who>div,.app[data-rail="1"] .side-top img,.app[data-rail="1"] .ctl2 .t{display:none}
.app[data-rail="1"] .side-top{justify-content:center;padding:0}
.app[data-rail="1"] .row{justify-content:center;padding:0}
.app[data-rail="1"] .who{justify-content:center;padding-inline:0}
.app[data-rail="1"] .ctl2{flex-direction:column}
.main{min-inline-size:0;min-block-size:0;display:flex;flex-direction:column;overflow-y:auto;position:relative}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:12px 32px 12px;flex-wrap:wrap}
.ph h1{font:700 2rem/1.3 var(--display);margin:0}
.acts{display:flex;align-items:center;gap:12px}
.frame{padding:0 32px 56px;flex:1;min-inline-size:0}

/* ---------- kit parts, unchanged ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-block-size:48px;padding:0 22px;border:2px solid transparent;border-radius:var(--radius);background:var(--btn);color:var(--btn-ink);font:700 1rem/1 var(--display);white-space:nowrap;text-decoration:none}
.btn.sm{min-block-size:44px;padding:0 16px;font-size:.9375rem}
.btn:hover{background:var(--btn-h)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sec2{background:transparent;color:var(--ink);border-color:var(--fieldline)}
.btn.sec2:hover{background:var(--hover)}
.btn.quiet{background:transparent;color:var(--ink)}
.btn.quiet:hover{background:var(--hover)}
.ib{inline-size:44px;block-size:44px;display:inline-grid;place-items:center;border:2px solid transparent;background:transparent;color:var(--ink);border-radius:var(--radius);padding:0}
.ib:hover{background:var(--hover)}
.lnk{color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;font-weight:500;background:none;border:0;padding:0}
.lnk:hover{text-decoration-thickness:3px}
a.lnk{display:inline-flex;align-items:center;min-block-size:44px}
.back{display:inline-flex;align-items:center;gap:6px;min-block-size:44px;color:var(--ink);text-decoration:none;font-weight:600}
[dir="rtl"] .back svg{transform:scaleX(-1)}
.back:hover{text-decoration:underline;text-underline-offset:4px}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-inline-size:24px;block-size:24px;padding:0 8px;border-radius:var(--radius);border:1.5px solid var(--fieldline);font:600 .8125rem/1 var(--body);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge svg{inline-size:14px;block-size:14px}
.badge.q{border-color:var(--line);color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:7px;block-size:28px;padding-inline:10px 12px;border-radius:var(--radius);font:600 .8125rem/1 var(--body);white-space:nowrap;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 30%,transparent)}
.pill svg{inline-size:13px;block-size:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s-run{background:var(--st-run-bg);color:var(--st-run-ink)}
.s-done{background:var(--st-done-bg);color:var(--st-done-ink)}
.s-none{background:transparent;color:var(--st-none-ink);box-shadow:inset 0 0 0 1.5px currentColor}
.spin{display:none;inline-size:18px;block-size:18px;border:3px solid color-mix(in srgb,currentColor 30%,transparent);border-top-color:currentColor;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.ban{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius);border-inline-start:6px solid var(--err-bar);background:var(--err-bg);color:var(--err-ink);font-weight:500;line-height:1.55}
.ban svg{margin-block-start:2px}
.ban.note{background:var(--note-bg);color:var(--ink);border-inline-start-color:var(--fieldline);font-weight:400}
.ban.ok{background:var(--ok-bg);color:var(--ok-ink);border-inline-start-color:var(--ok-ink)}
.ban .act{margin-inline-start:auto;flex:none}
.ban>svg,.locked>svg,.cfm svg,.rec>svg{inline-size:20px;block-size:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cfm>span{display:flex;gap:10px;align-items:flex-start}
.ban b{font-weight:700}
.ban.rowc{flex-wrap:wrap;align-items:center}
.state{border:1.5px solid var(--line);border-radius:var(--radius);background:transparent;padding:44px 24px;text-align:center;display:grid;justify-items:center;gap:10px}
.state.refused{border-style:dashed;border-color:var(--fieldline)}
.state.solid{background:var(--surface)}
.state .ico{inline-size:56px;block-size:56px;border-radius:var(--radius);display:grid;place-items:center;background:var(--head)}
.state.refused .ico{border-radius:50%;border:2px solid var(--fieldline);background:transparent}
.state .ico svg{inline-size:28px;block-size:28px}
.state h4{font:700 1.125rem/1.4 var(--display);margin:4px 0 0}
.state p{margin:0;color:var(--dim);max-inline-size:46ch;font-size:.9375rem}
.sk{display:inline-block;block-size:14px;border-radius:4px;background:linear-gradient(90deg,var(--line),var(--hover),var(--line));background-size:200% 100%;animation:sh 1.4s linear infinite;vertical-align:middle}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}}
.sk.b{display:block}

/* ---------- money half of the kit, unchanged ---------- */
.fig{font-variant-numeric:tabular-nums;font-weight:500;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.fig.neg{font-weight:600}
.fig .u{color:var(--dim);font-weight:400;font-size:.8125em;margin-inline-start:6px}
.fx{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--radius);border-inline-start:6px solid var(--ok-ink);background:var(--ok-bg);color:var(--ok-ink);font-weight:600;line-height:1.5}
.rec svg{inline-size:20px;block-size:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rec small{font-weight:400;flex-basis:100%}
.chain{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:0;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;list-style:none;margin:0;padding:0}
.chain li{padding:12px 12px 14px;display:grid;gap:4px;align-content:start;position:relative;min-inline-size:0}
.chain li+li{border-inline-start:1px solid var(--line)}
.chain .st{display:flex;align-items:center;gap:8px;font-weight:600;line-height:1.3}
.chain .mk{inline-size:26px;block-size:26px;border-radius:50%;border:2px solid var(--fieldline);display:grid;place-items:center;flex:none;font:700 .75rem/1 var(--body)}
.chain .mk svg{inline-size:14px;block-size:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chain li.done .mk{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chain li.cur{background:var(--head)}
.chain li.cur .mk{border-width:3px;background:var(--bg)}
.chain li.cur .mk::after{content:"";inline-size:8px;block-size:8px;border-radius:50%;background:var(--ink)}
.chain .who2 bdi{white-space:nowrap}
.chain .who2{font-size:.8125rem;color:var(--dim);line-height:1.4}
.chain .age{display:inline-flex;gap:5px;align-items:center;font-size:.8125rem;font-weight:600}
.chain .age svg{inline-size:14px;block-size:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* ---------- THIS SCREEN: new parts (documented in README) ---------- */
.phl{display:grid;gap:2px;min-inline-size:0}
.ttl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meta{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;margin:2px 0 0;color:var(--dim);font-size:.9375rem}
.meta .code{font-variant-numeric:tabular-nums;color:var(--dim)}
.meta a{color:var(--ink);font-weight:600}


.kv{margin:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.kv>div{display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:2px 16px;align-items:center;min-block-size:52px;padding:6px 16px;border-block-start:1px solid var(--line)}
.kv>div:first-child{border-block-start:0}
.kv dt{color:var(--dim);font-size:.9375rem}
.kv dd{margin:0;font-weight:500;min-inline-size:0}
.kv dd small{display:block;color:var(--dim);font-weight:400;font-size:.8125rem;line-height:1.45}
.kv .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.kv .big{font:700 1.375rem/1.25 var(--body)}
.kv .nul{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.kv .nul svg{inline-size:20px;block-size:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;margin-block-start:2px}
.kv .nul b{display:block;font-weight:600}
.kv .nul small{display:block;color:var(--dim);font-weight:400;font-size:.8125rem}

.pg{display:grid;gap:8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px 16px}
.pg .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.pg .top b{font:600 1rem/1.4 var(--display)}
.pg .num{font:700 1.5rem/1.2 var(--body)}
.pg .trk{block-size:12px;border-radius:4px;background:var(--line);overflow:hidden}
.pg .trk i{display:block;block-size:100%;background:var(--ink)}
.pg .ft{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;color:var(--dim);font-size:.875rem}



.lst{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.lst li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:10px 16px;border-block-start:1px solid var(--line);align-items:center;min-block-size:60px}
.lst li:first-child{border-block-start:0}
.lst b{font-weight:600}
.lst small{grid-column:1/-1;color:var(--dim);font-size:.8125rem;line-height:1.45}
.lst .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;color:var(--dim);font-size:.875rem}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sec-h h3{font:600 1.0625rem/1.4 var(--display);margin:0}

/* ---------- phone (kit breakpoint) ---------- */
.m-only{display:none}
.mh{flex:none}
@media (max-width:1100px){
  .chain{grid-auto-flow:row}.chain li+li{border-inline-start:0;border-block-start:1px solid var(--line)}.chain li{grid-template-columns:auto 1fr;column-gap:12px;align-items:start}.chain .st{grid-row:1/4}
}
@media (max-width:820px){
  .app{display:flex;flex-direction:column;block-size:calc(100dvh - 36px)}
  .side,.d-only{display:none!important}
  .m-only{display:block}
  .mh{display:flex;align-items:center;justify-content:space-between;block-size:56px;padding:0 16px;background:var(--g900);color:var(--c200)}
  .mh img{display:block;inline-size:88px;block-size:auto;aspect-ratio:519/155}
  .mh .lang{min-block-size:44px;padding:0 14px;border:1.5px solid rgba(230,217,209,.6);background:transparent;color:var(--c200);border-radius:var(--radius);font-weight:600}
  .main{flex:1;overscroll-behavior:contain}
  .ph{display:block;padding:8px 16px 8px}
  .ph h1{font-size:1.625rem}
  .frame{padding:0 16px 24px}
  .kv>div{grid-template-columns:minmax(0,1fr) auto;padding:10px 14px}
  .kv dt{grid-column:1/-1;font-size:.8125rem}
  .kv .tags{grid-column:1/-1;justify-content:flex-start}
  .abar{flex:none;display:flex;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-block-start:1px solid var(--line)}
  .abar .menu{flex:none;min-inline-size:116px;block-size:60px;display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--fieldline);background:transparent;border-radius:var(--radius);font:700 1rem/1 var(--display)}
  .abar .btn{flex:1;block-size:60px;font-size:1.0625rem}
  [data-sheet="1"] .abar{visibility:hidden}
  .nsheet{position:fixed;inset-inline:0;inset-block-end:0;z-index:70;max-block-size:90dvh;display:none;flex-direction:column;background:var(--bg);border-start-start-radius:var(--radius);border-start-end-radius:var(--radius);box-shadow:0 -12px 40px rgba(0,0,0,.35)}
  [data-sheet="1"] .scrim{display:block;z-index:65}
  [data-sheet="1"] .nsheet{display:flex}

.stage .sx.inl{display:flex;position:static;inline-size:min(460px,100%);max-block-size:none;justify-self:end;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stage .sx.inl .grab{display:none}
.stage.dl{place-items:center}
.stage .dlg .ft .btn{flex:1}
@media (max-width:820px){
  .stage{padding:48px 0 0;margin-inline:-16px;border-radius:0;align-items:end;min-block-size:calc(100dvh - 160px)}
  .stage.dl{padding:16px;place-items:center}
  .stage .sx.inl{inline-size:100%;border-radius:var(--radius) var(--radius) 0 0}
  .stage .sx.inl .grab{display:block}
}
/* THIS FILE (accounting): labelled rows inside a list item, and the figure strip (sum) with its out-of-balance cell */
.lst .kx{grid-column:1/-1;display:grid;gap:2px}
.lst .kx>div{display:flex;justify-content:space-between;gap:12px;color:var(--dim);font-size:.875rem}
.lst .kx .fig,.lst .kx .fx{color:var(--ink);font-weight:600}
.lst b a{color:var(--ink);font-weight:600;text-decoration:none}
.tbl tfoot td{block-size:56px;padding:6px 14px;background:var(--head);border-block-start:2px solid var(--fieldline);font-weight:700}
.sum{margin:0;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.sum>div{display:grid;gap:2px;padding:12px 16px;min-inline-size:0;border-inline-start:1px solid var(--line)}
.sum>div:first-child{border-inline-start:0}
.sum dt{color:var(--dim);font-size:.8125rem}
.sum dd{margin:0;font:700 1.25rem/1.3 var(--body)}
.sum dd svg{inline-size:18px;block-size:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-inline-end:6px}
.sum .bad{background:var(--err-bg);border-inline-start:6px solid var(--err-bar)}
.sum.stk{position:sticky;inset-block-start:0;z-index:5}
.s-over{background:var(--err-ink);color:var(--err-bg);box-shadow:none}
.s-near{background:var(--err-bg);color:var(--err-ink)}
.s-within{background:transparent;color:var(--dim)}
.stp{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.stp li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;min-block-size:64px;border-block-start:1px solid var(--line)}
.stp li:first-child{border-block-start:0}
.stp li.go{cursor:pointer}
.stp li.go:hover{background:var(--hover)}
.stp li.nx{background:var(--head);border-inline-start:6px solid var(--ink);padding-inline-start:10px}
.stp li.nx b{font-weight:700}
.stp li.lk{color:var(--dim)}
.stp .num{inline-size:32px;block-size:32px;border-radius:50%;border:2px solid var(--fieldline);display:grid;place-items:center;font:700 .875rem/1 var(--body)}
.stp .num svg{inline-size:16px;block-size:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.stp .num.dn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stp li.nx .num{border-width:3px}
.stp li.lk .num{border-style:dashed}
.stp .nm small{display:block;color:var(--dim);font-size:.8125rem}
.stp .r{display:flex;gap:10px;align-items:center}
.tbl td small{display:block}
.sum .bad dt,.sum .bad dd{color:var(--err-ink)}
.flt{max-inline-size:360px}
@media (max-width:820px){
  .sum{grid-template-columns:1fr}
  .sum>div{border-inline-start:0;border-block-start:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;min-block-size:48px}
  .sum>div:first-child{border-block-start:0}
  .sum dd{font-size:1.0625rem}
}

SCR.a1={t:'الأرصدة الافتتاحية',who:'المالك، المالية',v:{normal:'متوازنة',diff:'الفرق لا يساوي صفرًا',empty:'فارغ',failed:'تعذّر الحفظ',loading:'تحميل',refused:'ممنوع'},

const budP=k=>pl(k==='over'?'تجاوز':k==='near'?'قريب من الحد':'ضمن الحد',k);
SCR.a12={t:'موازنات المشاريع',who:'المالك (جوال أيضًا)، المالية',v:{normal:'عادي',empty:'فارغ',loading:'تحميل',failed:'تعذّر التحميل',refused:'ممنوع'},
r(s){
  const o={title:'موازنات المشاريع',meta:meta('ج.م')};const x=sf(s,o,4,'تعذّر تحميل الموازنات.');if(x)return x;
  if(s==='empty')return {...o,body:pane(st('لا توجد مقايسات موقّعة'))};
  const cols=[['المشروع'],['الحالة'],['المستخدم من الحد',1],['خط الأساس (ج.م)',1],['المعتمد للصرف (ج.م)',1],['المدفوع (ج.م)',1]];
  return {...o,body:pane(dual(cols,BUD.map(r=>({go:go('a13'),c:[`<a href="#a13">${r[0]}</a>`,budP(r[1]),`<bdi class="fx" dir="ltr">${Math.round(r[3]/r[5]*100)}%</bdi>`,fg(r[2]),fg(r[3]),fg(r[4])]})),{pill:1}),1)};
}};

/* A13 Project budget tab (depends on Q6). Status first, tolerance between baseline and limit, limit follows the field. */
SCR.a13={t:'موازنة المشروع',who:'المالك يحدد النسبة، المالية تقرأ',v:{owner:'المالك',finance:'المالية (قراءة)',err:'النسبة ناقصة',loading:'تحميل',failed:'تعذّر التحميل'},
r(s){
  const o={head:frameHead(),tabs:tabs2()};
  if(s==='loading')return {...o,body:skel(3)};
  if(s==='failed')return {...o,body:failed('تعذّر تحميل الموازنة.')};
  const ow=s!=='finance',e=s==='err';
  const top=sum([['الحالة',budP('near')],['المستخدم من الحد',`<bdi dir="ltr">88%</bdi>`]]);
  const f1=fl([['خط الأساس',fg(2400000)]]);
  const tol=ow?`<div class="g2 flt">${fld({id:'tl',label:'نسبة السماح',req:1,err:e?'أدخل نسبة السماح':'',ctl:numc('tl',e?'':'10','%')})}</div>`:fl([['نسبة السماح','<bdi dir="ltr">10%</bdi>']]);
  const f2=fl([['الحد',`<span id="lim">${e?'—':fg(2640000)}</span>`],['المعتمد للصرف',fg(2310000)],['المدفوع',fg(1430000)]]);
  const hs=sh('سجل خط الأساس')+`<ul class="lst"><li><b>أمر تغيير 2</b><span class="r">${dt('02/11/2026')}</span><small>رفع خط الأساس من ${fg(2200000)} إلى ${fg(2400000)}</small></li><li><b>توقيع المقايسة</b><span class="r">${dt('10/03/2026')}</span><small>خط الأساس ${fg(2200000)}</small></li></ul>`;
  return {...o,pa:ow?btn('حفظ نسبة السماح'):'',body:pane(top+f1+tol+f2+hs)};
}};

/* A14 Loans (only if Q8 answers yes). Principal is «المتبقي من القرض» and «سداد القرض». */
SCR.a14={t:'القروض',who:'المالية',v:{normal:'عادي',add:'إضافة قسط',addloan:'إضافة قرض',empty:'فارغ',loading:'تحميل',failed:'تعذّر التحميل',refused:'ممنوع'},
r(s){
  const o={title:'القروض',meta:meta('ج.م'),pa:btn('إضافة قسط','',go('a14','add'))+btn('إضافة قرض','sec2',go('a14','addloan'))};const x=sf(s,o,3,'تعذّر تحميل القروض.');if(x)return x;
  if(s==='empty')return {...o,pa:'',body:pane(st('لا توجد قروض','','info','',btn('إضافة قرض','',go('a14','addloan'))))};
  const L=dual([['المقرض'],['المتبقي من القرض (ج.م)',1],['القسط القادم (ج.م)',1],['تاريخه']],[{c:['البنك الأهلي',fg(900000),fg(54000),dt('15/12/2026')]}]);
  const P=dual([['التاريخ'],['سداد القرض (ج.م)',1],['الفائدة (ج.م)',1]],[{c:[dt('15/11/2026'),fg(42000),fg(12000)]},{c:[dt('15/10/2026'),fg(41500),fg(12500)]}]);
  if(s==='add'){
    const bd=fld({id:'ln',label:'القرض',req:1,ctl:selc('ln',['البنك الأهلي'],'البنك الأهلي')})+fld({id:'ld',label:'التاريخ',req:1,ctl:datec('ld','15/12/2026')})+fld({id:'lp',label:'سداد القرض',req:1,ctl:money('lp','42,000.00')})+fld({id:'li',label:'الفائدة',req:1,ctl:money('li','12,000.00')});
    return {...o,body:sheet('إضافة قسط',bd,btn('حفظ')+btn('إلغاء','sec2'))};
  }
  if(s==='addloan'){
    const bd=fld({id:'lm',label:'المقرض',req:1,ctl:textc('lm','')})+fld({id:'la',label:'مبلغ القرض',req:1,ctl:money('la','')})+fld({id:'lt',label:'تاريخ الصرف',req:1,ctl:datec('lt','')});
    return {...o,body:sheet('إضافة قرض',bd,btn('حفظ')+btn('إلغاء','sec2'))};
  }
  return {...o,body:pane(sh('القروض')+L+sh('الأقساط المسددة')+P,1)};
}};

/* live behaviour in the mock: the limit follows the tolerance field (A13), the balance follows the paid-from choice (A5) */
document.addEventListener('input',e=>{if(e.target.id==='tl'){const v=parseFloat(e.target.value.replace(/,/g,'')),el=document.getElementById('lim');if(el)el.innerHTML=isNaN(v)?'—':fg(2400000*(1+v/100))}});
document.addEventListener('change',e=>{if(e.target.name==='src'){const k=[...document.getElementsByName('src')].indexOf(e.target)?'b':'s',f=document.getElementById('srcf');if(f)f.innerHTML=balF(k).replace(/^<span[^>]*>|<\/span>$/g,'')}});

/* ---------------- preview frame ---------------- */
const ORDER=['a1','a2','a3','a4','a5','a6','a7','a8','a9','a10','a11','a12','a13','a14'];

const q=new URLSearchParams(location.search),EMBED=q.get('embed')==='1',ONLY=q.get('only');
const VIEW={};
(q.get('view')||'').split(',').filter(Boolean).forEach(t=>{const [a,b]=t.includes(':')?t.split(':'):[null,t];ORDER.forEach(id=>{if(a?id===a:SCR[id].v[b])VIEW[id]=a?b:b})});
const first=id=>Object.keys(SCR[id].v)[0];
const $=s=>document.querySelector(s),H=document.documentElement;
function section(id){
  const S=SCR[id],v=VIEW[id]&&S.v[VIEW[id]]?VIEW[id]:first(id),o=S.r(v);
  const lab=`<div class="artl"><b>${id.toUpperCase()} ${S.t} · ${S.who}</b>${Object.entries(S.v).map(([k,l])=>`<button type="button" data-s="${id}" data-v="${k}" aria-pressed="${k===v}">${l}</button>`).join('')}</div>`;
  const head=o.head||`<div class="phl">${o.back?`<a class="back" href="#${o.to}">${i('left','s')}${o.back}</a>`:''}<div class="ttl"><h1>${o.title}</h1>${o.pill||''}</div>${o.meta?`<p class="meta">${o.meta}</p>`:''}${o.under||''}</div>`;
  const sheetOpen=o.body.includes('class="stage');
  return `${lab}<div class="ph">${head}<div class="acts d-only">${sheetOpen?'':o.pa||''}</div></div>${o.tabs||''}<div class="frame">${o.body}</div>${sheetOpen?'':`<div class="abar m-only"><button type="button" class="menu">${i('menu')}القائمة</button>${o.pa||''}</div>`}`;
}
function draw(id){const el=document.getElementById(id);el.innerHTML=section(id)}
function url(){const v=Object.entries(VIEW).map(([a,b])=>a+':'+b).join(',');const p=new URLSearchParams();if(v)p.set('view',v);if(ONLY)p.set('only',ONLY);if(EMBED)p.set('embed','1');history.replaceState(null,'','?'+p.toString()+location.hash)}
const main=$('#main');
main.innerHTML=ORDER.filter(id=>!ONLY||ONLY===id).map(id=>`<section class="scr" id="${id}" aria-label="${SCR[id].t}"></section>`).join('');
ORDER.filter(id=>!ONLY||ONLY===id).forEach(draw);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-s]');if(b){VIEW[b.dataset.s]=b.dataset.v;draw(b.dataset.s);url();return}
  const g=e.target.closest('[data-go]');if(g){const [id,v]=g.dataset.go.split(':');if(!document.getElementById(id))return;e.preventDefault();VIEW[id]=v||first(id);draw(id);url();document.getElementById(id).scrollIntoView({block:'start'})}
  if(e.target.closest('.menu')){$('#app').dataset.sheet='1'}
});
$('#jump').insertAdjacentHTML('beforeend',ORDER.map(id=>`<button type="button" onclick="document.getElementById('${id}')?.scrollIntoView()">${id.toUpperCase()}</button>`).join(''));
const NAV=[['book','a1','الأرصدة الافتتاحية'],['box','a2','الأصول'],['calc','a4','المستحقات والمقدمات'],['doc','a5','مصروف جديد'],['lock','a6','إقفال الشهر'],['chart','a7','مراجعة الإيراد بالمنجز'],['lock','a10','إقفال السنة'],['scale','a8','ميزان المراجعة'],['chart','a9','الميزانية العمومية'],['calc','a11','توزيع المصروفات العامة'],['box','a12','موازنات المشاريع'],['book','a14','القروض']];
const navHtml=()=>`<div class="grp"><div class="grp-h">المحاسبة</div>`+NAV.map(n=>`<a class="row" href="#${n[1]}" data-go="${n[1]}" title="${n[2]}">${i(n[0])}<span class="lbl">${n[2]}</span></a>`).join('')+'</div>';
$('#nav').innerHTML=navHtml();$('#nav2').innerHTML=navHtml();
$('#closeN').onclick=$('#scrim').onclick=()=>{$('#app').dataset.sheet='0'};
const tgl=()=>{const d=H.dataset.theme?H.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;H.dataset.theme=d?'light':'dark'};
$('#themebtn').onclick=tgl;document.querySelectorAll('.thm').forEach(b=>b.onclick=tgl);
$('#dirbtn').onclick=()=>{const l=H.dir==='rtl';H.dir=l?'ltr':'rtl';H.lang=l?'en':'ar'};
const rail=()=>{$('#app').dataset.rail=(matchMedia('(max-width:1100px)').matches&&innerWidth>820)?'1':'0'};rail();addEventListener('resize',rail);
if(EMBED){document.body.classList.add('embed');$('#strip').remove()}
const ct=()=>document.querySelectorAll('.tab[aria-current="page"]').forEach(t=>t.scrollIntoView({inline:'center',block:'nearest'}));ct();if(document.fonts)document.fonts.ready.then(()=>{ct();if(!location.hash)main.scrollTop=0});
if(location.hash){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView()}
</script>
</body>
