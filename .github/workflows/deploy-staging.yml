name: Deploy to staging

# Merge to main deploys to staging. CLAUDE.md's definition of done includes "Runs on staging, not
# only locally" — that is not true until this pipeline puts it there.
#
# OPEN QUESTION — the staging target is not specified anywhere in spec.md or CLAUDE.md. This workflow
# therefore builds and publishes container images, which is the portable part, and stops at a
# deployment step that is gated on secrets. Filling in that step needs an answer from Nabil: where
# does staging run, and how is it reached? See decisions.md D-023.
#
# ANSWERED 2026-08-25 — Nabil: staging is a VPS, reached over SSH, running the images this workflow
# publishes via deploy/docker-compose.staging.yml. The push trigger is restored in the same change
# that answers D-023, which is what the note here said to do.
#
# It is still safe when nothing is configured: every deploy step is gated on
# `vars.STAGING_DEPLOY_TARGET`, and the check step exits 0 with a warning rather than failing. That
# matters — this ran `on: push` until 2026-08-24 with no target and would have been red on every
# commit, and a workflow that is always red stops being a signal.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lowercase, and literal rather than ${{ github.repository }}, which expands to AhmedNabil30/ERP.
  # A Docker reference must be lowercase — an uppercase tag is refused by the client before the
  # registry is ever contacted — so the interpolated form could never have pushed. Set by Nabil
  # 2026-08-25.
  #
  # This is the one value here that must track the repository if it is ever renamed or moved, and
  # nothing will remind you: the images simply start publishing under a name nothing pulls.
  IMAGE_PREFIX: ahmednabil30/erp

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and publish images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/arm64 is what staging actually runs — an Oracle Cloud ARM machine. Without it the pull
      # on the host failed with `no matching manifest for linux/arm64/v8 in the manifest list
      # entries`: buildx defaults to the runner's platform, and the runners are amd64.
      #
      # amd64 stays in the list because the images are built and run on developer machines to verify
      # them — that is how the web image's 404 and the API's adduser failure were caught on
      # 2026-08-25, before either had ever reached a host.
      #
      # Cross-compiled, not emulated. Both Dockerfiles pin their build stage to $BUILDPLATFORM and
      # target $TARGETARCH, so no QEMU is set up here and none is needed. Adding
      # docker/setup-qemu-action would make this work too, and would make every push minutes slower.
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: src/Web
          file: src/Web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: images
    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      # Deliberately explicit rather than a guessed deployment. Inventing infrastructure would be the
      # same mistake as inventing a business rule: plausible, unreviewed, and wrong.
      - name: Check the target is configured
        run: |
          if [ -z "${{ vars.STAGING_DEPLOY_TARGET }}" ]; then
            echo "::warning::No staging target configured. Images are published and tagged 'staging';"
            echo "::warning::set the STAGING_DEPLOY_TARGET variable and complete this job once Nabil"
            echo "::warning::confirms where staging runs. See decisions.md D-023."
            exit 0
          fi
          echo "Deploying ${{ github.sha }} to ${{ vars.STAGING_DEPLOY_TARGET }}."

      # Copies the compose file from the repository rather than trusting one on the box, so what
      # staging runs is what was reviewed, and a rollback is `git revert` plus a re-run.
      #
      # The host's .env is NOT written here and never will be: JWT_SIGNING_KEY and POSTGRES_PASSWORD
      # live beside the compose file on the host. A secret that passes through a workflow can be
      # printed by any step added later.
      - name: Copy the compose file
        if: vars.STAGING_DEPLOY_TARGET != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: deploy/docker-compose.staging.yml
          target: ${{ vars.STAGING_DEPLOY_TARGET }}
          strip_components: 1

      - name: Pull and restart
        if: vars.STAGING_DEPLOY_TARGET != ''
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
          WEB_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: API_IMAGE,WEB_IMAGE
          # Pinned to the commit SHA, not the `staging` tag. Both are pushed, but deploying the
          # mutable tag makes "what is on staging" unanswerable the moment a second build lands.
          script: |
            set -euo pipefail
            cd "${{ vars.STAGING_DEPLOY_TARGET }}"
            echo "REGISTRY_IMAGE_API=$API_IMAGE" > .env.images
            echo "REGISTRY_IMAGE_WEB=$WEB_IMAGE" >> .env.images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker compose --env-file .env --env-file .env.images -f docker-compose.staging.yml pull
            docker compose --env-file .env --env-file .env.images -f docker-compose.staging.yml up -d
            docker image prune -f

      - name: Smoke check
        if: vars.STAGING_URL != ''
        run: |
          for i in $(seq 1 30); do
            if curl -sf "${{ vars.STAGING_URL }}/api/health" | grep -q '"guardsInstalled":true'; then
              echo "Staging is healthy and its database guards are installed."; exit 0
            fi
            sleep 10
          done
          echo "Staging did not report healthy with guards installed."; exit 1
