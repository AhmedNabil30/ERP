<section class="bab-form" data-testid="bab-form">
  <h1 class="title">{{ i18n.t(titleKey()) }}</h1>

  @if (loadFailed()) {
    <div class="no-source" data-testid="bab-form-no-source">
      <p class="no-source-body" role="alert">{{ i18n.t('bab.item_not_found') }}</p>
      <a class="back-link" routerLink="/babs" data-testid="bab-form-back">
        {{ i18n.t('bab.action.back_to_tree') }}
      </a>
    </div>
  } @else {
    <div class="card">
      <form class="fields" (submit)="$event.preventDefault(); onSubmit()">
        @if (isEdit()) {
          <!-- Locked, generated code — CatalogueForm.dc.html's treatment: a disabled-looking field with
               a lock glyph and a hint that says why, never a bare paragraph. -->
          <kaff-field
            labelKey="bab.field.code"
            controlId="bab-code-input"
            hintKey="bab.field.code_not_editable"
            data-testid="bab-code"
          >
            <div id="bab-code-input" class="input input-locked">
              <bdi class="code-value" translate="no">{{ displayCode() }}</bdi>
              <svg class="lock-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5" y="11" width="14" height="9" rx="2" />
                <path d="M8 11V8a4 4 0 0 1 8 0v3" />
              </svg>
            </div>
          </kaff-field>
        } @else {
          <kaff-field labelKey="bab.field.code" controlId="bab-field-code" [required]="true">
            <input
              id="bab-field-code"
              class="input"
              type="text"
              dir="ltr"
              spellcheck="false"
              autocapitalize="characters"
              data-testid="bab-field-code"
              [formField]="babForm.code"
            />
          </kaff-field>
        }

        <kaff-field labelKey="bab.field.name_ar" controlId="bab-field-name-ar" [required]="true">
          <input
            id="bab-field-name-ar"
            class="input"
            type="text"
            dir="auto"
            data-testid="bab-field-name-ar"
            [formField]="babForm.nameAr"
          />
        </kaff-field>

        <kaff-field labelKey="bab.field.name_en" controlId="bab-field-name-en" [required]="true">
          <input
            id="bab-field-name-en"
            class="input"
            type="text"
            dir="auto"
            data-testid="bab-field-name-en"
            [formField]="babForm.nameEn"
          />
        </kaff-field>

        @if (!isEdit()) {
          <kaff-field labelKey="bab.field.parent" controlId="bab-field-parent">
            <select
              id="bab-field-parent"
              class="input select"
              data-testid="bab-field-parent"
              [attr.aria-label]="i18n.t('bab.field.parent')"
              (change)="onParentChange($event)"
            >
              <option value="" selected>{{ i18n.t('bab.field.no_parent') }}</option>
              @for (bab of parentCandidates(); track trackBab($index, bab)) {
                <option [value]="bab.id">
                  {{ i18n.locale() === 'en' ? bab.nameEn : bab.nameAr }}
                </option>
              }
            </select>
          </kaff-field>

          <kaff-field labelKey="bab.field.sort_order" controlId="bab-field-sort-order">
            <input
              id="bab-field-sort-order"
              class="input"
              type="text"
              dir="ltr"
              inputmode="numeric"
              data-testid="bab-field-sort-order"
              [formField]="babForm.sortOrder"
            />
          </kaff-field>
        }

        <!-- The markup: typed and shown as a PERCENT, never a fraction — `percentToFraction` shifts the
             decimal point only at submission (D-135, AC-204-B). No `Number()` anywhere near this field. -->
        <kaff-field
          labelKey="bab.field.default_markup"
          controlId="bab-field-default-markup"
          [required]="true"
          hintKey="bab.hint.markup_is_a_percent"
          [errorKey]="markupErrorKey()"
          errorTestId="bab-field-default-markup-error"
          #markupField="kaffField"
        >
          <input
            id="bab-field-default-markup"
            class="input"
            type="text"
            dir="ltr"
            inputmode="decimal"
            autocomplete="off"
            data-testid="bab-field-default-markup"
            [attr.aria-describedby]="markupField.describedById()"
            [formField]="babForm.markupPercent"
          />
        </kaff-field>

        @if (refusal(); as key) {
          <p class="refusal" role="alert" data-testid="bab-form-refusal">{{ i18n.t(key) }}</p>
        }

        <div class="footer-row">
          <kaff-button variant="primary" type="submit" testId="bab-submit" [disabled]="!canSubmit()">
            {{ i18n.t('action.save') }}
          </kaff-button>
        </div>
      </form>
    </div>
  }
</section>
