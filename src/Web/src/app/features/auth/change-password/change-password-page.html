<main class="change-password">
  <form class="card" (submit)="$event.preventDefault(); onSubmit()">
    <h1 class="title">{{ i18n.t('auth.password.title') }}</h1>

    <!--
      Shown only for a forced change (AC-101b-F). A voluntary visit to this same screen — the other
      path through the identical endpoint — renders the form with no banner above it.
    -->
    @if (mustChangePassword()) {
      <p class="notice" role="status">{{ i18n.t('auth.password.must_change') }}</p>
    }

    <label class="field">
      <span class="label">{{ i18n.t('auth.field.current_password') }}</span>
      <!--
        AC-103-D. The first field on this form, not a fourth field bolted on beside two "new password"
        boxes — see the component's class comment.
      -->
      <input
        class="input"
        type="password"
        autocomplete="current-password"
        [formField]="changeForm.currentPassword"
      />
    </label>

    <label class="field">
      <span class="label">{{ i18n.t('auth.field.new_password') }}</span>
      <input
        class="input"
        type="password"
        autocomplete="new-password"
        [formField]="changeForm.newPassword"
      />
      <!-- The schema carries the only rule: eight characters. AC-103-E fails if anything else appears. -->
      <span class="hint">{{ i18n.t('auth.password.rule_min_length') }}</span>
    </label>

    <label class="field">
      <span class="label">{{ i18n.t('auth.field.confirm_password') }}</span>
      <input
        class="input"
        type="password"
        autocomplete="new-password"
        [formField]="changeForm.confirmPassword"
      />
      @if (passwordsMismatch()) {
        <span class="hint hint-error">{{ i18n.t('auth.password.mismatch') }}</span>
      }
    </label>

    <p class="hint">{{ i18n.t('auth.password.hint.ends_other_sessions') }}</p>

    <!--
      One region for every server refusal, between the fields and the button — never under a
      particular field. Placement is itself an answer, the same reasoning sign-in-page.html documents:
      this form has two password fields the server can refuse, and a message under one says which.
    -->
    @if (refusalKey(); as key) {
      <p class="refusal" role="alert">{{ i18n.t(key) }}</p>
    }

    @if (changed()) {
      <p class="success" role="status">{{ i18n.t('auth.password.changed') }}</p>
    }

    <button class="submit" type="submit" [disabled]="!canSubmit()">
      {{ i18n.t('action.save') }}
    </button>
  </form>
</main>
