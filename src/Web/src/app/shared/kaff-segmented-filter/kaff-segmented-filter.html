<div
  class="filter-track"
  [class.filter-track--quiet]="quiet()"
  role="group"
  [attr.aria-label]="ariaLabelKey() ? i18n.t(ariaLabelKey()!) : null"
>
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="chip"
      [class.chip--on]="value() === option.value"
      [attr.aria-pressed]="value() === option.value"
      [attr.data-testid]="testIdPrefix() + '-' + option.value"
      (click)="value.set(option.value)"
    >
      {{ option.labelText ?? i18n.t(option.labelKey) }}
    </button>
  }
</div>
