<button
  #trigger
  type="button"
  class="trigger"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="i18n.t(triggerLabelKey())"
  [attr.data-testid]="testId()"
  (click)="onTriggerClick()"
  (keydown)="onTriggerKeydown($event)"
><kaff-icon [name]="'dots'" /></button>

@if (open()) {
  <div
    class="menu"
    role="menu"
    [attr.aria-label]="i18n.t(triggerLabelKey())"
    [style.inset-inline-end.px]="placement().end"
    [style.inset-block-start.px]="placement().top"
    [style.inset-block-end.px]="placement().bottom"
  >
    @for (item of items(); track item.action; let i = $index) {
      <button
        #menuItemRef
        type="button"
        role="menuitem"
        class="menu-item"
        [class.menu-item--danger]="item.tone === 'danger'"
        [class.menu-item--sep]="item.separatorBefore ?? false"
        [disabled]="item.disabled ?? false"
        [attr.data-testid]="testId() ? testId() + '-' + item.action : null"
        (click)="onItemClick(item)"
        (keydown)="onMenuKeydown($event, i)"
      >
        @if (item.icon; as icon) {
          <kaff-icon [name]="icon" [small]="true" />
        }
        <span>{{ i18n.t(item.labelKey) }}</span>
      </button>
    }
  </div>
}
