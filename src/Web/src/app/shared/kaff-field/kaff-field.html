<div class="field">
  <label [for]="controlId()" class="field-label">
    {{ i18n.t(labelKey()) }}
    @if (required()) {
      <span class="required-marker" aria-hidden="true">*</span>
      <span class="sr-only">{{ i18n.t('a11y.required') }}</span>
    }
  </label>

  <ng-content></ng-content>

  @if (messageKey(); as key) {
    <p
      [id]="describedById()"
      class="field-message"
      [class.field-message--error]="errorKey() !== null"
      [attr.data-testid]="errorTestId()"
    >
      {{ i18n.t(key) }}
    </p>
  }
</div>
