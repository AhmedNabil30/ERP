<div
  class="header"
  role="row"
  [attr.data-testid]="testId()"
>
  @for (col of columnDefs(); track $index) {
    <span
      role="columnheader"
      [class]="col.cssClass ?? ''"
      [class.header-cell--end]="col.align === 'end'"
      [class.header-cell--pinned]="col.pinned === true"
      [class.header-cell--lead]="col.lead === true"
      [class.header-cell--trail]="col.trail === true"
    >
      @if (col.markerIcon; as icon) {
        <kaff-icon [name]="icon" [small]="true" />
      }
      @if (col.labelKey) {
        {{ i18n.t(col.labelKey) }}
      }
      @if (col.markerKey; as key) {
        <kaff-badge tone="quiet">{{ i18n.t(key) }}</kaff-badge>
      }
    </span>
  }
</div>
