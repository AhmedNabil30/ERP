<span
  class="badge"
  [class.tone-neutral]="tone() === 'neutral'"
  [class.tone-accent]="tone() === 'accent'"
  [class.tone-warning]="tone() === 'warning'"
  [class.tone-brand]="tone() === 'brand'"
  [class.tone-quiet]="tone() === 'quiet'"
  [class.tone-tag]="tone() === 'tag'"
  [class.badge--pill]="pill()"
  [attr.data-testid]="testId()"
><ng-content></ng-content></span>
