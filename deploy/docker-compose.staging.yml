# Staging. Lives in the repository, not hand-maintained on the box, so what runs there is reviewable
# and a rollback is a git operation rather than an SSH session.
#
# The deploy job copies this file to the host and runs `docker compose pull && up -d` against it.
# Values come from a .env file beside it on the host, which CI never writes and never reads — the
# signing key and the database password are the two things that must not pass through a build log.
#
# Images are published by the same workflow to ghcr.io and tagged `staging`.

name: kaff-staging

services:
  db:
    # Pinned to match CI and docker-compose.yml. The guard script uses NULLS NOT DISTINCT, which
    # needs 15 or later, and a version drift between environments is a guard that passes in one
    # place and not another.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LANG: C.UTF-8
    volumes:
      - kaff-staging-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host. Only the API needs to reach it.
    expose:
      - "5432"

  api:
    image: ${REGISTRY_IMAGE_API}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__KaffDatabase: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Issuer: kaff-erp-staging
      Jwt__Audience: kaff-erp-web-staging
      # From the host's .env. There is no default and there must not be one: appsettings.json ships
      # an empty SigningKey precisely so a missing secret fails loudly instead of running on a
      # placeholder somebody forgot to replace.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set}
      Kaff__ApplyMigrationsOnStartup: "true"
      Kaff__AllowedOrigins__0: ${STAGING_ORIGIN}
      # The audit trail's IP column. nginx is the only thing that can open a connection to this
      # service (`expose`, never `ports`), so without this every audit row would record the nginx
      # container's address rather than the caller's — see decisions.md D-079. The value is the
      # subnet declared at the bottom of this same file, deliberately: the network that carries the
      # proxy and the allowlist that trusts it must not be able to drift apart across two files.
      # If you change one, change the other.
      Kaff__TrustedProxyNetworks__0: "172.28.0.0/24"
      # TWO hops, because there are two proxies: Caddy terminates TLS on 443 and forwards to nginx,
      # nginx forwards to here. Each appends to X-Forwarded-For, so the caller's address sits two
      # entries from the right. Left at the default 1 the middleware would stop after nginx's peer
      # and every audit row would record the address Caddy reached nginx from — D-079's original
      # defect, arriving through a new door. Raising it does not widen trust: every address consumed
      # must still be inside Kaff__TrustedProxyNetworks__0 above.
      #
      # ⚠️ This number is the count of proxies in front of the API. Add or remove one and change it.
      Kaff__ForwardedProxyHops: "2"
    expose:
      - "8080"

  web:
    image: ${REGISTRY_IMAGE_WEB}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # nginx.conf.template proxies /api/ here. The trailing /api/ is load-bearing: nginx substitutes
      # the matched location prefix with this URI, so dropping it would forward /api/health to the
      # API as /health — a route that does not exist, which the API answers 401 rather than 404.
      # That exact mistake was live in ci/serve-e2e.mjs until 2026-08-25.
      KAFF_API_URL: "http://api:8080/api/"
    ports:
      # 8080, not 80. Caddy owns 80 and 443 on this host and terminates TLS; this is the plain-HTTP
      # origin it proxies to, and it is not the way in.
      #
      # ⚠️ Bound to loopback by default, and that is the half of "staging uses HTTPS" that a port
      # number alone does not buy. Published on 0.0.0.0 this port serves the entire application in
      # the clear beside the TLS one, and a browser reaching it would refuse to keep the auth cookie
      # at all — it is `Secure` (D-050), so plain HTTP is not a degraded sign-in, it is a broken one.
      # Set STAGING_HTTP_BIND=0.0.0.0 only if Caddy runs somewhere that cannot reach 127.0.0.1 —
      # and prefer putting a containerised Caddy on this compose network over opening the port.
      - "${STAGING_HTTP_BIND:-127.0.0.1}:${STAGING_HTTP_PORT:-8080}:8080"

volumes:
  kaff-staging-db:

# Pinned rather than left to Compose's default address pool, because the API trusts this subnet to
# have told it the truth about who is calling (Kaff__TrustedProxyNetworks above, decisions.md D-079)
# and an allowlist cannot name a subnet Docker picks at `up` time. Only the three containers here
# are on it. If 172.28.0.0/24 collides with something else on the box, `docker compose up` says so
# loudly — change both this and the API's allowlist entry, which is why they sit in one file.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
